\n\nGenerate a complete documentation package of our compound learning system:\n\n### What to Include\n```\n~/shared/compound-learning-system/\n\u251c\u2500\u2500 README.md                  # Overview, philosophy, setup guide\n\u251c\u2500\u2500 setup/\n\u2502   \u251c\u2500\u2500 settings-hooks.json    # Hook configuration (sanitized)\n\u2502   \u251c\u2500\u2500 rules-template.md      # Pipeline rules template (no personal data)\n\u2502   \u2514\u2500\u2500 install.sh             # Script to set up the directory structure\n\u251c\u2500\u2500 skills/\n\u2502   \u251c\u2500\u2500 compound.md            # /compound skill\n\u2502   \u251c\u2500\u2500 learn.md               # /learn skill\n\u2502   \u251c\u2500\u2500 aha.md                 # /aha skill\n\u2502   \u251c\u2500\u2500 eureka.md              # /eureka skill\n\u2502   \u251c\u2500\u2500 research.md            # /research skill\n\u2502   \u251c\u2500\u2500 investigate.md         # /investigate skill\n\u2502   \u251c\u2500\u2500 scope.md               # /scope skill\n\u2502   \u2514\u2500\u2500 scout.md               # /scout skill\n\u251c\u2500\u2500 knowledge-base/\n\u2502   \u251c\u2500\u2500 SCHEMA.md              # Knowledge base schema\n\u2502   \u251c\u2500\u2500 authority-sources.md   # External research guide\n\u2502   \u2514\u2500\u2500 directory-structure.md # Folder layout explanation\n\u251c\u2500\u2500 hooks/\n\u2502   \u251c\u2500\u2500 score-insights.py      # Scoring engine\n\u2502   \u251c\u2500\u2500 compound-learning-commit.py\n\u2502   \u2514\u2500\u2500 compound-learning-pr.py\n\u2514\u2500\u2500 tests/\n    \u2514\u2500\u2500 test-rules-e2e.sh      # E2E test suite template...", "commands/find.md": "# Find \u2014 Hunt for Answers Across All Sources\n\nSearch across all sources for answers. Can find a single existing solution OR compose multiple partial findings from different sources into a complete answer.\n\n**Usage:**\n- `/find [specific problem or question]`\n- `/find how other teams handle Espresso KEY_TOO_LONG`\n- `/find existing gRPC retry interceptor at LinkedIn`\n- `/find why history mapping fails for V2 identities`\n- `/find Kafka dedup pattern in nearline processors`\n\n## What Makes Find Different\n\n- `/research` = \"What are the options?\" (explores alternatives, includes external)\n- `/scope` = \"How does this system work?\" (maps architecture)\n- `/verify` = \"Is this specific thing true?\" (confirms a hypothesis)\n- **`/find`** = \"Has someone already solved this?\" (hunts for existing solutions to reuse)\n\nFind is about NOT reinventing. The best code is code you don't write.\n\n## Step 1: Parse the Problem\n\nExtract from the user's query:\n- **What exactly needs to be solved?** (the specific problem, not the broad area)\n- **What would a solution look like?** (a library? a pattern? a config? a workaround?)\n- **What keywords would the solution use?** (function names, class names, error messages, config keys)\n\n## Step 2: Search Local Codebase First\n\n### Current repo\n- `Grep` / `Glob` for keywords, class names, error messages, patterns\n- Read tests \u2014 they often demonstrate the intended usage pattern\n- Check util/common/shared directories for existing helpers\n- Search for TODO/FIXME comments mentioning the problem\n\n### Cross-repo (LinkedIn codebase)\n- `unified_context_search` \u2014 **start here when unsure where the answer lives**. Searches code + wiki + Slack + Jira in one call. Use `sources=[\"jarvis\",\"wiki\",\"slack\",\"jira\"]` for broadest coverage.\n- `jarvis_codesearch` with specific function/class/pattern names (see search-guides/code-search.md for filter syntax)\n- `search_semantic_code` with problem description\n- `linkedin-framework:infra-specs-expert` for infrastructure-specific que...", "commands/explore.md": "# Explore \u2014 Build a Mental Model of an Unfamiliar Domain\n\nLearn a new domain from scratch. Not investigating a bug, not scoping a feature \u2014 just building understanding of an area you know nothing (or little) about.\n\n**Usage:**\n- `/explore euler` \u2014 what is Euler, how does it work, how does it relate to my systems\n- `/explore venice` \u2014 what is Venice, when would I use it vs Espresso\n- `/explore d2 service mesh` \u2014 how does D2 routing work\n- `/explore kafka streams vs samza` \u2014 compare two technologies in the LinkedIn context\n- `/explore agent-lifecycle-mt to compare with agentbus` \u2014 side-by-side with gap analysis\n\n## What Makes Explore Different\n\n| Skill | When to use | Source priority |\n|---|---|---|\n| `/scope` | \"Map THIS system for a feature I'm building\" | **Local-first** \u2014 I'm in the repo |\n| `/investigate` | \"Find root cause of THIS bug\" | **Local-first** \u2014 logs, code, config |\n| `/research` | \"Answer THIS question with evidence\" | **Mixed** \u2014 depends on question |\n| `/find` | \"Has someone already solved this?\" | **External-first** \u2014 company knowledge |\n| **`/explore`** | \"I don't know enough to ask the right questions\" | **External-first** \u2014 I'm learning, not debugging |\n\nExplore is the skill you use BEFORE you can use the others. It builds the mental model that makes scope, research, and find effective.\n\n**Key principle: /explore is for things you DON'T know yet.** If it's local and familiar, use /scope or /investigate. /explore goes external-first because the whole point is discovering the unfamiliar.\n\n## Step 0: Detect Mode\n\nParse the user's argument to determine the exploration mode:\n\n- **Single system**: `/explore euler` \u2192 build mental model of one system\n- **Comparison**: `/explore X to compare with Y` or `/explore X vs Y` \u2192 side-by-side analysis with gap analysis, what each can learn from the other\n- **URL**: `/explore https://...` \u2192 fetch and analyze external documentation\n\nAlso detect the **source type** to determine Layer ordering (see Step 2):\n- Linked...", "commands/implement.md": "# Implement \u2014 Execute a Plan Systematically\n\nTake a plan (from Phase 3, a design doc, a Jira ticket, or an OpenSpec spec) and implement it task by task with tracked progress, incremental commits, and continuous verification.\n\n**Usage:**\n- `/implement` \u2014 implement the plan from the current conversation\n- `/implement [plan file or Jira ticket]` \u2014 implement from a specific source\n- `/implement continue` \u2014 resume implementation from where you left off\n\n## What Makes Implement Different\n\n- `/kickoff` = router \u2014 figures out what to do and where to start\n- `/scope` / `/research` = understanding \u2014 builds context before acting\n- **`/implement`** = execution \u2014 takes a plan and builds it, tracking progress\n- `/compound` = retrospective \u2014 captures what was learned after\n\nImplement is the \"do the work\" skill. It assumes you already know WHAT to build (from /scope + /research + plan). Now build it.\n\n## Step 0: Load the Plan\n\nFind the implementation source:\n1. **From conversation**: If Phase 3 just produced a plan, use it directly\n2. **From plan file**: `docs/plans/YYYY-MM-DD-*.md` or a path the user provides\n3. **From Jira ticket**: Pull the ticket description and acceptance criteria\n4. **From OpenSpec**: If an openspec change exists, run `openspec instructions apply --change \"<name>\" --json` to get the task list and context artifacts (proposal, design, spec)\n5. **Resume**: Check `~/.claude/learnings/retrospectives/active-work.md` for in-progress implementation\n\n**Present the plan to the user:**\n```\n## Implementation Plan: [name]\nSource: [plan file / Jira / OpenSpec / conversation]\n\n### Units (N total)\n1. [ ] [Unit 1] \u2014 [goal, files to modify]\n2. [ ] [Unit 2] \u2014 [goal, files to modify]\n...\n\n### Starting with Unit 1. Confirm?\n```\n\nWait for confirmation before starting. (BEHAVIORAL GATE: don't assume \u2014 ask which unit to start with.)\n\n## Step 0.5: Codebase Convention Audit (for non-trivial changes)\n\nBefore writing any code, audit the target codebase to prevent naming, structural, and...", "commands/learn.md": "# Learn \u2014 Quick-Save an Insight\n\nSave a specific insight right now without running the full compound phase. Use when you notice something worth remembering mid-session.\n\n**Usage:** `/learn [what you learned]`\n\nIf no argument provided, ask the user: \"What did you learn or notice that should be saved?\"\n\n## Skill Family: Knowledge Capture (Tier 1)\n\n```\n/learn (fact, +1.0) \u2192 /aha (connection, +1.5) \u2192 /eureka (breakthrough, +2.0)\n```\n\n- **Chains to:** `/aha` (when 3+ related learns cluster), `/compound` (end-of-session)\n- **Called by:** `/investigate`, `/explore`, `/research`, `/compound`\n- **Escalate to `/aha`** when you notice the insight connects multiple prior learns\n- **Escalate to `/eureka`** when the insight fundamentally changes how things should be done\n- **Graduation:** standard path \u2014 `use_count >= 3 AND outcome_score >= 2.0`\n\n## Step 1: Classify the Insight\n\nFrom the user's description, determine:\n- **Track**: `bug` (specific incident/fix) or `knowledge` (general pattern/guidance)\n- **Type**: `episodic` (this specific thing happened) or `semantic` (general principle)\n- **Repos**: Which repos does this apply to? `[\"*\"]` if global.\n- **Tags**: Pick 3-7 from the taxonomy in `~/.claude/learnings/SCHEMA.md`. Use existing tags when possible.\n- **Severity**: How impactful? `critical` / `high` / `medium` / `low`\n- **Rot rate**: How fast will this become stale? `permanent` / `slow` / `medium` / `fast` / `volatile`\n- **Origin skill**: `learn` (set `origin_skill: learn` in frontmatter)\n\n## Step 2: Check for Overlap AND Cluster Detection\n\nRead `~/.claude/learnings/manifest.jsonl`. Two checks:\n\n**Overlap check:**\n- **High overlap**: Update the existing insight file and manifest entry instead of creating new.\n- **Moderate overlap**: Create new but add `related_to` cross-reference.\n- **No overlap**: Create new.\n\n**Cluster detection** (new):\n- Count existing `/learn` insights with overlapping tags in the same repo(s).\n- If **3+ related learns** already exist on the same topi...", "commands/compound.md": "# Compound \u2014 Close the Loop\n\nRun Phase 6 of the engineering pipeline: extract learnings from this session and prepare the knowledge base for the next one.\n\n## Step 1: Gather Context\n\nRead these files to understand what happened this session:\n- `~/.claude/learnings/logs/commit-log.jsonl` (recent commits)\n- `~/.claude/learnings/logs/pr-log.jsonl` (recent PRs)\n- `~/.claude/learnings/logs/review-log.jsonl` (review findings)\n- `~/.claude/learnings/logs/outcome-log.jsonl` (past insight outcomes)\n- `~/.claude/learnings/retrospectives/active-work.md` (ongoing initiatives)\n- `~/.claude/learnings/manifest.jsonl` (existing insights)\n- `~/.claude/projects/-Users-bizhou/memory/MEMORY.md` (memory index)\n\nAlso check recent git history: `git log --oneline -20` in the current repo.\n\n## Step 2: Plan vs Reality\n\nSummarize to the user:\n- What was accomplished this session\n- Where you deviated from plan and why\n- Were any past insights helpful or misleading? Log to `outcome-log.jsonl`: `{timestamp, insight_id, outcome: \"helped\"|\"wrong\", detail: \"...\"}`\n\n## Step 3: Generate Insights\n\nIdentify learnings using **6 analytical perspectives** (inspired by Pluton dreaming system):\n\n1. **Practical** \u2014 What tools, commands, patterns saved time or caused friction?\n2. **Epistemic** \u2014 What new knowledge was gained about systems, APIs, architecture?\n3. **Temporal** \u2014 How did things evolve during the session? What changed from start to end?\n4. **Metacognitive** \u2014 Where did reasoning go wrong? What blind spots were exposed?\n5. **Social/team** \u2014 What stakeholder context, team decisions, or cross-team patterns emerged?\n6. **Causal** \u2014 What caused what? \"X happened because Y\" \u2014 the 5 Whys.\n\nFor each insight found, ask: \"Would this help a future session working in the same area?\"\n\nFormat each insight as: **\"When [situation], do [action] because [reason]\"**\n\nCategorize:\n- **Bug-track** (episodic): Symptoms \u2192 Root Cause \u2192 Fix \u2192 Prevention\n- **Knowledge-track** (semantic): Context \u2192 Guidance \u2192 When to Apply\n...", "commands/qa.md": "# QA \u2014 End-to-End User-Facing Testing\n\nYou are a picky QA tester. Test the system from a user's perspective \u2014 run real commands, verify real behavior, catch what code review misses.\n\n## Input\n\nThe user may provide:\n- A feature or component to test\n- A list of bug fixes to verify\n- Nothing \u2192 test whatever changed recently (check git log)\n\n## Step 1: Scope\n\nUnderstand what to test:\n1. Read the project's CLAUDE.md/README for available commands and expected behavior\n2. Check `git log --oneline -10` for recent changes\n3. If there's a QA findings file, check what was previously reported (retest fixed bugs)\n4. Ask the user if the scope is unclear\n\n## Step 2: Infrastructure Check\n\nBefore testing, verify the system is runnable:\n- Run the health/status command if one exists\n- Check if required services are running (databases, message brokers, servers)\n- Verify credentials/auth if needed\n- Report any blockers before proceeding\n\nIf infrastructure is down, tell the user what's needed and offer to help set it up.\n\n## Step 3: Test Execution\n\nRun tests in this order:\n\n### Happy Path\nTest the primary user workflows end-to-end:\n- The most common operations a user would perform\n- Each new feature that was recently added\n- Commands in the order a real user would run them\n\n### Error Handling\nTest what happens when things go wrong:\n- Invalid inputs (typos, wrong types, empty strings)\n- Missing resources (nonexistent IDs, unreachable services)\n- Permission/auth failures\n- Timeout scenarios (if testable)\n\n### Edge Cases\n- Boundary conditions (empty lists, max values, special characters)\n- State transitions (what happens after cancel? after failure?)\n- Concurrent operations (if applicable)\n\n### Regression\n- Re-test any previously reported bugs that were marked as fixed\n- Verify fixes didn't break adjacent functionality\n\n## Step 4: Record Results\n\nFor each test, capture:\n- **Test number and name**: descriptive, not just \"test 1\"\n- **Command/action**: exactly what was run\n- **Expected result*...", "commands/export-session.md": "# Export Session \u2014 Package a Conversation for Sharing\n\nExport the current or a past conversation as a shareable artifact \u2014 with the system files it produced.\n\n**Usage:**\n- `/export-session` \u2014 export current session\n- `/export-session [session-id or path]` \u2014 export a specific past session\n\n## Step 1: Gather the Conversation\n\nUse `/export` to get the raw conversation transcript, or read the provided file.\n\n## Step 2: Gather Associated Artifacts\n\nIdentify all files created or modified during the session:\n- Check `~/.claude/learnings/logs/commit-log.jsonl` for commits made\n- Check git diff for files changed\n- Check timestamps on files in `~/.claude/commands/`, `~/.claude/rules/`, `~/.claude/hooks/`, `~/.claude/learnings/`\n- List all artifacts created/modified with their purpose\n\n## Step 3: Create the Package\n\nBuild a shareable package at `~/shared/sessions/YYYY-MM-DD-[topic]/`:\n\n```\n~/shared/sessions/YYYY-MM-DD-[topic]/\n\u251c\u2500\u2500 README.md                    # What this session accomplished, key takeaways\n\u251c\u2500\u2500 conversation.md              # The full conversation, cleaned up\n\u251c\u2500\u2500 artifacts/                   # All files created/modified\n\u2502   \u251c\u2500\u2500 commands/                # Skills created\n\u2502   \u251c\u2500\u2500 rules/                   # Rules created/updated\n\u2502   \u251c\u2500\u2500 hooks/                   # Hook scripts\n\u2502   \u251c\u2500\u2500 learnings/               # Knowledge base files\n\u2502   \u2514\u2500\u2500 tests/                   # Test files\n\u251c\u2500\u2500 highlights.md                # Key decision points and insights extracted\n\u2514\u2500\u2500 adoption-guide.md            # How someone else can adopt these patterns\n```\n\n## Step 4: Clean the Conversation\n\nProcess the raw transcript:\n1. **Remove sensitive data** \u2014 credentials, internal URLs, personal info, test data IDs\n2. **Keep the thinking** \u2014 the WHY behind decisions is more valuable than the WHAT\n3. **Mark key moments** \u2014 where did the design pivot? Where was a breakthrough?\n4. **Add section headers** \u2014 break the conversation into logical phases\n\n## Step 5: Write Highlights\n\nExtract the most valuable...", "commands/scope.md": "# Scope \u2014 Understand the System Before Designing\n\nMap the existing system, trace data flows, and understand constraints before proposing a design. Use when starting a new project, getting a PRD, or entering an unfamiliar codebase area.\n\n**Usage:** `/discover [feature/project/area to understand]`\n\nIf no argument, ask: \"What area or feature do you need to understand?\"\n\n## Step 0: Understand the WHY\n\nBefore mapping the system, understand what the user/PM actually wants:\n1. **What's the goal?** Not the feature \u2014 the business outcome. Why does this matter?\n2. **Who's the customer?** End user? Internal team? Another service?\n3. **What does success look like?** How will we know this worked?\n4. **What's the scope?** What's explicitly in and out?\n5. **Are there constraints?** Timeline, dependencies, tech limitations, team bandwidth?\n\nIf a PRD/doc exists, read it first. Challenge assumptions: \"Is this the right problem to solve?\"\n\n## Step 1: Map the Current State\n\n**Lead with substance, not plumbing.** For every component you discover, explain WHAT the data represents and WHY it exists before describing HOW it flows. \"Espresso table X\" is plumbing \u2014 \"candidate hiring state transitions tracked for real-time pipeline display\" is substance.\n\n### 1a. Code-Level Discovery\n- Trace a single piece of data end-to-end through the relevant feature area (follow the data, not the architecture)\n- Identify entry points (API endpoints, Kafka consumers, cron jobs)\n- Follow the code path: controller \u2192 service \u2192 processor \u2192 storage\n- Map the data model: what entities exist, how they relate, where they're stored\n- Identify the business logic \u2014 where are the rules? What are the invariants?\n- **Mine commit history**: `git log --oneline -20 <key file>` and `git blame` on non-obvious code. When something looks complex, the commit message often explains why.\n\n### 1b. Service-Level Discovery\n- Which services are involved? Who owns them?\n- What are the interfaces between services? (gRPC, REST, Kafka, E...", "commands/investigate.md": "# Investigate \u2014 Find Root Cause\n\nStructured investigation workflow for debugging, incident response, and \"why is this broken\" scenarios. Follows the hypothesis-first approach with 5 Whys until root cause is found.\n\n**Usage:** `/investigate [symptom or problem description]`\n\nIf no argument, ask: \"What's the symptom or problem you're seeing?\"\n\n## Parallel Mode (for complex incidents)\n\nWhen the symptom spans multiple services or the root cause is unclear, use parallel sub-agents to test hypotheses simultaneously instead of one linear investigation:\n\n```\nSpawn 3 parallel Agent calls:\n\nAgent 1 \u2014 Code Regression Hunt:\n  Search for recent code changes in the affected service path (git log, grep for recent PRs).\n  Check: did anything deploy in the last 24h that touches this code path?\n\nAgent 2 \u2014 Log & Trace Analysis:\n  Use observe-agent to search logs for error patterns, duplicate calls, or upstream failures.\n  Quantify: how many errors? Which callers? What's the blast radius?\n\nAgent 3 \u2014 Config & Deploy Correlation:\n  Check LiX ramps, config changes, deployment history.\n  Correlate: did any change happen at the same time as the symptom?\n```\n\nEach agent reports: (1) evidence found/not found, (2) confidence 1-5, (3) specific trace/log links.\nSynthesize into a ranked root cause analysis before presenting to the user.\n\n**When to use parallel mode:** User says \"investigate\" with no clear direction, or symptom involves 2+ services, or initial hypothesis was wrong.\n**When to skip:** User already pointed to a specific file/service \u2014 go there directly (trust user direction).\n\n## Step 0: Check Past Knowledge\n\nBefore investigating from scratch:\n1. Read `~/.claude/learnings/agent-briefing.md` \u2014 has this been seen before?\n2. Search `~/.claude/learnings/manifest.jsonl` filtering by `track: bug` + matching tags/repo/error patterns.\n3. If a matching episodic insight exists, present it: \"This looks similar to [bug-XXX]. Last time the root cause was X. Want to verify if it's the same issue?\"...", "commands/eureka.md": "# Eureka \u2014 Capture a Breakthrough\n\nSave a breakthrough discovery \u2014 a novel solution, non-obvious approach, or fundamental insight that changes how things should be done. Eurekas are rare and high-value. They often lead to architecture changes, new tools, or significant productivity improvements.\n\n**Usage:** `/eureka [the breakthrough]`\n\nIf no argument, ask: \"What did you discover that changes things?\"\n\n## Skill Family: Knowledge Capture (Tier 1)\n\n```\n/learn (fact, +1.0) \u2192 /aha (connection, +1.5) \u2192 /eureka (breakthrough, +2.0)\n```\n\n- **Chains from:** `/aha` (when a connection reveals something fundamental), `/investigate` (when fix reveals a better paradigm)\n- **Chains to:** memory/rules promotion (immediate candidate), `/share` (team-level impact)\n- **Called by:** `/compound` (retrospective)\n- **De-escalate to `/aha`** if on reflection it connects dots but doesn't change the approach\n- **De-escalate to `/learn`** if on reflection it's a single non-obvious fact\n- **Graduation:** immediate candidate \u2014 ask user at capture time if it should promote to `memory/` or `~/.claude/rules/`\n\n## What Makes a Eureka Different\n\n- `/learn` = a fact: \"Config X has value Y\"\n- `/aha` = a connection: \"Problem A and problem B share root cause C\"\n- `/eureka` = a breakthrough: \"We can eliminate the entire class of problem by doing Z instead\"\n\nEurekas are about finding a fundamentally better way \u2014 not just fixing a bug or connecting dots, but discovering an approach that makes previous approaches obsolete.\n\n## Step 1: Capture the Breakthrough\n\nAsk the user (if not already clear):\n- What's the new approach or discovery?\n- What does it replace or make unnecessary?\n- Why is this non-obvious? (What did people assume before that turned out wrong?)\n- How big is the impact? (One service? All services? The team's workflow?)\n\n## Step 2: Validate the Insight\n\nBefore saving, do a quick sanity check:\n- Search `~/.claude/learnings/manifest.jsonl` \u2014 has someone already documented this?\n- Search the code...", "commands/lix.md": "# LiX Management Skill\n\nManage LinkedIn Experiments (LiX) from Claude. Supports eval, iterate, create, and show.\n\n## Subcommands\n\n### `eval <key>` \u2014 Check what treatment a user gets\n\nWraps `lix-cli`. Quick check of current treatment value.\n\n```bash\nlix-cli <key> [-l <ldap>] [-mp <multiproduct>] [-f <fabrics>]\n```\n\n**Examples:**\n- `/lix eval talent.connected.project.phase2.enabled`\n- `/lix eval talent.connected.project.phase2.enabled -l bizhou -mp hp-ats-integration-mt`\n\n**Steps:**\n1. Run `lix-cli` with the provided key and any flags\n2. Report the treatment value\n3. If `control` or empty, note that the lix may not be ramped for this user/context\n\n**KNOWN LIMITATION:** `lix-cli` only evaluates with `entity=urn:li:corpuser:<ldap>`.\nIt CANNOT evaluate lixes targeted by `dataProvider`, `contractUrn`, `enterpriseAccount`, etc.\nFor those, use one of:\n- **TReX Treatment Lookup UI**: https://trex.corp.linkedin.com/trex/member-treatments\n  (enter key + custom entity URN like `urn:li:developerApplication:225950754`)\n- **Direct lix-proxy curl** (corp fabric only):\n  ```bash\n  curl -s \"https://lix-proxy.corp.linkedin.com/corp-lca1/lix-proxy/lixTreatments/<KEY>?entity=<ENTITY_URN>\" \\\n    --cacert /etc/lipki/ca-bundle.crt\n  ```\n  Note: returns `{\"treatment\":\"<value>\",\"segment\":<n>}`. Corp fabric only \u2014 prod fabric unreachable from Mac.\n- **Prod shell**: SSH to a prod shell and curl lix-proxy from there for prod fabric evaluation.\n\nAlso: `-f prod-ltx1` flag tries to connect directly to prod hosts which are unreachable from Mac \u2014 it will error and default to `control`.\n\n---\n\n### `iterate <testId>` \u2014 Create a TReX iteration (experiment)\n\nThe high-value command. Creates an iteration on an existing TReX test via the lix-gui V3 API.\n\n**API:** `POST https://trex.corp.linkedin.com/lix-gui/api/v3/experiments/`\n\nNote: The V3 endpoint is `/api/v3/experiments/` (NOT `/api/v3/tests/{testId}/experiments`).\nThe `testId` goes in the request body.\n\n**Auth:** TReX SSO cookies stored at `/tmp/.trex-...", "commands/aha.md": "# Aha \u2014 Capture a Connection\n\nSave a moment of synthesis \u2014 when you see a pattern across incidents, a connection between systems, or realize that separate problems share a root cause. This is how episodic memories become semantic wisdom.\n\n**Usage:** `/aha [the connection you see]`\n\nIf no argument, ask: \"What pattern or connection did you just notice?\"\n\n## Skill Family: Knowledge Capture (Tier 1)\n\n```\n/learn (fact, +1.0) \u2192 /aha (connection, +1.5) \u2192 /eureka (breakthrough, +2.0)\n```\n\n- **Chains to:** `/eureka` (when connection reveals a fundamentally better approach)\n- **Chains from:** `/learn` (when 3+ learns cluster on same topic)\n- **Called by:** `/investigate` (root cause matches prior incidents), `/compound` (retrospective)\n- **Escalate to `/eureka`** when the connection doesn't just explain \u2014 it changes the approach\n- **De-escalate to `/learn`** if on reflection it's a single fact, not a cross-cutting pattern\n- **Graduation:** fast-track \u2014 `use_count >= 2 AND outcome_score >= 1.5` (patterns are inherently higher value)\n\n## What Makes an Aha Different from a Learn\n\n- `/learn` = a fact: \"Service X uses config Y\"\n- `/aha` = a connection: \"The timeout in service X and the retry storm in service Y are caused by the same upstream bottleneck\"\n- Aha insights are ALWAYS `type: semantic` \u2014 they're generalizations synthesized from specific observations.\n\n## Step 1: Capture the Connection\n\nAsk the user (if not already clear):\n- What separate things are connected?\n- What's the common thread or root cause?\n- What does this mean for future work?\n\n## Step 2: Find the Source Episodes\n\nSearch `~/.claude/learnings/manifest.jsonl` for the episodic insights that this aha connects. These are the raw observations that led to the synthesis.\n\nLink them: set `synthesized_from: [\"episode-id-1\", \"episode-id-2\", ...]` in the new insight.\n\n**Auto-suggest sources:** If the user just says the pattern without listing sources, search the manifest by overlapping tags and repos to find likely candi...", "commands/kickoff.md": "# Kickoff \u2014 Smart Orchestrator\n\nAssess what the user needs and guide them through the right skills in the right order. NOT a rigid pipeline \u2014 adapts to context, skips what's unnecessary, loops back when needed.\n\n**Usage:**\n- `/kickoff [anything]` \u2014 describe what you want to do, the orchestrator figures out the path\n\n## Step 1: Assess Intent\n\nRead the user's input and classify:\n\n| Intent | Signals | Start With |\n|--------|---------|------------|\n| **New feature** | \"add\", \"build\", \"create\", \"implement\", PRD, Jira ticket | `/scope` \u2192 clarify \u2192 plan (or `mae-core:architect` for complex) \u2192 execute |\n| **Complex design** | \"architect\", \"design system\", \"plan large\", multi-service | `mae-core:architect` (parallel Claude + Codex planners) |\n| **Bug fix** | \"fix\", \"broken\", \"error\", \"bug\", specific symptom | `/investigate` \u2192 fix \u2192 test |\n| **Debugging** | \"why\", \"failing\", \"not working\", alert, PEM | `/investigate` |\n| **Oncall** | \"alert\", \"pager\", \"incident\", \"sev\" | `/oncall` |\n| **Exploration** | \"how does\", \"understand\", \"what is\", \"map\" | `/scope` |\n| **Find existing** | \"is there\", \"has anyone\", \"existing\", \"already\", \"reuse\" | `/find` |\n| **Research** | \"best practice\", \"should we\", \"compare\", \"options\" | `/research` |\n| **Refactor** | \"clean up\", \"simplify\", \"refactor\", \"migrate\" | `/scope` \u2192 plan \u2192 execute |\n| **Continue** | \"resume\", \"where was I\", \"continue\" | Read `active-work.md` \u2192 resume at last phase |\n\nIf unclear, ask ONE question: \"Are you building something new, fixing something broken, or exploring?\"\n\n## Step 2: Run the Appropriate Skill\n\nDon't re-implement skills \u2014 invoke them. Each skill already has its full workflow defined.\n\n## Step 3: At Each Skill's Completion, Suggest What's Next\n\nThis is the key integration point. When a skill finishes, the orchestrator suggests (not forces) the natural next step:\n\n```\nAfter /scope completes:\n  \u2192 \"Found 3 unknowns. Want to /research them?\"\n  \u2192 \"This looks like something others may have solved. /find existing solu...", "commands/recipe.md": "# Recipe \u2014 Create or Run Lightweight Automation\n\nCreate, run, or manage recipes \u2014 mechanical checklists that don't need judgment.\n\n**Usage:**\n- `/recipe run [name] [inputs...]` \u2014 run an existing recipe\n- `/recipe create [name]` \u2014 create a new recipe interactively\n- `/recipe list` \u2014 list all available recipes\n- `/recipe from-history` \u2014 create a recipe from steps you just performed\n\n## Run a Recipe\n\n1. Find the recipe in `~/.claude/commands/recipes/[name].md`\n2. If recipe has `project:` field, check we're in the right repo\n3. Substitute `{{input}}` placeholders with provided values\n4. Execute steps sequentially\n5. At each step, check for success/failure\n6. **On failure**: check the recipe's `## On Failure` section\n7. **Chain condition met**: if `chain_when` condition matches, suggest the chained skill:\n   \"Recipe detected [condition]. Escalating to `/[chain_to]`.\"\n8. Present results\n\n## Create a Recipe\n\nAsk the user:\n1. **What does it do?** (one sentence)\n2. **What inputs does it need?** (parameters)\n3. **What are the steps?** (walk through them \u2014 can demonstrate by doing)\n4. **What does success look like?**\n5. **What should happen on failure?** (chain to a skill? retry? alert?)\n6. **Is it project-specific?** (which repo, or global?)\n\nWrite to `~/.claude/commands/recipes/[name].md` using the recipe format from README.md.\n\nAfter creation, ask: \"Run `/integrate [name]` to wire it in?\"\n\n## Create from History (`/recipe from-history`)\n\nThis is the power move. When the user just performed a multi-step task manually:\n\n1. Look at the recent conversation \u2014 what commands were run? What files were read/edited?\n2. Extract the mechanical steps (skip the thinking/judgment parts)\n3. Identify which values should become `{{input}}` parameters\n4. Identify where things could fail and what skill should handle it\n5. Generate the recipe and present it for approval\n\nExample:\n```\nUser just ran:\n  go-status -f prod-ltx1 -a hp-ats-integration-mt\n  git log --oneline -5\n  gh pr list --state mer...", "commands/verify.md": "# Verify \u2014 Confirm a Hypothesis Against Internal Sources\n\nTrace through code, company knowledge, and internal systems to confirm or disprove a specific claim, hypothesis, or assumption. Not exploring \u2014 verifying.\n\n**Usage:**\n- `/verify [hypothesis or claim to check]`\n- `/verify the Euler secondary index for FIND_HIRE_ENTITY_REQUEST was added after entity creation`\n- `/verify ts-api finder returns empty because staging fabric mismatch`\n\nIf no argument, ask: \"What do you want to verify?\"\n\n## What Makes Verify Different\n\n- `/research` = \"What are the options?\" (broad, exploratory)\n- `/scope` = \"How does this system work?\" (mapping)\n- `/investigate` = \"Why is this broken?\" (root cause)\n- **`/verify`** = \"Is this specific thing true?\" (confirmation/disproval)\n\nVerify is surgical. You start with a claim and end with: confirmed, disproved, or inconclusive + what's needed to resolve.\n\n## Step 1: Parse the Claim\n\nBreak the hypothesis into verifiable sub-claims. For example:\n```\nClaim: \"Euler secondary index for FIND_HIRE_ENTITY_REQUEST_BY_CANDIDATE_AND_STATUS_DISMISSED \n        was added after the entity was created\"\n\nSub-claims:\n  1. The secondary index exists in the code \u2192 check Espresso schema / entity definition\n  2. When was it added \u2192 git log / blame on the index definition\n  3. When was the entity created \u2192 check data timestamp or creation PR\n  4. Was there a backfill \u2192 search Jira/Slack for backfill tickets\n```\n\n## Step 2: Trace Through Code\n\nFor each sub-claim, go to the source of truth:\n\n### Code-level verification\n- **Read the actual code** \u2014 don't rely on docs or memory. `grep`, `Glob`, `Read` the files.\n- **Git blame / git log** \u2014 when was this line added? By whom? What PR?\n- **Check tests** \u2014 does a test exercise this code path? What does it assert?\n- **Trace the call chain** \u2014 follow the code from entry point to the specific behavior\n- **Check config** \u2014 feature flags, LiX, application.src, deployment config\n\n### Cross-repo verification\n- **jarvis_codesearch**...", "commands/worklog.md": "# Worklog \u2014 Track What You Did\n\nView, edit, and export your work log. Auto-populated by hooks, manually adjustable.\n\n**Usage:**\n- `/worklog` \u2014 show today's work log\n- `/worklog week` \u2014 show this week's summary\n- `/worklog standup` \u2014 generate standup update (yesterday + today's plan)\n- `/worklog add [what you did]` \u2014 manually add an entry\n- `/worklog export [range]` \u2014 export for perf review or handoff\n\n## Where Worklogs Live\n\n```\n~/.claude/learnings/logs/worklog.jsonl\n```\n\nEach entry:\n```json\n{\n  \"timestamp\": \"2026-04-01T14:30:00Z\",\n  \"type\": \"commit|pr|investigation|review|oncall|meeting|other\",\n  \"repo\": \"hp-ats-integration-mt\",\n  \"summary\": \"Fixed V2 identity mismatch in stage sync\",\n  \"details\": \"PR #530 \u2014 updated TransformerContext with V1/V2 helpers\",\n  \"duration_min\": 45,\n  \"jira\": \"HPCP-1234\",\n  \"tags\": [\"phase2\", \"identity\", \"bug-fix\"],\n  \"source\": \"auto|manual\"\n}\n```\n\n## Auto-Capture (via hooks)\n\nThe SessionEnd compound agent should append worklog entries for:\n- **Every commit** this session (from commit-log.jsonl)\n- **Every PR** created or updated (from pr-log.jsonl)\n- **Every investigation** run (from conversation context)\n- **Key decisions** made\n- **Time estimates** \u2014 session start to end\n\n## Manual Entry\n\n`/worklog add` for things hooks can't capture:\n- Meetings, design discussions, code reviews of others' PRs\n- Offline work (whiteboarding, reading docs, pair programming)\n- Context-switching overhead\n\n## Views\n\n### `/worklog` (today)\n```\n## Work Log \u2014 2026-04-01\n\n### Commits (3)\n- [14:30] hp-ats-integration-mt: Fixed V2 identity mismatch (PR #530)\n- [15:45] hp-ats-integration-mt: Added regression tests for V1/V2\n- [16:20] hp-ats-integration-mt: Updated stage sync to use V2 for mappings\n\n### Investigations (1)\n- [10:00-11:30] Investigated PEM availability dip on pipeline surface \u2014 root cause: canary deploy with config regression\n\n### PRs (1)\n- [16:30] Created PR #530: Fix V1/V2 HireIdentity mismatch in stage sync\n\n### Insights Captured (2)\n- [learn] V2 ...", "commands/research.md": "# Research \u2014 Deep Investigation Before Action\n\nRun Phase 1 of the engineering pipeline as a standalone skill. Use when you want thorough research before making decisions, or when investigating without implementing.\n\n**Usage:** `/research [topic or question]`\n\nIf no argument provided, ask the user: \"What do you want to research?\"\n\n## Layer 1: Local Knowledge (always)\n\n1. Read `~/.claude/learnings/agent-briefing.md` for session context and hot insights.\n2. Search `~/.claude/learnings/manifest.jsonl` for related insights \u2014 filter by tags/repo matching the topic. Read top 3-5 matched insight files.\n3. Read relevant memory files from `~/.claude/projects/-Users-bizhou/memory/` (check MEMORY.md index first).\n4. Search git history in the current repo: `git log --oneline --all --grep=\"keyword\" -20` and `git log --oneline -30` for recent changes in the area.\n5. Search for related PRs: `gh pr list --search \"keyword\" --state all --limit 10`.\n6. Read the code \u2014 look for business logic, understand why systems were built the way they are. If documentation doesn't exist, the code is the documentation. Use `jarvis_codesearch` for cross-repo (see search-guides/code-search.md for filter syntax).\n7. Check logs/metrics \u2014 use `observe-agent` to verify runtime behavior matches code expectations. See search-guides/logs-metrics.md.\n\n## Layer 2: Company Knowledge (for non-trivial topics)\n\n8. **Broad search first**: Use `unified_context_search` to search code + wiki + Slack + Jira in one call when you're not sure where the answer lives.\n9. **Jira**: Search for related tickets (open AND resolved/closed). Use `search_jira_issues`. Look for prior art, design decisions, known issues, rejected approaches. See search-guides/jira.md.\n10. **Confluence**: Search for design docs, architecture decisions, runbooks. Use `search_confluence_content` or `get_confluence_page`. See search-guides/wiki-confluence.md.\n11. **Slack**: Search for recent discussions \u2014 use the exception-first pattern for errors. Use `...", "commands/think.md": "# Think \u2014 Open-Ended Thinking Partner\n\nEnter thinking mode. This is a **stance, not a workflow.** No mandatory steps, no required outputs. Just a thinking partner helping you reason through something.\n\nInspired by OpenSpec's explore mode.\n\n**Usage:**\n- `/think` \u2014 just start, no topic needed\n- `/think should we split this into two services?`\n- `/think I'm not sure the current approach is right...`\n- `/think what are we missing?`\n\n## The Stance\n\n- **Curious, not prescriptive** \u2014 ask questions that emerge naturally, don't follow a script\n- **Open threads, not interrogations** \u2014 surface multiple interesting directions, let the user follow what resonates\n- **Visual** \u2014 use ASCII diagrams liberally when they'd help clarify thinking\n- **Grounded** \u2014 explore the actual codebase when relevant, don't just theorize\n- **Patient** \u2014 don't rush to conclusions, let the shape of the problem emerge\n- **Adaptive** \u2014 follow interesting threads, pivot when new information surfaces\n- **Challenging** \u2014 push back gently when assumptions seem shaky\n\n## What You Might Do\n\nDepending on what the user brings:\n\n**Explore the problem space**\n- Ask clarifying questions that emerge from what they said\n- Challenge assumptions \u2014 \"Is this the real problem?\"\n- Reframe \u2014 \"What if we looked at it from the user's perspective?\"\n- Find analogies \u2014 \"This reminds me of how [X] handles [Y]\"\n\n**Compare approaches**\n- Lay out trade-offs side by side\n- Ask \"what's the simplest version?\"\n- Ask \"what would we regret in 6 months?\"\n\n**Unblock thinking**\n- When stuck: \"What would the answer look like if we already had it?\"\n- When overwhelmed: \"What's the one thing we need to figure out first?\"\n- When debating: \"What would change your mind?\"\n\n**Ground in reality**\n- Read the actual code when relevant\n- Check how peer services handle this\n- Search for prior art or existing patterns\n\n## What NOT to Do\n\n- **Do NOT implement.** No code changes. If the user wants to build, suggest `/implement` or `/kickoff`.\n- **Do NOT fol...", "commands/dream.md": "# Dream \u2014 Memory Consolidation\n\nRun the full dream cycle: mechanical consolidation (dream.py) followed by intelligent review (LLM-powered). Use overnight via VM cron, or manually when you want to consolidate now.\n\n**Usage:** `/dream` or `/dream --quick` (skip intelligent phase)\n\n## Phase 1: Mechanical (dream.py)\n\nRun the standalone dream script \u2014 deterministic, no LLM calls:\n\n```bash\npython3 ~/projects/compound-learning-ecosystem/memory-migration/scripts/dream.py\n```\n\nThis handles:\n- **NREM**: Score staging insights from outcome-log.jsonl\n- **REM**: Graduate (score>=2 + uses>=3), prune (score<-2), flag stale (>90 days)\n- **SORT**: Classify Claude's flat writes in memory/ root into correct subdirs\n- **REBUILD**: Rebuild all MEMORY.md indexes (global + projects + rules/guides)\n- **PROJECTS**: Process per-project memories (staleness, duplicates)\n- **SYNTHESIZE**: Cross-project pattern detection, insight\u2194project linking\n\nReport the results to the user after running.\n\n## Phase 2: Intelligent Review (LLM-powered)\n\nAfter dream.py runs, review the results and do what the script can't:\n\n### 2a. Sort Ambiguous Files\nCheck if dream.py left any unsorted files (reported in its output as \"UNSORTED\"). For each:\n- Read the file content\n- Determine the correct subdirectory based on semantic understanding\n- Move it there\n- If it's project-specific, identify which project\n\n### 2b. Review Stale Content\nFor any files flagged stale by dream.py:\n- Read the file\n- Check if the content is still accurate (read referenced code files, check if APIs/patterns still exist)\n- If still valid: update `last_verified` date\n- If outdated: update the content, or mark for user review\n- If obsolete: suggest removal to the user\n\n### 2c. Cross-Project Synthesis\nLook for patterns that dream.py's keyword matching might miss:\n- Read project memories from the top 2-3 active projects\n- Identify recurring themes, repeated feedback, common gotchas\n- For each pattern found in 2+ projects:\n  - Check if a staging ins...", "commands/review.md": "# Review \u2014 Picky Code Review\n\nYou are a super picky, critical code reviewer. Assume nothing works until proven otherwise.\n\n## Input\n\nThe user may provide:\n- A git diff, branch, or PR reference \u2192 review those changes\n- A file or directory \u2192 review that code\n- Nothing \u2192 review all unstaged/staged changes in the current repo\n\n## Step 1: Gather Changes\n\nDetermine what to review:\n- If a PR number: `gh pr diff <number>`\n- If a branch: `git diff main...<branch>`\n- If files specified: read those files\n- If nothing: `git diff` (unstaged) + `git diff --cached` (staged) + `git status` for new files\n\nRead every changed file in full (not just the diff) to understand context.\n\n## Step 2: Review Dimensions\n\nExamine the changes through these lenses, in order:\n\n### Correctness (Critical)\n- **Logic bugs**: off-by-one, null/None handling, wrong conditions, missing edge cases\n- **Type mismatches**: wrong argument types, missing conversions, incompatible interfaces\n- **Resource leaks**: unclosed connections, missing finally/cleanup, dangling async tasks\n- **Concurrency**: race conditions, unsafe shared state, missing locks, signal handler safety\n- **Error handling**: swallowed exceptions, missing try/except, error paths that crash\n\n### Security\n- **Injection surfaces**: shell injection, SQL injection, XSS, template injection\n- **Auth gaps**: missing permission checks, exposed endpoints, default credentials\n- **Data exposure**: secrets in code, overly permissive bindings (0.0.0.0), verbose errors leaking internals\n\n### API Contract\n- **Breaking changes**: removed/renamed fields, changed return types, new required params\n- **Backwards compatibility**: do callers still work? Are error codes preserved?\n- **Documentation vs behavior**: do docstrings/comments match what the code does?\n\n### Test Coverage\n- **New code without tests**: every new function/class/endpoint should have test coverage\n- **Edge cases**: are boundary conditions tested? Error paths? Empty inputs?\n- **Test quality**: do te...", "commands/integrate.md": "# Integrate \u2014 Wire a New Skill Into the Ecosystem\n\nAfter creating or modifying a skill, automatically update all connected components so the ecosystem stays coherent.\n\n**Usage:**\n- `/integrate [skill-name]` \u2014 integrate a specific new/modified skill\n- `/integrate all` \u2014 re-integrate all custom skills (full ecosystem sync)\n\n## What Gets Updated\n\nWhen a new skill is created, these components need to know about it:\n\n### 1. Rules (MEMORY.md)\n\nRead `~/.claude/rules/MEMORY.md`. Check if the new skill should be:\n- **Referenced in the pipeline phases** \u2014 does it belong in Research, Clarify, Plan, Execute, Review, or Compound?\n- **Added to proactive suggestions** \u2014 when should the agent suggest this skill unprompted?\n- **Connected to existing rules** \u2014 does it reinforce or extend an existing rule?\n\nIf yes, update the relevant section. Don't add bloat \u2014 only add if the skill fills a gap.\n\n### 2. Kickoff Orchestrator\n\nRead `~/.claude/commands/kickoff.md`. Check:\n- **Intent routing table** \u2014 should this skill appear as a starting point for a new intent?\n- **Handoff suggestions** \u2014 should other skills suggest this one as a next step?\n- **Skill map** \u2014 update the skill map at the bottom if it exists\n\n### 3. Knowledge Base Schema (SCHEMA.md)\n\nRead `~/.claude/learnings/SCHEMA.md`. Check:\n- **New tags needed** \u2014 does the skill introduce a new domain that needs tag taxonomy entries?\n- **New track type** \u2014 does it need a new insight track (like review-track, decision-track)?\n- **Task-type router** \u2014 should the scoring sy . Execute the Judge\n\nFor each judge input file in the manifest:\n\n1. Read the judge input\n2. Send to an LLM (use yourself \u2014 read the input and produce the verdict JSON)\n3. Follow the judge_prompt.md instructions exactly\n4. Save the verdict to `~/.claude/evals/results/agent-quality/verdict_{session_id}.json`\n\n**Important**: The judge is YOU reading the session transcripts and producing structured\nverdicts. This is the \"LLM-as-judge\" pattern from the Oracle system. Be rigorous.\nFollow the taxonomy. Don't be generous \u2014 honest assessment drives real improvement.\n\nAfter all sessions are ju...", "commands/scout.md": "# Scout \u2014 Learn from Other Agent Systems\n\nEvaluate another plugin, repo, rules file, or agent framework and extract patterns worth adopting. Can target a specific repo OR do a broad ecosystem scan.\n\n**Usage:**\n- `/scout https://github.com/someone/cool-plugin` \u2014 evaluate a specific repo\n- `/scout ecosystem` \u2014 broad scan for new ideas across the AI coding agent ecosystem\n- `/scout trending` \u2014 find what's new and popular in Claude Code / AI agent space\n\n## Mode 1: Evaluate a Specific Repo\n\n### Step 1: Read Their System\n- Clone or fetch the repo structure (use `gh api` for tree, `WebFetch` for raw files)\n- Identify their skills/commands, rules, hooks, agents, knowledge management\n- Read their CLAUDE.md, AGENTS.md, README, and key skill files\n\n### Step 2: Compare With Our System\nFor each component they have, assess:\n\n| Their Component | Do We Have It? | Ours Better / Theirs Better / Different Approach? |\n|----------------|----------------|--------------------------------------------------|\n\nFocus on:\n- **Skills/commands we don't have** \u2014 could they fill a gap?\n- **Different approaches to same problem** \u2014 is theirs more elegant?\n- **Novel patterns** \u2014 something we haven't thought of?\n- **Knowledge management** \u2014 how do they handle memory, learning, retrieval?\n- **Hook design** \u2014 any clever automation we're missing?\n- **Prompt engineering techniques** \u2014 better instructions, persuasion, formatting?\n\n### Step 3: Extract Actionable Ideas\nFor each finding worth adopting:\n```\n### Idea: [name]\n- **Source**: [repo/file]\n- **What they do**: [description]\n- **What we do now**: [our current approach or \"nothing\"]\n- **Adoption effort**: low / medium / high\n- **Impact**: how much better would our system be?\n- **Recommendation**: adopt as-is / adapt / skip / watch\n```\n\n### Step 4: Present to User\nShow findings ranked by impact/effort ratio. User decides what to adopt.\n\nIf user approves, create the skill/hook/rule immediately.\n\n### Step 5: Update Watch List\nAdd the repo to `~/.claude/le...", "skills/playwright-cli/SKILL.md": "# Browser Automation with playwright-cli\n\n**IMPORTANT: Always open the browser in headed mode (`--headed`) so the user can see the browser window and interact with it (e.g., for SSO login). Never use headless mode unless the user explicitly requests it.**\n\n## Auto-install\n\nBefore running any playwright-cli command, check if it's installed:\n\n```bash\nwhich playwright-cli 2>/dev/null || echo \"not found\"\n```\n\nIf not found, install it:\n\n```bash\nnpm install -g @playwright/cli@latest\n```\n\nThen install skills if `.claude/skills/playwright-cli/` does not exist in the project:\n\n```bash\nplaywright-cli install --skills\n```\n\n## Quick Start\n\n```bash\n# open new browser (ALWAYS use --headed)\nplaywright-cli open --headed\n# navigate to a page\nplaywright-cli goto https://example.com\n# interact using refs from the snapshot\nplaywright-cli click e15\nplaywright-cli type \"search text\"\nplaywright-cli press Enter\n# take a screenshot\nplaywright-cli screenshot\n# close the browser\nplaywright-cli close\n```\n\n## Core Commands\n\n```bash\nplaywright-cli open --headed              # open visible browser\nplaywright-cli open --headed URL          # open and navigate\nplaywright-cli goto _mt_logs\n| where message has \"{{search_value}}\"\n| where timestamp > ago({{time_range}})\n| order by timestamp desc\n| take {{limit}}\n```\n\n### Search by time range only\n```kql\nhp_ats_integration_mt_logs\n| where timestamp > ago({{time_range}})\n| order by timestamp desc\n| take {{limit}}\n```\n\n### Custom KQL\nIf the user provides a custom KQL query, use it directly. Ensure the table name `hp_ats_integration_mt_logs` is used.\n\n## Step 2: Execute the Query\n\nUse the `execute_kusto_query` MCP tool with:\n- **cluster_name**: `lilogsusprod05`\n- **database**: `hp-ats-integration-mt`\n- **query**: the constructed KQL query\n\nAlternatively, use the `target` parameter for auto-discovery:\n- **target**: `hp-ats-integration-mt`\n\n## Step 3: Present Results\n\n1. Show the **exact KQL query** that was executed\n2. Present results in a readable format\n3. Highlight key fields: `timestamp`, `level`, `message`, `treeId`, `className`\n4. If timestamps are in Unix milliseconds, convert to PST:\n   ```bash\n   TZ=\"America/Los_Angeles\" date -r $((TIMESTAMP_MS/1000)) \"+%Y-%m-%d %H:%M:%S %Z\"\n   ```\n5. Note the number of results returned\n6. Flag any ERROR or WARN level entries\n\n## Common Debugging Patterns\n\n### Find all logs for a specific request\n```kql\nhp_ats_integration_mt_logs\n| where treeId has \"{{se...", "skills/markitdown/SKILL.md": "# Document \u2192 Markdown Converter\n\nConvert any document format to clean Markdown that Claude can read and reason about.\n\n## When to Use\n\n- User shares a `.docx`, `.xlsx`, `.pptx`, `.pdf` file\n- User asks to \"read this doc\" or \"what's in this spreadsheet\"\n- User references a design doc, PRD, or slide deck\n- Need to ingest a web page as structured text\n- Converting documents for storage in memory/ or learnings/\n\n## Auto-install\n\n```bash\nwhich markitdown 2>/dev/null || pip3 install \"markitdown[all]\"\n```\n\n## Usage\n\n### Convert a file\n```bash\nmarkitdown path/to/file.docx\nmarkitdown path/to/file.xlsx\nmarkitdown path/to/file.pptx\nmarkitdown path/to/file.pdf\n```\n\n### Convert a URL\n```bash\nmarkitdown \"https://example.com/page\"\n```\n\n### Convert and save to memory\n```bash\nmarkitdown path/to/design-doc.docx > ~/claude-knowledge/memory/projects/connected-projects/design-doc.md\n```\n\n### Preview first N lines\n```bash\nmarkitdown path/to/file.docx | head -50\n```\n\n## Format-Specific Notes\n\n### DOCX (Best results)\n- Preserves heading hierarchy, tables, bullet lists, links\n- Much better than copy-pasting from Google Docs\n- Images are described if LLM vision is configured\n\n### XLSX\n- Each sheet becomes a `## SheetName` section\n- Data rendered as markdown tables\n- Empty sheets are skipped\n\n### PPTX\n- Each slide becomes a section\n- Text, tables, and speaker notes preserved\n- Images described if LLM vision configured\n\n### PDF\n- Text extraction via pdfminer\n- Note: Claude's built-in Read tool handles PDFs natively \u2014 use markitdown only when Read fails or for batch processing\n\n### URL / HTML\n- Fetches page and converts HTML to markdown\n- Strips navigation, ads, scripts\n- For JS-heavy pages: use playwright-cli instead (renders JS first)\n\n## Integration with Memory System\n\nWhen converting a document that should persist across sessions:\n\n```bash\n# Convert and save to project memory\nmarkitdown \"PRD.docx\" > ~/claude-knowledge/memory/projects/connected-projects/prd.md\n\n# Convert and save to referenc...", "skills/comms/SKILL.md": "# Comms \u2014 Agent Communication Layer\n\nJust describe what you want. The skill figures out the subcommand.\n\n```\n/comms                              \u2014 full dashboard\n/comms how's the network            \u2014 full dashboard\n/comms who's online                 \u2014 list agents\n/comms is everything healthy        \u2014 infra check\n/comms any active sessions on vm    \u2014 sessions\n/comms anything new                 \u2014 unread results\n/comms clear the inbox              \u2014 ack all results\n/comms tell vm to run the tests     \u2014 send to VM\n/comms ask vm what OS it's running  \u2014 send thinking task\n/comms open a channel to vm         \u2014 start bidirectional pipe\n/comms check inbox                  \u2014 read incoming messages\n/comms stop listening               \u2014 stop background listener\n/comms tasks                        \u2014 task dashboard across agents\n/comms tasks working                \u2014 what's in flight\n/comms trust a2a-gw-bizhou-vm       \u2014 approve untrusted agent (TOFU)\n/comms a2a status                   \u2014 A2A gateway health\n```\n\n## Step 1: Classify the Request\n\nRead the user's input and classify into one of these intents:\n\n| Signal in user's words | Intent | Route to |\n|------------------------|--------|----------|\n| No args, \"status\", \"dashboard\", \"overview\", \"how's\", \"what's up\", \"sitrep\" | **Dashboard** | Run full dashboard (includes tasks + trust) |\n| \"who\", \"agents\", \"list agents\", \"online\", \"registered\", \"available\" | **Who** | List agents |\n| \"health\", \"healthy\", \"infra\", \"tunnel\", \"nats\", \"connected\", \"reachable\" | **Health** | Infra check |\n| \"session\", \"sessions\", \"active sessions\", \"conversations\" | **Sessions** | List sessions |\n| \"results\", \"anything new\", \"pending\", \"async\", \"what came back\" | **Results** | Show results |\n| \"ack\", \"clear\", \"archive\", \"mark read\", \"dismiss\", \"clean up results\" | **Ack** | Archive results |\n| \"send\", \"tell\", \"ask\", \"say to\", \"message\", \"run on\" + agent name | **Send** | Send to agent |\n| \"pipe\", \"channel\", \"connect to\", \"open\", \"bidirectional\", \"list...", "skills/oncall-trunk-health/SKILL.md": "# HP Backend Trunk Health Check\n\nMonitor trunk (master) build health across team services. Surface failures before they block development.\n\n> **Invoked by**: `/oncall-daily-digest` STEP 5, or directly via `/oncall-trunk-health`\n> **Services**: hp-ats-integration-mt, mcm-mt, hire-access-control, mcm-jobs-integration-mt, talent-solutions-api-frontend\n\n---\n\n## STEP 1: CHECK DEPLOYED vs TRUNK\n\nFor each service, check the deployed version and compare to trunk HEAD:\n\n```bash\n# Deployed version (run all in parallel via VM)\nbash -c \"ssh vm 'go-status -f prod-ltx1 -a hp-ats-integration-mt'\"\nbash -c \"ssh vm 'go-status -f prod-ltx1 -a mcm-mt'\"\nbash -c \"ssh vm 'go-status -f prod-ltx1 -a hire-access-control'\"\nbash -c \"ssh vm 'go-status -f prod-ltx1 -a mcm-jobs-integration-mt'\"\nbash -c \"ssh vm 'go-status -f prod-ltx1 -a talent-solutions-api-frontend'\"\n```\n\nIf deployed version is significantly behind trunk (>5 commits), post-merge build may be broken or deployment is paused.\n\n---\n\n## STEP 2: IDENTIFY POST-MERGE FAILURES\n\nFor services with a version gap:\n\n1. **Check recent trunk commits**:\n   ```bash\n   bash -c \"ssh vm 'cd ~/workspace/<service> && git log --oneline -20 origin/master'\"\n   ```\n\n2. **Look for fix indicators** in commit messages:\n   - `PROTOVALIDATIONOVERRIDE` \u2014 proto backward-compat fix attempt\n   - `PCVALIDATIONOVERRIDE` \u2014 PDL/Rest.li backward-compat fix attempt\n   - `trigger-build` \u2014 someone manually retriggered the post-merge build\n   - These indicate the trunk was recently broken and someone attempted a fix\n\n3. **Check build status** via observe-agent:\n   \"Show CI build status for [service] master branch in the last 24 hours\"\n\n4. **Check for open Jira tickets** about the break:\n   Use `search_jira_issues`: `project = HP AND summary ~ \"post-merge\" AND status != Done`\n\n---\n\n## STEP 3: CHECK FLAKY TESTS\n\n### Known Flaky Tests (keep updated)\n\n| Service | Test | Notes |\n|---------|------|-------|\n| talent-solutions-api-frontend | `SkillServiceTest.testBatchGet` | Known...", "skills/delegate/SKILL.md": "# Delegate \u2014 Send Work to the VM Agent\n\nJust say what you want. The skill figures out the rest.\n\n```\n/delegate review the latest PR for hp-ats-integration-mt\n/delegate run mint build\n/delegate check go-status for hp-ats-integration-mt\n/delegate investigate why the pipeline is stuck\n/delegate run the full test suite in the background\n/delegate build, test, fix failures, and re-test until green\n/delegate what are the last 5 commits in hp-ats-integration-mt\n```\n\n## Step 1: Understand the Request\n\nRead the user's natural language and determine:\n\n**A. What mode?**\n\n| Signal in user's words | Mode | How to execute |\n|------------------------|------|----------------|\n| \"in the background\", \"async\", \"don't wait\", \"fire and forget\" | **Async** | `vm-agent --async` + Monitor |\n| \"keep going until\", \"fix and re-test\", \"loop until green\" | **Auto** | `vm-agent --auto` + Monitor |\n| Everything else | **Sync** | Block until result |\n\n**B. Shell or thinking?**\n\n| Signal | Type | How to execute |\n|--------|------|----------------|\n| Exact command: `mint build`, `mint test`, `gradlew`, `go-status`, `grpcurli`, `curli`, `echo`, `ls`, `cat`, `grep` | **Shell** | `~/bin/vm-agent \"<command>\"` |\n| Needs reasoning: \"review\", \"investigate\", \"explain\", \"analyze\", \"what\", \"why\", \"how\", \"check\", \"find\", \"compare\" | **Think** | `~/bin/vm-agent -t \"<message>\"` |\n| Ambiguous | **Think** | Safer \u2014 VM Claude can run shell commands itself |\n\n**C. Which repo?**\n\nIf the user mentions a repo name (e.g., \"hp-ats-integration-mt\", \"mcm-mt\"), add `--repo <name>`.\nIf working in a repo directory, infer from cwd.\nIf unclear, omit \u2014 VM agent uses ~/workspace.\n\n**D. Fresh or continue?**\n\nIf \"fresh\", \"new\", \"start over\" \u2192 add `--new`\nIf follow-up to previous delegate \u2192 omit (auto-resumes)\n\n## Step 2: Build and Run the Command\n\nAssemble the `~/bin/vm-agent` command from the classification:\n\n```bash\n# Shell sync:\n~/bin/vm-agent \"<shell command>\"\n\n# Think sync:\n~/bin/vm-agent -t \"<message>\"\n\n# Think sync with repo...", "skills/watch-deps/SKILL.md": "# Watch Deps \u2014 Track Upstream/Downstream Changes\n\nMonitor changes in dependencies and consumers since last check.\n\n**Usage:**\n- `/watch-deps` \u2014 check what changed\n- `/watch-deps add [repo]` \u2014 add to watchlist\n- `/watch-deps list` \u2014 show watched deps\n\n## Config\n\n`~/.claude/learnings/dependencies.jsonl` \u2014 one entry per dependency:\n```json\n{\"repo\": \"talent-solutions-api\", \"relationship\": \"upstream\", \"what_we_use\": \"GetCandidateHiringState gRPC\", \"last_checked\": \"2026-04-01\"}\n```\n\n## Check Flow\n\n1. Read `dependencies.jsonl` for watched deps\n2. For each dep: check recent commits to proto/API files via `jarvis_codesearch` or `gh api`\n3. Check `go-status` for recent deploys\n4. Report: action-required vs awareness vs no-change\n\n## Auto-Detection (first time in a repo)\n\nScan for: `GrpcClient`, `@ServiceClient`, Kafka topic names, `@EspressoTable`, `@RestClient`, lix keys. Present findings, ask which to watch.\n\n## Integration\n\n- Session start: compound agent checks dependencies, adds to briefing if stale\n- Before PR: flag if changes affect downstream API contracts\n- During /investigate: check if upstream deployed recently\n", "skills/hp-contract-chooser-pem/SKILL.md": "# HP Contract Chooser PEM Investigation Skill\n\nExecute phases in order. **Checkpoint after each phase** \u2014 present findings, wait for user confirmation.\n\n> **Product:** Hiring Platform - Contract Chooser (Web)\n> **Fabrics:** prod-lor1, prod-ltx1, prod-lva1\n> **PEM Debug Dashboard:** go/pem/inlogs\n> **Service Topology:** See `references/service-topology.md`\n\n---\n\n## PHASE 0: LOAD MCP TOOLS\n\nLoad these MCP tools using **ToolSearch**:\n1. `select:mcp__captain__fetch_alert_inputs`\n2. `select:mcp__captain__fetch_pem_errors`\n3. `select:mcp__captain__get_server_side_top_contributors`\n4. `select:mcp__captain__fetch_application_events`\n5. `select:mcp__captain__fetch_incidents`\n6. `select:mcp__captain__fetch_metrics_by_rrd`\n7. `select:mcp__captain__kql_fetch_logs`\n8. `select:mcp__captain__analyze_single_trace`\n9. `select:mcp__captain__execute_kusto_query`\n\nVerify Azure CLI token for PEM Kusto:\n```bash\naz account get-access-token --resource \"https://inlogsprodplatform.westus2.kusto.windows.net\" --query \"expiresOn\" -o tsv 2>/dev/null\n```\n\n---\n\n## PHASE 1: RESOLVE INPUT AND EXTRACT PARAMETERS\n\n### Step 1.1: Detect Input Type\n\n| Input Pattern | Action |\n|---|---|\n| Observe PEM Alert URL | Call `fetch_alert_inputs` \u2192 extract start/end/fabrics/product |\n| Observe Service Alert URL | Call `fetch_alert_inputs` |\n| Time range / description | Parse time, default product = \"Hiring Platform - Contract Chooser\" |\n| Incident number | Call `get_incidents` to fetch details |\n\n### Step 1.2: Classify Alert Type\n\n| Signal | Category |\n|---|---|\n| \"session count\", \"count-deviation\" | `count_deviation` |\n| \"availability\", \"< 9X%\" | `availability` |\n| \"NPE\", \"NullPointerException\", \"global outage\" | `service_failure` (see Phase 5B) |\n\n---\n\n## PHASE 2: SESSION COUNT CHECK [FAST PATH]\n\nCall `fetch_metrics_by_rrd` with:\n- `application` = `\"samza-pem-degradation-tracking\"`\n- `rrd_names` = `[\"samza-pem-degradation-tracking/Hiring_Platform_-_Contract_Chooser-Web-totalSessionCount.rrd\"]`\n- 6-hour window ce...", "skills/deploy-check/SKILL.md": "# Deploy Check\n\nCheck deployment status for an HP service across all fabrics.\n\n## Usage\n`/deploy-check <service-name>` (e.g., `/deploy-check mcm-mt`)\n\n## Steps\n\n1. **Check current prod versions** across all fabrics:\n   ```bash\n   go-status -f prod-ltx1 -a <service>\n   go-status -f prod-lva1 -a <service>\n   go-status -f prod-lor1 -a <service>\n   ```\n   Run these in parallel.\n\n2. **Check recent deployments** in CRT:\n   Use `mcp__captain__fetch_application_events` to find recent deployment events for the service.\n\n3. **Check EKG status** \u2014 look for any active EKG evaluations or rollbacks:\n   Use observe-agent to check: \"Show me EKG status for <service> in the last 24 hours\"\n\n4. **Check for deployment pauses**:\n   Report if any CRT pauses exist for the product.\n\n5. **Summarize** in a table:\n   | Fabric | Version | EKG Status | Last Deploy |\n   |--------|---------|------------|-------------|\n\nIf the user provides a version, also compare what commits are in that version vs what's currently deployed.\n", "skills/session-handoff/SKILL.md": "# Session Handoff (Deprecated)\n\nSession continuity is now handled natively by Claude's memory system:\n- **Auto Memory** saves key facts, decisions, and context during sessions\n- **memory/MEMORY.md** serves as the persistent index\n- **Active work** tracked in `memory/project/` files\n\nIf you need an explicit handoff note, just ask: \"Summarize this session for next time\" \u2014 Claude will write to memory.\n\nNo separate skill needed.\n", "skills/pr-fix/SKILL.md": "# PR Fix Workflow\n\nAddress all open PR review comments, run tests, and push.\n\n## Step 1: Get PR review comments\n\nRun `gh pr view --json reviewDecision,reviews,comments` and `gh pr view --comments` to get all review feedback on the current branch's PR.\n\nSummarize the review comments and present them to the user before proceeding.\n\n## Step 2: Address each comment\n\nFor each review comment:\n1. Read the relevant file and understand the context\n2. Make the requested change using targeted edits\n3. Move to the next comment\n\nDo NOT explore the codebase extensively \u2014 make focused changes based on what the reviewer asked for.\n\n## Step 3: Run tests\n\nRun tests from the correct module directory (not the repo root). Use `mint build` or the appropriate build command for the module being changed.\n\nIf tests fail:\n- Read the failure output\n- Fix the issue\n- Re-run tests\n- Repeat up to 3 times\n\nDo NOT consider the task complete until tests pass.\n\n## Step 4: Commit and push\n\n1. Stage only the files you changed\n2. Commit with a message summarizing the review fixes (e.g., \"Address PR review comments: fix X, update Y\")\n3. Push to the current branch\n\n## Step 5: Summary\n\nReport back with:\n- Which comments were addressed\n- What changes were made\n- Test results\n- Whether the push succeeded\n", "skills/validate-qprod/SKILL.md": "# QProd Validation Workflow\n\nEnd-to-end validation for talent-solutions-api changes: build, test, deploy to qprod, curli test, and debug.\n\n## Step 1: Build & Test\n\n```bash\nmint test\n```\n\n- Runs full build + all unit tests\n- Check output for `BUILD SUCCESSFUL` and test summary (e.g. `7516 tests, 0 failed`)\n- If ConfigCompilationException occurs, try `mint update` first (pulls latest dependency versions with config fixes)\n- Search Slack for the key error message if `mint update` doesn't help\n\n## Step 2: QProd Deployment\n\n### Setup (first time or after cleanup)\n```bash\nmint qprodSetup\n```\n\n### Start the server\n```bash\nmint qprodRun\n```\n\n### Verify startup\nDo NOT use `curl localhost:1729` \u2014 it often returns 400. Instead check logs:\n```bash\n# Watch for \"Start to listen at 1729\" in the logs\ntail -f /export/content/lid/apps/talent-solutions-api-frontend/dev-i001/logs/talent-solutions-api-frontend.log\n```\n\nStartup takes 2-5 minutes. Look for:\n```\nINFO [AvesServer] [...] Start to listen at 1729 for HTTP.\nINFO [AvesServer] [...] Start to listen at 2302 for HTTPS.\n```\n\n### Stop the server\n```bash\n# Find and kill the Java process\nps aux | grep talent-solutions-api-frontend | grep -v grep\nkill <PID>\n```\n\n## Step 3: Curli Testing via QProd\n\n### Getting a curl command\n1. Open `https://qprod.www.linkedin.com` in Chrome\n2. Navigate to the page that calls the API endpoint you want to test\n3. Open DevTools > Network tab\n4. Find the API request, right-click > Copy > Copy as cURL\n\n### Required headers for REST.li\n```\n-H 'accept: application/json'\n-H 'x-restli-protocol-version: 2.0.0'\n-H 'x-http-method-override: GET'\n-H 'csrf-token: <from JSESSIONID cookie>'\n```\n\n### Example curl structure\n```bash\ncurl -s 'https://qprod.www.linkedin.com/talent/api/<endpoint>' \\\n  -H 'accept: application/json' \\\n  -H 'content-type: application/x-www-form-urlencoded' \\\n  -b '<cookies from browser>' \\\n  -H 'csrf-token: <csrf-token>' \\\n  -H 'x-restli-protocol-version: 2.0.0' \\\n  -H 'x-http-method-override: G...", "skills/hp-pipeline-pem/SKILL.md": "# HP Pipeline PEM Investigation Skill\n\nThis skill investigates **Hiring Platform - Pipeline** PEM availability alerts. Execute phases in order.\n\n> **Product:** Hiring Platform - Pipeline (Web)\n> **Affected Page:** `d_talent_projectsHome`\n> **Key Features:** `change-candidate-stage` (61% of errors historically), `pipeline-profile-list` (37.5%)\n> **Fabrics:** prod-lor1, prod-ltx1, prod-lva1\n> **SLA Target:** 95% availability\n> **PEM Debug Dashboard:** go/pem/inlogs\n\n---\n\n## PHASE 0: LOAD MCP TOOLS\n\nLoad these MCP tools using **ToolSearch**:\n1. `select:mcp__captain__fetch_alert_inputs`\n2. `select:mcp__captain__search_product_names`\n3. `select:mcp__captain__fetch_pem_errors`\n4. `select:mcp__captain__get_server_side_top_contributors`\n5. `select:mcp__captain__fetch_application_events`\n6. `select:mcp__captain__fetch_incidents`\n7. `select:mcp__captain__fetch_metrics_by_rrd`\n8. `select:mcp__captain__kql_fetch_logs`\n9. `select:mcp__captain__analyze_single_trace`\n10. `select:mcp__captain__execute_trino_query` (if Kusto queries needed)\n\n---\n\n## PHASE 1: RESOLVE INPUT AND EXTRACT PARAMETERS\n\n### Step 1.1: Detect Input Type\n\n**INPUT TYPE A \u2014 Observe PEM Alert URL:**\n- Pattern: `observe.prod.linkedin.com/curated/application/triage/pem` or `observe.prod.linkedin.com/pem-triage`\n- Action: Call **mcp__captain__fetch_alert_inputs** with the URL\n- Extract: `start_time`, `end_time`, `fabrics`, `product`, `platform`\n\n**INPUT TYPE B \u2014 Observe Service Alert URL:* Proto/PDL validation | Add `PROTOVALIDATIONOVERRIDE`/`PCVALIDATIONOVERRIDE` to title |\n| Known flaky test | `gh pr checks --rerun-failed` |\n\nNon-fixable (compilation, real test failure) \u2192 report to user, suggest `/pr-fix`.\n\n## Completion\n\nReport: PR title, CI time, reviewer, merge time, deploy version, PEM status, total elapsed.", "skills/triage-alert/SKILL.md": "# Triage Alert\n\nQuickly triage a production alert for HP services.\n\n## Usage\n`/triage-alert <alert-url-or-description>`\n\n## Steps\n\n1. **Identify the alert** \u2014 parse the alert URL or description to determine:\n   - Service name\n   - Fabric\n   - Alert type (error rate, latency, availability)\n   - Time window\n\n2. **Check for global outage first** \u2014 if availability < 30% or errors across ALL HP surfaces:\n   - Check `settings-mt` for DYCO changes (within 30 min before outage)\n   - Check `hire-access-control` for NullPointerException\n   - If NPE from DYCO \u2192 **SEV0, revert settings-mt change immediately**\n   - hire-access-control is universal dependency \u2014 one NPE takes down ALL of HP\n   - See `/hp-contract-chooser-pem` Phase 5B for full pattern\n\n3. **Check recent deployments** \u2014 look for deployments to this service in the affected time window:\n   ```bash\n   go-status -f <fabric> -a <service>\n   ```\n   Use `mcp__captain__fetch_application_events` for deployment history.\n   **Also check `settings-mt`** \u2014 DYCO config changes here can cascade to HP services.\n\n4. **Search error logs** \u2014 use observe-agent:\n   \"Search ERROR logs for <service> in <fabric> in the last <timewindow>. Show error breakdown by type/exception with counts.\"\n\n5. **Check downstream dependencies** \u2014 use observe-agent:\n   \"Show me dependency errors for <service> in <fabric>\"\n\n6. **Quantify by caller** \u2014 if the bottleneck is a shared service (hp-ep-mt, eis-backend):\n   Use observe-agent to group inbound traffic by originating service/endpoint.\n   The PEM-triggering endpoint is often NOT the top caller. In incident-10781, `/talentMe` was 53% of hp-ep-mt load while the PEM endpoint was only 0.4%.\n\n7. **Check if errors are from dark cluster traffic** \u2014 look for `pageKey: DarkCluster-null` or `\"Dispatching dark request\"` in rpc-trace.\n   - Dark cluster config: `config/public/lps-d2-<ClusterName>.src` in the MP repo\n   - Deploy changes: `lps d2 update -f <fabric> -c <ClusterName> --bypass-canary`\n\n8. **Verify servin...", "skills/oncall/SKILL.md": "# HP Backend Oncall Master Workflow\n\nThis skill orchestrates the full oncall loop. It dispatches to specialized skills based on the task type.\n\n> **Oncall Guide:** go/hp-oncall\n> **Primary Confluence:** https://linkedin.atlassian.net/wiki/spaces/PRT/pages/552233793\n> **Worklog:** `/Users/bizhou/workspace/oncall/oncall_week_<date>_worklog.md`\n\n---\n\n## STEP 1: CLASSIFY THE TASK\n\nAsk the user what they need, or detect from context:\n\n| Input Pattern | Task Type | Dispatch To |\n|---------------|-----------|-------------|\n| Alert URL (observe.prod.linkedin.com) | Alert triage | **STEP 2A** |\n| PEM dip / availability drop | PEM investigation | **STEP 2B** |\n| CSE ticket / JIRA link | CSE investigation | **STEP 2C** |\n| Deploy / release | Deployment | **STEP 2D** |\n| Incident channel (#incident-XXXXX) | Incident response | **STEP 2E** |\n| Samza job failed / nearline lag | Nearline fix | **STEP 2F** |\n| CMON / compliance ticket | Data compliance | **STEP 2G** |\n| \"what's going on\" / status check | Daily status | **STEP 2H** |\n| End of shift | Handoff | **STEP 2I** |\n\n---\n\n## STEP 2A: ALERT TRIAGE\n\nInvoke `/triage-alert <alert-url>`. The skill will:\n1. Identify service, fabric, alert type\n2. Check recent deployments\n3. Search error logs via observe-agent\n4. Check downstream dependencies\n5. Compare with baseline\n6. Summarize findings\n\nAfter triage, proceed to **STEP 3** (Fix or Escalate).\n\n---\n\n## STEP 2B: PEM INVESTIGATION\n\nDetermine which PEM surface:\n- **Contract Chooser** \u2192 invoke `/hp-contract-chooser-pem`\n- **Pipeline** \u2192 invoke `/hp-pipeline-pem`\n- **Project Create / Project Home / Project Overview / Project List** \u2192 use `/triage-alert` with PEM-specific context\n\nAfter investigation, annotate on `go/hp-pem` and proceed to **STEP 3**.\n\n---\n\n## STEP 2C: CSE TICKET INVESTIGATION\n\n### Standard CSE Flow (48-hour SLA from Open to Triage)\n\n1. **Fetch the ticket**: Use `mcp__captain__get_jira_issue` with the ticket key\n2. **Update status**: Set to \"In Progress\" via `mcp__captai..."}};
