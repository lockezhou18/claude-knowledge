avioral gates summary, principle scores)\n- User preferences and feedback rules\n- Project context and active work\n- Workflow rules\n\n**What should NOT live here:**\n- Raw data (JSONL manifests, verdict JSONs, log files)\n- Code (pipeline.py, hooks, skills)\n- Search indexes (manifest.jsonl, manifest-hot.jsonl)\n- Detailed eval artifacts (full verdicts, session exports)\n\n### Layer 2: Compound Learning + Eval (Custom, Structured Data)\n**What lives here:** The intelligence engine \u2014 structured data that requires programmatic processing.\n**Format:** JSONL manifests, JSON verdicts, Python pipelines.\n**Who maintains:** /compound, /improve-agent, hooks.\n**What stays here:**\n- manifest.jsonl (search index \u2014 Auto Dream can't parse JSONL)\n- Insight files with lifecycle metadata (use_count, outcome_score, status)\n- Eval verdicts (structured JSON \u2014 Auto Dream would corrupt them)\n- Pipeline code (pipeline.py, judge_prompt.md, failure_taxonomy.md)\n- Logs (commit-log, pr-log, feedback-log, outcome-log)\n- Session exports (raw transcripts for re-judging)\n\n### Layer 3: Behavior (Skills, Hooks, Rules)\n**What lives here:** The agent's capabilities and behavioral rules.\n**Format:** Markdown skills, Python hooks, rule files.\n**Who maintains:** User + /improve-agent + /integrate.\n**What stays here:**\n- Skills (commands/*.md, recipes/*.md)\n- Capability skills (skills/*/)\n- Hooks (hooks/*.py)\n- Detailed behavioral gates (rules/behavioral-gates.md)\n- VM routing, tool priority rules\n\n## Data Flow Between Layers\n\n```\nLayer 3 (Behavior)                Layer 2 (Intelligence)           Layer 1 (Memo...", "memory/global/agentbus-architecture.md": "## AgentBus Architecture\n\nLaptop Claude communicates with a persistent VM Claude agent via NATS messaging.\n\n```\nLaptop                    NATS (:4222)              VM (bizhou-ld2)\n/delegate skill  \u2500\u2500\u2500\u2500\u2500\u2500\u25b6  SSH tunnel  \u2500\u2500\u2500\u2500\u2500\u2500\u25b6  claude_listener\n  vm-agent CLI                                   \u2192 claude -p (think)\n  vm-run (shell)                                 \u2192 bash (shell)\n```\n\n### Components\n- **NATS server**: runs on VM (tmux: nats), v2.12.6 with JetStream\n- **Claude listener**: runs on VM (tmux: agentbus), dispatches to claude -p or bash\n- **vm-agent CLI**: ~/bin/vm-agent \u2014 handles tunnel, routing, sessions\n- **watch_result.py**: NATS subscriber for Monitor tool \u2014 real-time async notifications\n- **Agent cards**: agents/bizhou-vm.json, agents/bizhou-laptop.json\n\n### Three Modes\n| Mode | Flag | Behavior |\n|------|------|----------|\n| Sync | (default) | Block until result |\n| Async | --async | Fire task + Monitor watches for result |\n| Auto | --auto | Multi-round autonomous loop + Monitor shows checkpoints |\n\n### Session Resume (Level 1)\nFollow-up messages auto-resume previous conversation (same sender + repo). Sessions expire after 1 hour idle.\n\n### Key paths\n- AgentBus code: ~/projects/compound-learning-ecosystem/agentbus/\n- VM deployment: vm:~/agentbus/\n- Agent cards: agentbus/agents/*.json\n- NATS config: agentbus/deployment/nats-bizhou.conf\n- Autostart: vm:~/.bashrc sources vm-autostart.sh", "memory/global/robustness-rules.md": "## Pattern 1: Silent Failures \u2192 Add Health Checks\n\nThings that fail silently are the worst \u2014 they look healthy but aren't working.\n\n**Rules:**\n- Every daemon/cron MUST write a heartbeat or log entry on each run \u2014 absence of log = failure\n- Every `claude -p` dispatch MUST check the exit code AND stderr \u2014 rc=1 with empty stderr means auth issue\n- Every cron job MUST redirect stderr to a log file (`2>&1 >> logfile`) \u2014 never discard errors\n- After deploying a new service, verify it works with a health check within the same session \u2014 don't assume\n\n**Anti-pattern:** \"It's set up, it should work.\" Verify.\n\n**Example:** Dream cron was \"set up\" but never actually ran for 3 days because git pull failed silently.\n\n## Pattern 2: Fragile Chains \u2192 Use Semicolons, Not &&\n\nSequential commands where one failure kills the rest.\n\n**Rules:**\n- Cron jobs: use `;` between independent steps, not `&&` \u2014 git pull failing shouldn't stop dream.py\n- Multi-step scripts: each step should fail independently unless there's a TRUE dependency\n- If step B genuinely depends on step A: use `&&`. If they're just sequential: use `;`\n- Add explicit error handling for known failure modes (git conflicts, auth expiry, network timeout)\n\n**Anti-pattern:** `git pull && process && push` \u2014 if pull fails (conflict, network), nothing runs.\n\n**Better:** `git pull 2>/dev/null; process >> log 2>&1; push 2>/dev/null`\n\n## Pattern 3: Misleading Signals \u2192 Label Output Clearly\n\nOutput that looks like errors but isn't, or looks fine but is broken.\n\n**Rules:**\n- \"NATS disconnected\" is a normal close, not an error \u2014 label it: `[info] Connection closed` not just the raw message\n- SSH \"Address already in use\" is informational when the tunnel exists \u2014 suppress or label\n- `claude auth status` showing \"logged in\" doesn't mean `claude -p` works \u2014 test the actual command\n- When health checking, test the ACTUAL operation, not a proxy. `auth status = OK` is not the same as `claude -p \"test\" = OK`\n\n**Anti-pattern:** Seeing \"connected\" ...", "memory/reference/tricks.md": "# Tricks & Handy Shortcuts\n\n## PR CI Checks\n\n- **Rerun a stuck/pending CI check**: `rerun-check -c \"<check name>\"` (e.g., `rerun-check -c \"Owner Approval\"`)\n- Common use case: \"Owner Approval\" stays pending after force-push/rebase \u2014 rerun it to re-trigger\n\n## Tmux (prefix: Ctrl-a)\n\n- Config: `~/.tmux.conf`\n- **Close window**: `Ctrl-a` + `&` (prompts y/n)\n- **Close pane**: `Ctrl-a` + `x` (prompts y/n)\n- **Split horizontal**: `Ctrl-a` + `|`\n- **Split vertical**: `Ctrl-a` + `-`\n- **Navigate panes**: `Ctrl-a` + arrow keys\n- **Resize panes**: `Ctrl-a` + `H/J/K/L` (5 cells, repeatable)\n- **Copy mode**: vi keys, `v` to select, `y` to copy (pbcopy)\n- **Paste**: `Ctrl-a` + `p`\n- **Reload config**: `Ctrl-a` + `r`\n", "memory/reference/espresso-table-traffic.md": "## How to Find Espresso Table-Level Traffic\n\n**Use server-side Espresso Router metrics** \u2014 no client config changes needed.\n\n### Observe Metrics Explorer\n- **URL**: https://observe.prod.linkedin.com/metrics-explorer\n- **Application**: `espresso-router`\n- **Fabric**: `prod`, **Multifabric**: `Yes`\n\n### RRD Naming Pattern\n```\nespresso-router/espresso-router.i001.Traffic_Checker_Table_Stats.TrafficCheckerTableStats_ESPRESSO_<CLUSTER>.<DB>-<TABLE>_<MetricType>.rrd\n```\n\n**IMPORTANT**: Note the `.` (dot) between cluster and DB name, and `-` (dash) between DB and table name.\n\n### Metric Types\n- `TableTotalCallCount` \u2014 total calls (internal + external)\n- `TableExternalTotalCallCount` \u2014 external calls only\n\n### Example\nFor table `SourcingChannelCandidatesV2` in DB `MultichannelManagement` on cluster `MT-LD-2`:\n```\nespresso-router.i001.Traffic_Checker_Table_Stats.TrafficCheckerTableStats_ESPRESSO_MT-LD-2.MultichannelManagement-SourcingChannelCandidatesV2_TableTotalCallCount.rrd\n```\n\n### Search Tip\nIn Metrics Explorer, search for:\n```\nTrafficCheckerTableStats_ESPRESSO_<CLUSTER>.<DB>-<partial-table-name>\n```\n\n### Client-Side Alternative (requires code change)\nIf you need client-side per-table metrics (latency, RCU/WCU), enable `emitTableCallStats` in the Espresso client config. This is opt-in and requires espresso-pub >= 55.0.12. But for traffic volume, the router-side metrics above are sufficient and require no code changes.\n\n### Gotcha: Cluster naming\n- Client-side metrics use `_` separator: `ESPRESSO_MT-LD-2_MultichannelManagement`\n- Router-side metrics use `.` separator: `ESPRESSO_MT-LD-2.MultichannelManagement`\n- The earlier attempt with `_` returned null \u2014 the `.` is critical.\n\n### Related\n- Espresso DB-level metrics are under `Espresso_Client_Sensor` on the client app (e.g., `mcm-mt`)\n- HireAccessControlDB metrics are under cluster `MD-2` (not the DB name)", "memory/reference/hardware_comparison.md": "# Hardware Comparison: DGX Spark vs Mac Studio for LLM\n\n## Key Specs\n\n| Spec | DGX Spark (GB10) | Mac Studio M4 Ultra | Mac Studio M3 Ultra |\n|---|---|---|---|\n| Price | ~$3,999 | ~$4,999-$7,999 | ~$3,999+ |\n| Memory | 128GB LPDDR5x | 192GB or 256GB unified | 192GB unified |\n| Memory Bandwidth | **273 GB/s** | est. **900+ GB/s** | **819 GB/s** |\n| GPU Compute | Blackwell, 1 PFLOP FP4 (sparse) | 80-core GPU | 80-core GPU |\n| TDP | 140W | ~200W | ~200W |\n| CUDA/Tensor Cores | Yes (5th gen Tensor) | No (Metal/ANE) | No |\n\n## Critical Insight: Memory Bandwidth is the Bottleneck\n\nLLM inference/reasoning is memory-bandwidth bound. DGX Spark's 273 GB/s vs Mac Studio's 819+ GB/s means Mac Studio generates tokens ~3x faster.\n\n## Estimated Performance\n\n| Device | ~tok/s (20B FP16) | ~tok/s (70B Q4) |\n|---|---|---|\n| DGX Spark | ~8-12 | ~4-6 |\n| Mac Studio M3 Ultra | ~25-35 | ~12-18 |\n| Mac Studio M4 Ultra | ~30-40 | ~15-22 |\n\n## When to Pick Which\n\n- **Fast inference/reasoning**: Mac Studio (3x bandwidth)\n- **Run 70B+ models**: Mac Studio (256GB option)\n- **Fine-tuning (LoRA/SFT)**: DGX Spark (CUDA + Tensor Cores)\n- **Daily driver + AI**: Mac Studio\n- **CUDA research frameworks**: DGX Spark\n- **Best bang for buck inference**: Mac Studio M3 Ultra (192GB, ~$4K)\n\n## Nemotron 3 Nano (31.6B total, 3.6B active MoE)\n\n- DGX Spark: Can do LoRA fine-tuning (128GB fits model + optimizer)\n- Mac Studio: Better for inference, but no CUDA for training\n- RTX 5090 (32GB): QLoRA only for this model size\n", "memory/reference/build-troubleshooting.md": "# Build & Config Troubleshooting\n\n## ConfigCompilationException: \"Cannot resolve app-def default value\"\n\nWhen `mint build-cfg`, `mint run-local`, or `mint qprodRun` fails with errors like:\n```\nConfigCompilationException:\nCannot resolve app-def default value missing from <beanName>.<property>\n```\n\n**Root cause**: New beans introduced by dependency upgrades that need config values in `application.src`.\n\n**How to resolve**:\n1. Search Slack for the key part of the error message. E.g. search: `Unable to compile configs, please fix configs errors: d2`\n2. Check team channels (e.g. #talent-solutions-api-dev or relevant infra channels) for recent discussions\n3. Example: https://linkedin-randd.slack.com/archives/C08AL2PMGNQ/p1754427593259009\n4. Often the fix is `mint update` to pull latest dependency versions that include the config fixes\n5. If `mint update` doesn't help, add missing properties to `config/app/<app>/application.src` following existing patterns for similar beans\n\n**Pattern for finding the right config values**:\n- For `TrackingProducerFactory` beans: copy pattern from existing `TrackingClient.trackingProducer.*` entries\n- For `D2ClientFactory` / `zkHosts`: use `${__r2d2DefaultClient__.r2d2Client.zkHosts}`\n- For `VeniceClient`: check existing Venice client entries nearby\n", "memory/reference/espresso-metrics.md": "Espresso metrics for **HireAccessControlDB** are published under the cluster name **MD-2**, not the database name.\n\n**Why:** Espresso metrics are organized by cluster, not by logical database name. The cluster name and the database name differ for this DB.\n\n**How to apply:** When querying Espresso metrics dashboards (Observability, Grafana, etc.) for HireAccessControlDB, filter/search by cluster `MD-2` rather than `HireAccessControlDB`.", "learnings/staging/know-020.md": "**When** making architectural decisions or extending Phase 2, **check** these design-to-implementation mappings **because** each implementation choice was driven by a specific business requirement, and changing one requires understanding the chain.\n\n## Business \u2192 Tech Mapping\n\n### 1. \"Surface ATS requisition stages in Connected Project pipeline\"\n- **PRD**: Recruiter sees ATS stages alongside HP sourcing stages\n- **RFC Decision**: Create a separate `candidateHiringPipeline` (atsPipeline) with **non-global states** for ATS stages\n- **Why non-global**: ATS stages are project-specific (each job has different stages). Global states are contract-level and shared across all projects. Using non-global prevents one project's ATS stages from polluting another.\n- **Why separate pipeline**: HP sourcing stages (uncontacted, contacted, replied) are shared across contract. ATS stages are per-job-requisition. Separate pipeline preserves this boundary.\n- **Implementation**: `hiringProject.atsPipelineUrn` \u2192 `candidateHiringPipeline` with one `candidateHiringState` per `integrationJobRequisitionStage`\n\n### 2. \"Move candidate in Recruiter, reflects in ATS\"\n- **PRD**: Recruiter initiates stage change \u2192 ATS updates\n- **RFC Decision**: Write-back goes through **hp-ats-integration-mt \u2192 IP \u2192 ATS** (not direct to ATS)\n- **Why through IP**: IP handles partner-specific API implementations (Greenhouse, Lever, etc.). HP doesn't know ATS partner details. IP provides the `actionUpsert` abstraction.\n- **Why hp-ats-integration-mt is orchestrator**: It already hosts the entity mapping (IntegrationApplicationStage \u2194 HPC) and knows how to translate HP URNs to IP URNs. mcm-mt is the caller (detects Connected Project context), hp-ats-integration-mt is the executor.\n- **Implementation**: mcm-mt `hiringProjectCandidates/partialUpdate` \u2192 detects Connected Project \u2192 calls `ConnectedProjectCandidateApi/ActionWriteBack` \u2192 resolves V2 identity \u2192 finds entity mapping \u2192 calls IP `actionUpsert`\n\n### 3. \"ATS confir...", "learnings/staging/know-045.md": "# vm-run: Generic Remote Build Pattern\n\n## When\nYou need to build/test code on a remote VM from any local repo path.\n\n## Do\nUse `bash -c \"cd <repo-path> && vm-run <command>\"`. vm-run auto-detects the git repo, rsyncs source (excluding .gradle/build/out/.git) to `vm:~/workspace/<repo-name>`, runs the command remotely. Falls back to local if VM unreachable, sync fails, or remote build fails.\n\n## Because\n- Works from any local path (e.g., `connected_project_phase2/hp-ats-integration-mt` \u2192 syncs as `hp-ats-integration-mt`)\n- No persistent mutagen sync needed for each repo\n- PreToolUse hook `vm-route-builds.py` auto-intercepts `mint build/test` and `./gradlew` commands\n- Must use `bash -c \"...\"` wrapper because direct `ssh` is blocked by Claude Code permissions", "learnings/staging/know-014.md": "## Candidate Transformer Test Scenarios (from EI E2E Testing)\n\n**When** testing candidate sync (CandidateProcessor/CandidateTransformer), verify these scenarios:\n\n### Test Scenarios\n\n1. **Create candidate without member** \u2014 New IntegrationCandidate with no `manualMatchedMember`\n   - Creates: candidateProfile hireIdentityV2\n   - Does NOT create member identity\n   - Verify: `hireIdentitiesV2?q=relatedHireIdentity` shows 1 identity (candidateProfile only)\n\n2. **Create candidate with member** \u2014 IntegrationCandidate with `manualMatchedMember` set\n   - Creates: candidateProfile hireIdentityV2 + member hireIdentityV2 in same group\n   - Verify: group has 2 identities (candidateProfile + member)\n\n3. **Add member to existing candidate** \u2014 `$set manualMatchedMember` on existing atsCandidates\n   - Adds member identity to existing group\n   - CandidateProfile identity unchanged\n   - Verify: group now has 2 identities\n\n4. **Remove member** \u2014 `$delete manualMatchedMember`\n   - Removes member from group\n   - CandidateProfile identity persists (NOT deleted)\n   - Verify: group back to 1 identity\n\n5. **Re-add different member** \u2014 Set new `manualMatchedMember`\n   - Old member removed, new member added\n   - CandidateProfile identity unchanged\n   - Verify: group has 2 identities (candidateProfile + new member)\n\n6. **Unmatched member** \u2014 Member ID that doesn't resolve\n   - Logs warning but doesn't fail\n   - CandidateProfile still created\n\n### Key Insight for Phase 2\n\nThe V2 identity group structure is critical for ActionWriteBack:\n- **ApplicationProcessor** creates entity mappings using `candidateProfileIdentityUrn` (V2)\n- **ConnectedProjectCandidateService** resolves V1 \u2192 V2 to find the mapping\n- If the candidate has multiple V2s in the group, the fallback logic (PR #524) tries each V2\n\n**When debugging \"No IntegrationApplicationStage mapping found\":**\n1. Check the V2 group: `hireIdentitiesV2?q=relatedHireIdentity`\n2. Check which V2 has the mapping: try each V2 in `FindByHiringEntity`\n3. ...", "learnings/staging/eureka-005-2.md": "## Breakthrough\n\"No gatekeeping, no approval process. Push directly to main. If something breaks, we fix it together.\"\n\nThis isn't just a repo policy \u2014 it's a design principle for how engineering teams should share knowledge and tooling. Echoing the Internet's founding spirit: open, share, and contribute together.\n\n## Why This Matters\nMost internal tooling dies because of friction: approval processes, code review gates, \"talk to the owner first.\" The tools that actually get adopted are the ones where anyone can improve them without asking permission. The bug bash repo is an experiment in this \u2014 structured enough to be useful, open enough to evolve.\n\n## When to Apply\nWhen building any shared team resource (repos, runbooks, skills, test infrastructure):\n- Default to open, not locked down\n- Make contributing as easy as consuming\n- Trust the team \u2014 if something breaks, fix it together\n- Frame it as \"let's make it useful together\" not \"here's what I built, use it\"\n\n## The Line (saved for when the team is ready)\n> No gatekeeping, no approval process. Push directly to main. If something breaks, we fix it together.\n\n## Connection to Engineering Principles\n- **Stewardship**: Leave systems better than you found them\n- **Humility**: You don't have all the answers \u2014 the team does, collectively\n- **Gratitude**: Respect what came before. Build on it, don't replace it", "learnings/staging/know-014-2.md": "**When** creating a Connected Project with ATS stages, **follow the complete creation chain and verify each step** because stage data depends on a multi-service pipeline that can silently fail at any point.\n\n## Context\n\n### Full Creation Chain\n```\n1. Greenhouse job exists with stages\n2. ATS Gateway ingests \u2192 ATS Middleware store (jobRequisitionStagesApi)\n3. IP syncs \u2192 IntegrationJobRequisition + IntegrationJobRequisitionStage records\n4. ConnectedProjectsApi/Create called with:\n   - integrationJobRequisitionUrn\n   - ownerSeatUrn, contractUrn\n   - useExistingProjectMetadata (true=attach to existing project, false=create new)\n   - syncProjectWithRequisitionEnabled (true=sync stages)\n5. HP creates:\n   - HiringProject (with atsPipelineUrn)\n   - CandidateHiringPipeline (ATS pipeline) with non-global states\n   - CandidateHiringState per ATS stage (source=ATS, statusType=USER_DEFINED)\n   - Entity mappings: CandidateHiringState \u2194 IntegrationJobRequisitionStage\n6. TriggerSync to pull applicants\n```\n\n### Key Failure Points\n- **Step 2**: ATS Middleware ingestion may not populate stage data for sandbox/test jobs \u2192 `jobRequisitionStagesApi` returns empty \u2192 zero stages. TriggerSync does NOT fix this because it queries the same empty middleware store.\n- **Step 3**: IP `IntegrationJobRequisitionStage` records may exist but lack `integrationJobRequisitionUrn` field \u2192 FindByCriteria returns empty.\n- **Step 5**: Non-global states created with `source=ATS` \u2014 these won't appear in global pipeline views.\n\n### Connecting to Existing Project\nUse `useExistingProjectMetadata: true` with `hiringProjectUrn` set:\n```bash\ngrpcurli --dv-auth SELF -f prod-lva1 d2://connectedProjectsApi \\\n  proto.com.linkedin.hire.integration.ConnectedProjectsApi/Create \\\n  -d '{\"value\":{\"hiringProjectUrn\":{\"hiringContext\":\"urn:li:contract:CONTRACT\",\"hiringProjectId\":\"PROJECT\"},\"integrationJobRequisitionUrn\":{\"integrationJobRequisitionId\":\"JOB_REQ\"},\"ownerSeatUrn\":{\"seatId\":\"SEAT\"},\"contractUrn\":{\"contractId\":\"CONTR...", "learnings/staging/know-055.md": "When needing to feed Office documents (DOCX, XLSX, PPTX) into Claude, use markitdown to convert them first. Install with `pip3 install \"markitdown[all]\"`. Claude's built-in Read handles PDFs natively, but DOCX/XLSX/PPTX need markitdown.\n\n**Key results from eval:** DOCX preserves heading hierarchy + tables (241 lines from eng design doc). XLSX renders clean markdown tables. URLs work well for static pages.\n\n**How to apply:** `markitdown file.docx` or pipe to save: `markitdown file.docx > memory/projects/<project>/docs/filename.md`", "learnings/staging/know-030.md": "## Context\nBuilt a complete compound learning system from scratch across two sessions (2026-03-30 to 2026-04-01). The system includes a 6-phase engineering pipeline, 19 skills, 5 hooks, an agent-optimized knowledge base with three-signal scoring, and a tiered skill system.\n\n## Guidance\nWhen building agent productivity systems:\n1. Start with principles (Faith of God \u2192 Engineering Principles), then process (Pipeline), then tools (Skills)\n2. Optimize for the agent as primary consumer \u2014 pre-compiled briefing file, manifest-based search, tiered loading\n3. Skills should emerge from real friction, not architecture imagination \u2014 the best skills came from the user saying \"I need to...\"\n4. Test the system before trusting it \u2014 e2e tests caught real bugs (scoring engine, scout crashes, Don't Guess rule)\n5. The compound loop (Research \u2192 Execute \u2192 Compound \u2192 feeds next Research) is the core value \u2014 each cycle should measurably improve the next\n\n## When to Apply\nWhen designing agent memory/knowledge systems, skill ecosystems, or productivity tooling for AI coding assistants.", "learnings/staging/know-010.md": "## When retries exhaust without visible errors, check exception chains \u2014 and expect stacked bugs\n\n### Context\nDuring hp-ats-integration-mt history item E2E testing, 3 bugs were stacked \u2014 each only visible after fixing the previous one. The retry logs showed \"max retry attempt 5 reached\" but no ERROR in the `message` field between the action and the retry.\n\n### Guidance\n1. **Check `exceptionChain`/`exceptionStackTrace` fields**, not just `message` \u2014 InLogs/Kusto stores them separately. Use `observe agent` to ask for \"full exception chain\" for a treeId.\n2. **After fixing one failure, re-test immediately** \u2014 there may be another bug hiding behind it. Don't assume the flow works just because the first error is gone.\n3. **Trace the treeId across services** \u2014 the caller (hp-ats) may log a generic gRPC error, but the server (mcm-mt) logs the actual root cause (e.g., \"ProjectCandidateHistoryV3 not found\").\n4. **When a workaround changes data format** (e.g., shortened URNs with placeholder zeros), audit every consumer of that data \u2014 some need the real values, not the placeholders.\n\n### When to Apply\n- Debugging Kafka consumer retry loops with no visible errors\n- After deploying a fix, re-testing shows the same retry count\n- When a temp workaround (lix-gated) changes data shape", "learnings/staging/know-041.md": "## Context\n\nWhen querying AI tool costs from the developer-productivity-analysis Trino tables.\n\n## Guidance\n\nWhen querying `openhouse.u_svc_pr_deitools.claude_code`, the `estimated_cost.amount` field inside `model_breakdown` JSON is in **cents** (divide by 100 for USD). This reflects **LinkedIn enterprise pricing**, not public API rates:\n- **Opus**: ~40% of public API rate (significant discount)\n- **Sonnet**: at par with public pricing (1.0x)\n- **Haiku**: ~1.25x of public pricing\n\nFor `openhouse.u_svc_pr_deitools.cursor_usage_events`, the `total_cents` field is also in cents (divide by 100). Filter `kind != 'Errored, Not Charged'` to exclude failed requests.\n\nCross-verified against Anthropic Console SoT (platform.claude.com workspace limits page) \u2014 daily rates are consistent.\n\n## When to Apply\n\nAny time you query AI tool cost data from Trino for reporting or analysis. Always divide by 100 for USD. Do not use public API pricing to compute costs \u2014 use the `estimated_cost` field which already reflects enterprise rates.", "learnings/staging/know-065.md": "# When dynamic agents need identity across machines, use TOFU not file sync\n\n**Situation:** A2A gateway on laptop creates an agent identity unknown to the VM's Guardian.\n\n**Wrong approaches tried:**\n1. Auto-create card file and sync via mutagen \u2192 works for personal use, not production\n2. Impersonate a known agent identity \u2192 wrong security model\n3. Auto-trust via heartbeats \u2192 no explicit approval, security concern\n\n**Right approach:** TOFU (Trust On First Use):\n- **Presence** (heartbeats) = discovery layer. Tells Guardian \"this agent is on the bus.\"\n- **Registry** (file cards) = trust layer. Explicit approval required.\n- Guardian rejection message includes the exact trust command: `agentbus trust <name> --target <listener>`\n- Trust is one-time and persistent (card written to agents dir, survives restarts)\n- NATS connection auth is the outer trust boundary \u2014 you can't send heartbeats without credentials\n\n**Key insight:** Three bad approaches were tried before reaching TOFU. The progression: card sync (personal) \u2192 impersonation (wrong) \u2192 auto-trust (insecure) \u2192 TOFU (correct). Each rejection from the user refined the design toward production readiness.", "learnings/staging/aha-003.md": "## Pattern\n\nThe skill ecosystem has three distinct categories, not two. **Tier 1.5 = capability tools** \u2014 they provide a *capability* (browser eyes, production eyes, production hands) rather than a *workflow* (Tier 1 skills that require judgment) or a *checklist* (Tier 3 recipes that follow steps mechanically).\n\nThe key distinction: **capabilities are the \"how\" that workflows and checklists invoke \u2014 they're not workflows themselves.**\n\n## Evidence\n\n- **playwright-cli** emerged as \"browser eyes\" \u2014 `/investigate` uses it to reproduce UI issues, `/recipe ui-smoke-test` uses it for post-deploy verification, `/recipe capture-ui-state` uses it for PR evidence. It doesn't have its own workflow \u2014 it's invoked BY workflows.\n- **observe-agent** follows the same pattern \u2014 \"production eyes.\" Skills like `/investigate`, `/triage-alert`, `/hp-pipeline-pem` all invoke it for logs/metrics, but it's not a workflow itself.\n- **linkedin-cli-tools** = \"production hands.\" `/ship`, `/deploy-check`, `/implement` all invoke it for build/deploy/gRPC, but it provides capability, not workflow.\n\n## Implication\n\nWhen adopting new tools into the ecosystem, first ask: **is this a workflow (requires judgment), a capability (provides eyes/hands), or a checklist (mechanical steps)?**\n\n- Workflows \u2192 Tier 1 skill (`~/.claude/commands/`)\n- Capabilities \u2192 Tier 1.5 tool (`~/.claude/skills/`) \u2014 then wire it into existing Tier 1 skills and Tier 3 recipes\n- Checklists \u2192 Tier 3 recipe (`~/.claude/commands/recipes/`)\n\nThe adoption pattern for Tier 1.5 is: install the tool \u2192 create recipes that use it \u2192 update existing skills to invoke it \u2192 add to auth-preflight if it has auth state.\n\n## When to Apply\n\nWhen adding any new tool to the ecosystem: classify it as workflow/capability/checklist first. If it's a capability, the work is wiring it INTO existing tiers, not creating a new standalone workflow.", "learnings/staging/know-051.md": "When migrating Claude memory to a custom store, use `autoMemoryDirectory` in settings.json instead of symlinking `~/.claude/projects/*/memory/`. It redirects ALL auto memory reads and writes to one directory.\n\n**However:** Claude still reads per-project memory from `~/.claude/projects/<project>/memory/` separately. You need BOTH autoMemoryDirectory (for global) AND symlinks (for per-project) to achieve true single SoT.\n\n**How to apply:** Set `\"autoMemoryDirectory\": \"/path/to/memory\"` in user settings (not project settings). Then symlink each active project's memory path to subdirs within that directory.", "learnings/staging/know-011.md": "## mcm-mt \u2192 ActionWriteBack: 3 Prerequisites for Write-Back to Trigger\n\n**When** testing the mcm-mt partialUpdate \u2192 ActionWriteBack E2E flow (either via curli or UI), **check all 3 conditions** because any one missing causes silent fallback to regular batchUpsert with no error.\n\n### Prerequisites\n\n1. **LiX `talent.connected.project.phase2.enabled`** must be ramped for the contract\n   - mcm-mt checks: `_lixUtil.isEnabled(CONNECTED_PROJECT_PHASE2_ENABLED, contractUrn)` (HiringProjectCandidatesServiceImpl:683)\n   - Currently ramped for contracts: `2011455851`, `237044161`\n\n2. **Target CandidateHiringState must have `source: ATS`**\n   - mcm-mt checks: `newState.hasSource() && newState.getSource() == \"ATS\"` (line 733)\n   - Only non-global ATS stages have this \u2014 HP sourcing stages don't trigger write-back\n   - Verify: `curli d2://candidateHiringStates/(hiringContext:...,id:STATE_ID)` \u2192 check `source` field\n\n3. **Project must have active entity mapping in hpIntegrationEntityMappingApi**\n   - mcm-mt checks: `FindByHiringEntity(hiringProjectUrn)` returns mapping with `status: ACTIVE` (line 784-801)\n   - This mapping is created during Connected Project creation via `connectedProjectsApi/Create`\n   - Verify: `grpcurli d2://hpIntegrationEntityMappingApi FindByHiringEntity -d '{\"hiringEntityUrn\":{\"hiringProjectUrn\":{...}}}'`\n   - **Note**: Response uses `values` array not `elements` \u2014 parser must check both\n\n### curli Command (requires seat URN as actor)\n\n```bash\ncurli -X POST --dv-auth SELF -f prod-lva1 \\\n  -H \"X-RestLi-Method:partial_update\" \\\n  -H \"Accept:application/json\" -H \"Content-Type:application/json\" \\\n  -H \"X-RestLi-Protocol-Version:2.0.0\" \\\n  -d '{\"patch\":{\"$set\":{\"candidateHiringState\":\"urn:li:candidateHiringState:(urn:li:contract:CONTRACT,TARGET_STATE_ID)\"}}}' \\\n  \"d2://hiringProjectCandidates/(candidate:urn%3Ali%3AhireIdentity%3AHI_ID,hiringContext:urn%3Ali%3Acontract%3ACONTRACT,hiringProject:urn%3Ali%3AhiringProject%3A%28urn%3Ali%3Acontract%3ACONTRACT%2CPROJECT_I...", "learnings/staging/know-040.md": "## Context\n\nComplete system map of Connected Projects Phase 2 combining: backend task list (50+ P0/P1 tasks across 7 services), frontend scope doc (\"ATS Pipeline Sync States Scope\" \u2014 55 days, 9 tasks), ts-web component exploration, and Figma design analysis.\n\n## Key Facts\n\n### 9 Feature Workstreams\n1. Stage Sync (inbound) \u2014 IP \u2192 hp-ats \u2192 mcm-mt CHS creation\n2. Stage Move (outbound) \u2014 ts-web \u2192 ts-api \u2192 mcm-mt \u2192 hp-ats \u2192 IP \u2192 Greenhouse\n3. Automation Settings \u2014 Connected Project creation + HiringProjectPreference\n4. Request Tracking (HireEntityRequest) \u2014 NEW table/resource, status: PENDING\u2192CONFIRMED/FAILED\n5. Realtime + UI Updates \u2014 RequestStatusUpdateEvent \u2192 ts-web subscription \u2192 refresh\n6. Notifications + Banners \u2014 Global notification (success/failed), stage banners (pending/failed count)\n7. Offline Reconciliation \u2014 mcm-offline job req + app stage consistency\n8. Export Sourced Candidates \u2014 HP sourced \u2192 ATS with stage info\n9. Entitlements \u2014 Phase 2 feature gate in hire-access-control\n\n### Frontend Pipeline Sync States (ts-web, 55 days)\n- Task 1: Realtime subscription (15d) \u2014 IN PROGRESS, unblocks everything\n- Task 2: Stage tooltip (2d) \u2014 pending icon from connectedProjectAtsApplicationInfo.latestRequest\n- Task 3: Recruiter activities (5d) \u2014 Pending/Confirmed/Failed in activity feed, actor = ATS data provider\n- Task 4: Profile card updates (5d) \u2014 realtime refresh on stage change\n- Task 5: Review sync conflicts modal (10d) \u2014 list failed requests, retry/dismiss, batch actions\n- Task 6: ATS pipeline sync CTA (3d) \u2014 failed count badge in project header \u2192 opens modal\n- Task 7: ATS stage banner (5d) \u2014 pending + failed banners per stage, dismiss = update lastAccessTime\n- Task 8: Global notification (5d) \u2014 success/failed notifications, batch within 15min, link to applicants or ?showAtsSyncConflicts=true\n- Task 9: Import applicants banner (3d) \u2014 importing status + count\n\n### ts-web Key Components\n- `lib/pipeline-engine/addon/components/connected-project-pipeline.js` \u2014 main pip...", "learnings/staging/bug-004.md": "## When GDPR purge spikes cause widespread Espresso deletions, check HP impact via Trino CDC tables\n\n### Situation\nincident-10819 (SEV1): GDPR purger bug stripped URN type when extracting owner IDs, causing company URNs to be treated as member deletions. ~10M+ records deleted across 64 data stores. $170K/day revenue loss.\n\n### HP Impact Assessment Method\n1. Run Trino queries against `prod_dbchanges_<db>.<table>` filtering for `operation = 'DELETE'`\n2. Compare delete counts across 2-3 week window to identify surge\n3. Filter by `auditheader.appname = 'brooklin-service'` for purge-specific deletes\n4. Also check WITHOUT the appname filter to catch all deletion sources\n\n### HP Results\n- MultichannelManagement.SourcingChannelCandidatesV2: NOT impacted (0 deletes after 3/24)\n- HireAccessControlDB.RoleAssignment: NOT impacted (6 total, all on 3/23)\n- ResumesSearchDB.UniqueResumeVisibilities: IMPACTED (17.8x surge, 42.6M net new deletes)\n- ResumesSearchDB.UniqueResumes: IMPACTED (15.7x surge, 2.9M net new deletes)\n\n### Key Learnings\n- ResumesSearchDB is on ESPRESSO_STICKYROUTING cluster, not MD-2\n- ResumesSearchDB tables are actively used by recruiter-search-mt, hire-federated-search-backend, resumes-search-dedup-jobs\n- Recovery via Espresso bulk PUT restore from Lumos snapshots (incident team handles centrally)\n- Check the incident spreadsheet for assigned tables \u2014 may be different from core HP tables", "learnings/staging/know-035.md": "# mcm-mt Mental Model \u2014 Multi-Channel Management\n\n## What It Is\nCore HP backend owning hiring projects, candidate pipelines, and candidate state. \"MCM\" = Multi-Channel Management.\n\n## Core Entities\n- **HiringProject**: recruiter's hiring effort. Owns `atsPipelineUrn` (Phase 2).\n- **CandidateHiringPipeline**: ordered stage list. ATS stages are non-global.\n- **CandidateHiringState**: single stage, has `source` (ATS/HP) and `isGlobalState`.\n- **HiringProjectCandidate**: candidate\u2194project association + current stage. Key: `(hiringContext, candidate, hiringProject)`.\n- **HiringProjectPreference**: project-level settings incl. `atsPipelineAutomationSettings`.\n\n## Write-Back Flow\n```\nRecruiter UI \u2192 ts-web BATCH_PARTIAL_UPDATE \u2192 ts-api \u2192 mcm-mt partialUpdate\n  \u2192 ConnectedProjectCandidateGrpcClient.actionWriteBack() [D2: connectedProjectCandidateApi]\n    \u2192 hp-ats-integration-mt \u2192 IP actionUpsert \u2192 Greenhouse\n```\n\n## ATS Automation Flow\n```\nInMail sent/replied \u2192 HireMessageHistory event\n  \u2192 AutomatedPipelineStageTask (Brooklin consumer)\n    \u2192 LiX: MCM_ATS_AUTOMATED_PIPELINE_STAGE_TASK_ENABLED (per contract)\n    \u2192 If source==ATS \u2192 AtsAutomationPipelineSettingsHandler\n      \u2192 Reads automation prefs \u2192 checks target AHEAD of current \u2192 moveCandidatesInProject()\n    \u2192 Else \u2192 legacy HP automation (SHORTLISTED\u2192CONTACTED\u2192REPLIED)\n```\n\n## Key Packages\n| Package | Purpose |\n|---------|---------|\n| `impl/resource-impl` | REST.li resources (API entry) |\n| `impl/service` | Business logic (HiringProjectCandidatesServiceImpl, AtsAutomationPipelineSettingsHandler) |\n| `impl/ds/client` | Downstream gRPC clients (\u2192 hp-ats-integration-mt) |\n| `impl/event-processors` | Brooklin consumers (AutomatedPipelineStageTask) |\n\n## Architecture\n- REST.li + gRPC, Espresso (`multichannelmanagement`, table `candidatehiringstatesv2`)\n- Upstream: talent-solutions-api (20+ endpoints), talent-solutions-web\n- Downstream: hp-ats-integration-mt (writeback), hire-identity-service\n- Siblings: mcm-jobs-integration-mt, ...", "learnings/staging/know-064.md": "# When building protocol compatibility, put the lifecycle model in core\n\n**Situation:** Adding A2A HTTP compatibility to a NATS messaging system.\n\n**Action:** Put the task state machine in `agentbus/task.py` (core), not in the A2A module. The A2A gateway, the NATS listener, and the pipe command all use the same TaskStore. context_id links tasks across communication patterns (pipe session \u2192 async tasks \u2192 A2A requests).\n\n**Reason:** The original plan was to build the state machine inside the A2A module. The user spotted that the state machine benefits ALL delegation, not just HTTP. This avoided duplicating lifecycle logic across NATS async, A2A HTTP, and pipe sessions.\n\n**Key pattern:** When adding protocol interop, separate the MODEL (task lifecycle) from the PROTOCOL (HTTP/NATS). The model is reusable; the protocol is a view.", "learnings/staging/know-050.md": "# RestLiAssociation Finders Require v1 Protocol (No X-RestLi-Protocol-Version:2.0.0)\n\n## Context\nSpent an entire session failing to call `hiringProjectCandidates?q=hiringProject` finder. The `X-RestLi-Protocol-Version:2.0.0` header causes \"not a Compound key\" errors for `@RestLiAssociation` resources. Removing the header (default v1 protocol) fixes it immediately.\n\n## Guidance\n\n**When calling a finder on a `@RestLiAssociation` resource, do NOT use `X-RestLi-Protocol-Version:2.0.0`.**\n\n### Working pattern (v1 protocol, no version header):\n```bash\ncurli --dv-auth SELF -f prod-ltx1 \\\n  'd2://hiringProjectCandidates/hiringContext=urn:li:contract:CONTRACT&hiringProject=urn:li:hiringProject:(urn:li:contract:CONTRACT,PROJECT_ID)?q=hiringProject&start=0&count=50' \\\n  -H 'Accept:application/json'\n```\n\n### Key rules:\n1. **Assoc keys go in the path** before `?q=`: `d2://resource/key1=val1&key2=val2?q=finder`\n2. **No URL encoding needed** for URN colons/parens in assoc key values\n3. **No `X-RestLi-Protocol-Version:2.0.0` header** \u2014 use default (v1)\n4. **v2 protocol misparses** the `&`-separated assoc keys as compound key notation and fails\n\n### How to tell if a resource is an Association:\n- Java: `@RestLiAssociation` annotation, extends `AssociationResourceAsyncTemplate`\n- PDL/IDL: has `assocKeys` in resource definition\n- Multiple `@Key` annotations with `@AssocKeyParam` in finders\n\n### Contrast with ComplexKey resources:\n- `@RestLiCollection` with `ComplexKeyResourceTemplate` \u2192 uses v2 protocol, `(field1:val1,field2:val2)` format\n- `@RestLiAssociation` with `AssociationResourceAsyncTemplate` \u2192 uses v1 protocol, `key1=val1&key2=val2` format\n\n### Verified example:\n```bash\n# hiringProjectCandidates \u2014 @RestLiAssociation with assocKeys: hiringContext, candidate, hiringProject\n# Finder \"hiringProject\" uses @AssocKeyParam for hiringContext and hiringProject\ncurli --dv-auth SELF -f prod-ltx1 \\\n  'd2://hiringProjectCandidates/hiringContext=urn:li:contract:2011455851&hiringProject=urn:l...", "learnings/staging/know-001.md": "**When** investigating why export status events aren't being consumed, **check** the topic name **because** IP silently migrated from `IntegrationApplicationStageExportStatusEvent` to `IntegrationExportRequestStatusEvent`.\n\n## Context\nThe new topic is generic (has `requestType` field: APPLICATION_STAGE, APPLICATION_DISPOSITION). The `clientEntityUrn` moved from top-level to `requestMetadata.clientEntityUrn`. Uses standard `EventHeader` instead of `KafkaAuditHeader`.\n\n## Key Details\n- Tracking cluster with colo rerouting \u2014 each fabric's consumer uses `kafka.tracking-local`\n- No cross-fabric duplicates \u2014 colo rerouting routes to one fabric\n- Multiple status transitions per request (REQUEST_RECEIVED \u2192 REQUEST_AT_GATEWAY \u2192 SUCCESS/FAILURE)\n- Add idempotency check: skip if HireEntityRequest already in terminal FAILURE state", "learnings/staging/knowledge-venice-mental-model.md": "# Venice \u2014 LinkedIn's Derived Data Store\n\n## What It Is\nVenice is LinkedIn's distributed key-value store for serving **precomputed/derived data** with sub-ms read latency. NOT a source of truth \u2014 that's Espresso. Venice serves the derived version of truth (ML features, embeddings, recommendations, denormalized views).\n\n## When to use Venice vs Espresso\n- **Venice**: Precomputed data, read-heavy (>1000:1), batch+streaming writes via Kafka, eventual consistency\n- **Espresso**: Source of truth, CRUD, read-your-writes consistency, direct transactional writes\n\n## Core Concepts\n- **Store**: Named key-value dataset (Avro schema). Three types: batch-only, streaming-only, hybrid (most common)\n- **Push Job (VPJ)**: Batch write from Hadoop/Spark \u2192 Kafka \u2192 atomic version swap\n- **Hybrid Store**: Merges batch + streaming writes at WRITE time (not read time like Lambda)\n- **DaVinci Client**: Local RocksDB, <1ms SSD \u2014 makes your app stateful (NSS deployment)\n- **Thin Client**: App \u2192 Router \u2192 Server, ~10ms P99 \u2014 simplest setup\n- **Fast Client**: App \u2192 Server directly, lower latency than thin\n\n## HP Service Usage\n| Service | Role | Store(s) |\n|---|---|---|\n| mcm-mt | READ | `EnterpriseJobSJFEmbeddings`, `HiringPlatformIntegrationJobRequisitionEmbeddings` (job embeddings for similar project matching) |\n| talent-solutions-api | READ | Job Distribution Feed store (ATS Job Feed feature) |\n| talent-partner-integrations-mt | READ+WRITE | `HsJobRequisitionToHiringProjectBiMap` (bidirectional job req \u2194 hiring project mapping) |\n| hp-ats-integration-mt | Config only | Changelog consumer config exists but no Java code (unused CDC setup) |\n| hire-access-control | Config only | No active usage |\n\n## Key Gotchas\n- First push after enabling hybrid MUST be full (not incremental)\n- Key schemas are immutable \u2014 must delete+recreate store to change\n- Partition count immutable once hybrid \u2014 plan upfront\n- Samza system name must be `\"venice-0\"` NOT `\"venice\"` (silent failure)\n- Batch get max 150 keys on...", "learnings/staging/know-015.md": "## Euler Mental Model \u2014 Entity Management and GLAI Indexing\n\n**When** working with HireEntityRequest or any Euler managed entity, understand these fundamentals to avoid silent query failures and deployment confusion.\n\n### get vs find \u2014 The Critical Difference\n\n```\nget(urn)   \u2192 Espresso (SOT) directly \u2192 ALWAYS works\nfind(where) \u2192 GLAI (TiDB) via index \u2192 FAILS if entity not indexed\n```\n\n**If GLAI indexing fails for ANY reason, ALL finders return empty for that entity \u2014 no error.**\n\n### Why GLAI Indexing Fails\n\nThe GLAI pipeline: Espresso write \u2192 Brooklin CDC \u2192 euler-index-builder (Samza) \u2192 TiDB upsert.\n\n**Common failure: queryField value exceeds column maxSize** (default ~255 chars).\n- One bad field poisons the WHOLE entity \u2014 it's dropped entirely from GLAI\n- The entity still exists in Espresso (get works), but invisible to all finders\n- No error logged in the consuming service \u2014 finders silently return empty\n\n### queryField Configuration\n\n```protobuf\n// In HireEntityRequestEulerConfigurations.proto\noption (.euler.entityOptions) = {\n  queryField: {path: \"hiringProjectUrn\"}\n  queryField: {path: \"hiringProjectCandidateRequestDetails.candidate\"}\n  queryField: {path: \"hiringProjectCandidateRequestDetails.historyUrn\", maxSize: 300}\n  queryField: {path: \"status\"}\n  queryField: {path: \"isDismissed\"}\n  queryField: {path: \"lastModifiedAt\"}\n  queryField: {path: \"hiringProjectCandidateRequestDetails.targetPipelineStateValue\"}\n};\n```\n\n- `maxSize` controls TiDB varchar column width for compound URN fields\n- Without it, defaults to ~255 \u2014 easily exceeded by nested proto URNs\n- Set explicitly for any compound URN field (especially HiringProjectCandidateHistoryUrn)\n\n### Deployment Pipeline\n\n```\nlinkedin-entities repo (PR merged)\n  \u2192 Post-merge CI builds version (e.g., v1.0.423)\n  \u2192 Deploys to vertical (euler-managed-entities-common-pool)\n  \u2192 Dark cluster first (canary on one host per fabric)\n  \u2192 Main fleet promotion (manual or auto after bake time)\n```\n\n- HireEntityRequest lives in *...", "learnings/staging/know-015-2.md": "**When** debugging ActionWriteBack failures, **trace through the full chain step by step** because the flow spans 5+ services and failures at any link produce different error patterns.\n\n## Context\n\n### Full ActionWriteBack Chain\n```\n1. ConnectedProjectCandidateApi/ActionWriteBack (hp-ats-integration-mt)\n   - Resolves V2 identity (V1\u2192V2 if needed)\n   - Looks up HPC\u2192IntegrationApplicationStage mapping\n   - Looks up target CandidateHiringState\u2192IntegrationJobRequisitionStage mapping\n   - Creates HireEntityRequest in Euler (status=PENDING)\n   - Calls IP actionUpsert\n\n2. IP IntegrationApplicationStageApi/actionUpsert (talent-partner-integrations-mt)\n   - Creates IntegrationApplicationStageExportRequest\n   - Routes to nexor-backend\n\n3. nexor-backend \u2192 Greenhouse Harvest API\n   - POST /applications/{id}/move (moves candidate to stage)\n\n4. IP confirmation loop\n   - Greenhouse data re-ingested\n   - IntegrationExportRequestStatusEvent published (tracking cluster)\n\n5. ExportStatusEventProcessor (hp-ats-integration-mt)\n   - Updates HireEntityRequest: PENDING \u2192 SUCCESS/FAILURE\n   - Publishes realtime event for UI refresh\n```\n\n### Common Failure Patterns\n\n| Error | Location | Cause |\n|-------|----------|-------|\n| \"No IntegrationApplicationStage mapping found\" | Step 1 | Wrong V2 identity (bug-001) or race condition (bug-002) |\n| FAILED_PRECONDITION | Step 2 | Integration disabled for this data provider |\n| PERMISSION_DENIED | Step 1/2 | ACL not deployed for prod (EI ACLs don't cover prod) |\n| Greenhouse 422 | Step 3 | Invalid stage transition or candidate already on target stage |\n| HireEntityRequest stuck PENDING | Step 4-5 | ExportStatusEvent not published, or consumer on wrong topic (know-001) |\n\n### Export Request Status Fields\n| Field | Values | Meaning |\n|-------|--------|---------|\n| writeStatus | REQUEST_RECEIVED \u2192 REQUEST_AT_GATEWAY \u2192 PARTNER_API_SUCCESS/FAILURE | Outbound write progress |\n| readStatus | DATA_READ_PENDING \u2192 DATA_READ_CONFIRMED/CONFLICT/EXPIRED | Confirma...", "learnings/staging/bug-010.md": "## Symptoms\nDuring /compound, agent classified its own cmux evaluation as +2.0 STRONG_POSITIVE with tag \"intellectual-honesty\" \u2014 rewarding itself for recommending against adoption.\n\n## Root Cause\nAgent scored based on what IT did (gave honest recommendation) rather than what the USER said (moved on without praise = neutral acceptance). This is sycophancy in reverse \u2014 inflating scores to validate own behavior.\n\n## Fix\n1. Added \"Feedback Scoring\" gate to behavioral-gates.md\n2. Rule: signal comes from USER'S words, not agent's self-assessment\n3. +2.0 requires explicit praise. Baseline competence = +1.0 max.\n\n## Prevention\nDuring /compound Step 7, for each signal ask: \"What EXACTLY did the user say?\" If the answer is \"they moved on\" or \"they said cool\" \u2014 that's +0.5 to +1.0, never +2.0.", "learnings/staging/knowledge-004.md": "## When checking Espresso table metrics, search by cluster name not just DB name\n\n### Context\nEspresso metrics are keyed by cluster name (e.g., ESPRESSO_MT-MD-2, ESPRESSO_STICKYROUTING), not database name. Different databases live on different clusters.\n\n### Guidance\n- HireAccessControlDB \u2192 cluster `ESPRESSO_MT-MD-2`\n- ResumesSearchDB \u2192 cluster `ESPRESSO_STICKYROUTING`\n- RRD pattern: `espresso-router/espresso-router.i001.Traffic_Checker_Table_Stats.TrafficCheckerTableStats_<CLUSTER>.<DB>-<Table>_TableTotalCallCount.rrd`\n- Base document tables may not have their own metrics \u2014 traffic is tracked on versioned secondary index tables (e.g., RoleAssignmentsV3 not RoleAssignment)\n- Read/Write trackers: `EspressoRouterSensor_<CLUSTER>_<DB>_ReadCallTracker.CallCountTotal.rrd`\n- Use observe-agent to discover the correct cluster: \"Search for ALL available Espresso metrics containing '<DB>' in the RRD name\"\n\n### When to Apply\n- Verifying Espresso table health during incidents\n- Checking RCU/WCU for quota monitoring\n- Investigating data deletion impact (e.g., GDPR purge incidents)", "learnings/staging/aha-006.md": "## Pattern\n\n`open file://` URLs from Claude Code in a cmux split-pane layout = inline visual verification without context-switching. The browser renders on the right while the terminal stays on the left. Visual artifacts (HTML graphs, reports, screenshots) become part of the coding loop, not a separate step.\n\n## Evidence\n\n- [eureka-009]: Static HTML knowledge graph \u2014 opened inline during development, user saw the D3.js graph immediately while reviewing code changes in the terminal\n- This session: Added hooks layer to graph, opened in browser, took screenshot, verified visually \u2014 all without leaving the terminal flow\n\n## Implication\n\nWhen building visual artifacts (HTML reports, knowledge graphs, diagrams), proactively `open` them in the browser so the user sees results immediately in their adjacent pane. This makes visual verification a zero-friction part of the development loop rather than a manual step.\n\n## When to Apply\n\n- After generating any HTML file (reports, visualizations, graphs) \u2192 `open` it\n- After modifying existing HTML artifacts \u2192 `open` to verify\n- When the user needs to visually confirm UI changes \u2192 screenshot + open\n- Any time you'd say \"you can open this file to verify\" \u2192 just open it instead", "learnings/staging/know-054.md": "When building background processes (dream.py, async tasks, dependency watchers), make results push-based not pull-based. Wire a notification check into the UserPromptSubmit scout hook that shows results once per event (tracked by a .last-seen marker file), then goes quiet.\n\n**Pattern:** Event writes result file \u2192 scout hook reads on next prompt \u2192 shows if unseen \u2192 marks as seen.\n\n**Why:** Users don't check logs. cmux's notification rings work because they're push-based. Same principle applies to CLI \u2014 the scout hook is your notification center.\n\n**How to apply:** For any new background process, add a check_*_notifications() function to knowledge-scout.py with a marker file for dedup.", "learnings/staging/know-031.md": "## Context\nClaude Code /insights report (18 sessions, 467 messages) revealed that the #1 friction source is \"wrong initial approach\" \u2014 14 instances across 18 sessions where the agent pursued the wrong root cause, wrong processor, or over-engineered solutions requiring user interruption and redirect.\n\n## Guidance\nThe compound learning system captures knowledge effectively (insights accumulate), but doesn't yet prevent wrong-approach behavior at the start of work. Three things need strengthening:\n\n1. **Hypothesis-first is not optional**: Before any code search or log reading, present 2-3 candidate hypotheses and wait for user confirmation. This is already in /investigate but the agent sometimes skips it.\n2. **Pre-work context check matters**: The knowledge scout surfaces relevant insights, but the agent doesn't always use them to narrow the investigation before starting.\n3. **Simpler = better**: When the codebase already has a pattern for the problem (e.g., in master), use it. Don't invent a new approach when an existing one works.\n\n## When to Apply\nEvery debugging session, every investigation, every time the agent is about to \"deep dive\" into code. The cost of asking one question first (\"which processor should I look at?\") is 10 seconds. The cost of going down the wrong path is 20+ minutes.", "learnings/staging/'know-044'.md": "## Claude Code permission changes require session restart\n\nWhen adding new `Bash(tool:*)` entries to `settings.json` permissions allowlist, the changes do NOT take effect in the current session. The user must start a new Claude Code session for the permissions to be active.\n\n**Why:** Claude Code reads permissions at startup, not dynamically.\n\n**How to apply:** When adding permissions mid-session (like `ssh`, `scp`, `mutagen`), tell the user upfront that a session restart is needed. Provide `!` commands as a workaround for the current session, and defer automated execution to the next session.", "learnings/staging/eureka-005.md": "## Breakthrough\n\n50+ tasks, 9 workstreams, 7 services \u2014 but Phase 2 is actually **3 pipelines sharing one entity mapping layer**. This single mental model replaces the need to understand each task individually. Every bug, test, debugging session, onboarding explanation, and bug bash test case maps to one of these 3 + the shared layer.\n\n## The Old Way\nReason about Phase 2 as a flat list of 50+ tasks across 7 services. Each service \"does stuff.\" Debugging means tracing through arbitrary code paths. Explaining to someone new means walking through each service.\n\n## The New Way\nPhase 2 = 3 pipelines + 1 shared layer. Period.\n\n## The Pattern\n\n```\n                    \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n                    \u2502   Entity Mapping      \u2502\n                    \u2502   (shared layer)      \u2502\n                    \u2502                       \u2502\n                    \u2502  HP entity \u2194 IP entity\u2502\n                    \u2502  HPC \u2194 IntApp         \u2502\n                    \u2502  CHS \u2194 IntAppStage    \u2502\n                    \u2502  History \u2194 IntAppStageHistory \u2502\n                    \u2514\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u252c\u2500\u2500\u2500\u2518\n                        \u2502      \u2502       \u2502\n            \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2518      \u2502       \u2514\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n            \u25bc                  \u25bc                   \u25bc\n   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510   \u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n   \u2502 Pipeline 1:  \u2502   \u2502 Pipeline 2:   \u2502   \u2502 Pipeline 3:   \u2502\n   \u2502 INBOUND SYNC \u2502   \u2502 OUTBOUND      \u2502   \u2502 REALTIME      \u2502\n   \u2502              \u2502   \u2502 WRITEBACK     \u2502   \u2502 FEEDBACK      \u2502\n   \u2502 IP \u2192 HP      \u2502   \u2502 HP \u2192 ATS      \u2502   \u2502 Status \u2192 UI   \u2502\n   \u2502              \u2502   \u2502               \u2502   \u2502               \u2502\n   \u2502 Kafka:       \u2502   \u2502 gRPC chain:   \u2502   \u2502 Kafka:        \u2502\n   \u2502 queuing      \u2502   \u2502 mcm\u2192hp-ats\u2192IP \u2502   \u2502 tracking      \u2502\n   \u2502 cluster      \u2502   \u2502 \u2192Greenhouse   \u2502   \u2502 cluster       \u2502\n   \u2502              \u2502   \u2502               \u2502   \u2502               \u2502\n   \u2502 Processors:  \u2502   \u2502 Services:     \u2502   \u2502 Services:     \u2502\n   \u2502 JobReqStage  \u2502   \u2502 ActionWrite   \u2502   \u2502 ExportStatus  \u2502\n   \u2502 Application  \u2502   \u2502 BackApi       \u2502   \u2502 EventProcessor\u2502\n   \u2502 Ap...", "learnings/staging/know-049-2.md": "When designing the knowledge architecture, make Claude's native memory the foundation \u2014 not a parallel store.\n\n**Principle:** We generate + evaluate \u2192 Claude stores + maintains \u2192 we retrieve.\n\n**Three layers:**\n1. Auto Memory (native) = the WHAT (facts, preferences, findings)\n2. Compound Engine (custom) = the HOW (scoring, lifecycle, search)\n3. Eval Engine (custom) = the WHY (measurement, classification, improvement)\n\n**Key insight:** Auto Dream handles memory hygiene (prune stale, merge overlaps, fix dates) for free. Our custom systems should generate knowledge and measure quality \u2014 not maintain the store.\n\n**Migration plan:** ~/projects/compound-learning-ecosystem/memory-migration/plan.md\n**Risk gate:** Phase 0 \u2014 test if Auto Dream preserves custom frontmatter fields.\n\n**How to apply:** When writing new knowledge, write to memory/ (for Auto Dream) AND staging/ (for scoring). When graduating insights, move to memory/. Stop maintaining parallel stores.", "learnings/staging/eureka-001.md": "## Breakthrough\n\nDurable cron jobs enable **cross-session async workflows** \u2014 start a long-running external wait in one session, and the next session picks up automatically when the condition is met.\n\n## The Old Way\n\nWhen waiting on an external process (IP sync, deployment, PR merge, Kafka lag clearing):\n- Set up a poll, wait in the current session\n- If the session ends, manually remember to re-check next time\n- Or: tell the user \"check back in an hour\" and hope they remember\n- Context is lost between sessions \u2014 the next session doesn't know what was being waited on\n\n## The New Way\n\n```\nSession 1:\n  \u2192 Create Greenhouse job\n  \u2192 IP hasn't synced yet (1hr+ cadence, Kafka lag)\n  \u2192 CronCreate(durable=true, cron=\"*/10 * * * *\", prompt=\"check if IP synced job X\")\n  \u2192 Continue working on other things\n\nSession 2 (hours/days later):\n  \u2192 Cron fires automatically on session start\n  \u2192 \"IP synced! IntJobReqId=12345\"\n  \u2192 Continue E2E testing from where Session 1 left off\n```\n\nThe durable cron persists to `.claude/scheduled_tasks.json` and survives session restarts. The prompt contains all the context needed \u2014 the next session doesn't need to know the backstory.\n\n## Impact\n\n- **Eliminates \"remember to check\" cognitive load** \u2014 the system tracks it for you\n- **Enables parallel async workflows** \u2014 wait for IP sync + wait for deployment + wait for PR review, all as separate cron jobs\n- **Cross-session continuity** \u2014 the hardest problem in multi-session work (losing context) is solved by encoding the check into the prompt itself\n- **Scope: all projects** \u2014 any workflow involving external waits benefits\n\n### Use cases discovered:\n1. **Dependency sync polling** (IP sync from Greenhouse) \u2014 `/watch-deps` pattern\n2. **Deployment monitoring** \u2014 poll `go-status` until new version appears\n3. **PR status tracking** \u2014 poll until CI passes or reviewer approves\n4. **Kafka lag clearing** \u2014 poll until consumer catches up\n5. **Entity indexing** \u2014 poll GLAI find until entity becomes queryable\n\n## Risk...", "learnings/staging/eureka-003-2.md": "## Breakthrough\n\nCombining multiple internal data sources (Trino tables + APIs + Confluence + MP knowledge + live console) through systematic cross-validation produces executive-level intelligence that no single dashboard provides.\n\n## The Old Way\n\nEach data source is queried in isolation:\n- go/aiide/usage for adoption dashboards\n- Anthropic Console for individual cost\n- Confluence for program status\n- Crew API for org structure\n- Each tells a partial story. No one \u2014 not even directors \u2014 has the combined picture.\n\n## The New Way\n\n**Multi-source data synthesis pattern:**\n1. **Identify all data sources** \u2014 don't stop at the first table. Map the full ecosystem (supertable, cost tables, crew API, console, wiki, MP knowledge).\n2. **Cross-validate units and accuracy** \u2014 check one source against another (Trino estimated_cost vs Anthropic Console SoT). This caught the cents-vs-dollars ambiguity.\n3. **Combine dimensions** \u2014 adoption (supertable) + cost (claude_code + cursor_usage_events) + org structure (crew API) + strategy (AI Constellation wiki) = full picture.\n4. **Surface insights no individual system reveals** \u2014 e.g., \"100% adoption, $27K/month Claude, 90/10 Claude-to-Cursor ratio, enterprise pricing at 40% opus discount, per-person cost tiers, model usage breakdown, dual-tool usage patterns.\"\n\nThe result: a view that surpasses what any existing dashboard provides, assembled on-demand from raw data.\n\n## Impact\n\n- **Replaces**: manual dashboard-hopping and spreadsheet assembly\n- **Scope**: any team wanting AI usage intelligence \u2014 the pattern is reusable\n- **What changes**: instead of asking \"where's the dashboard?\", ask \"what are all the data sources?\" and synthesize\n\n## Risks & Caveats\n\n- Data freshness: Trino tables lag real-time (ETL delay). Console is SoT for current state.\n- Enterprise pricing in estimated_cost may change \u2014 re-verify periodically.\n- The pattern requires knowing which tables exist \u2014 the developer-productivity-analysis MP knowledge is the rosetta sto...", "learnings/staging/know-012-2.md": "**When** producing Kafka test events for Phase 2 processors, **follow the exact Avro format conventions** because subtle format differences cause silent deserialization failures.\n\n## Context\n\nTwo event types with different formats and clusters:\n\n### IntegrationEntityReadyEvent (queuing cluster)\n- Cluster: `queuing` (requires LDAP password \u2014 use tmux on shell host)\n- `treeId`: can be `null` (unlike ExportStatusEvent)\n- `operationType`: `avro.com.linkedin.events.unifiedintegration.IntegrationEntityOperationType` (note `avro.` prefix, NOT `proto.`)\n- `guid`: fixed_16, exactly 16 bytes (e.g., `abcdefghijklmnop`)\n- `messageId` in `KafkaAuditHeader`: also 16 bytes\n- `memberIdV2`: present but usually `null`\n- Has `EventHeader` wrapper with all standard tracking fields\n\n### IntegrationExportRequestStatusEvent (tracking cluster)\n- Cluster: `tracking` (no password, uses `kafka.tracking-local`)\n- `treeId`: fixed_16, required (exactly 16 bytes)\n- `guid`: fixed_16, exactly 16 bytes\n- `messageId`: exactly 16 bytes (`0123456789abcdef`)\n- `requestType`: `APPLICATION_STAGE` or `APPLICATION_DISPOSITION`\n- `clientEntityUrn`: in `requestMetadata` (not top-level)\n- Enum values: short form (`FAILURE`, not `ExportRequestRecommendedStatus_FAILURE`)\n- `actor`: `null` \u2014 processor reads actor from HireEntityRequest\n\n## Guidance\n\n1. **Always consume 1 real event first** to verify the Avro format before producing test events:\n   ```bash\n   kafka-tool topic consume -f prod-ltx1 -c queuing -t IntegrationEntityReadyEvent --max-messages 1 --pretty-print\n   ```\n2. **Must SSH to shell host** for Kafka production (e.g., `ltx1-shell07.prod.linkedin.com`). Cannot produce from local Mac.\n3. **Single-line JSON**: `echo '...' | kafka-tool topic produce -f prod-ltx1 -c queuing -t TOPIC`\n4. **EI uses queuing cluster** for IntegrationEntityReadyEvent: `-c queuing -f ei-ltx1` (NOT tracking \u2014 tracking is for cross-fabric events like ExportStatusEvent)\n\n## QEI Local Testing (Verified 2026-04-07)\n\n1. **Cluster**:...", "learnings/staging/know-013-2.md": "**When** testing or debugging Phase 2 features, **verify the correct LIX is enabled for the target entity** because different features are gated by different LIX keys with different scoping (per-dataProvider vs per-contract).\n\n## Context\n\n### Backend LIX Keys\n| LIX Key | Scope | Controls | Ramped For |\n|---------|-------|----------|------------|\n| `talent.connected.project.phase2.enabled` | per-dataProvider | Phase 2 branch in all processors (ApplicationStageProcessor, ExportStatusEventProcessor, etc.) | `225950754`, `223878556` |\n| `talent.shortened.history.urn.mapping.key.enabled` | per-dataProvider | Shortened URN workaround for Espresso KEY_TOO_LONG | Same as above |\n\n### Frontend LIX Keys\n| LIX Key | Scope | Controls |\n|---------|-------|----------|\n| `talent-solutions-api.hire.entity.request.real.data.enabled` | per-request (cookie override) | Real data in `talentHireEntityRequests` API (vs mock data) |\n\n### LIX Override Methods\n- **Local service (mint deploy)**: `--ic 'Lror-<lix.key>:enabled'` in curli/grpcurli\n- **Browser (frontend)**: Add `key=enabled` to `lror` cookie\n- **Prod service**: LIX must be ramped via LIX dashboard (no override)\n\n## Guidance\n\n- Phase 2 processors check LIX at the **event processing level** using the `dataProvider` from the event. If the dataProvider isn't in the ramp list, the event falls through to Phase 1 processing (or is skipped).\n- ATS notification LIX is separate \u2014 logs show \"ATS stage change notification disabled by Lix\" even when Phase 2 processing succeeds.\n- When adding a new data provider to testing, it must be added to the LIX ramp list first.\n\n## When to Apply\n\nWhen Phase 2 code paths aren't executing despite correct events being published, or when testing with a new data provider / contract.", "learnings/staging/know-seat-entitlements-vs-seatroles.md": "## When checking HP feature entitlements (e.g., CAN_ACCESS_RECRUITER_PLUS_FEATURES), use `seatEntitlements` on Seat, not `seatRoles`\n\n**Context:** In ssr-data-service, we needed to check if a seat has `CAN_ACCESS_RECRUITER_PLUS_FEATURES` (Aperture/Recruiter Plus). Initial approach was to check `Seat.seatRoles` for `HP_RECRUITER_PLUS_SEARCHER_SEAT` as a proxy.\n\n**Guidance:** `seatRoles` and `seatEntitlements` are different concepts:\n- `seatRoles` = what the seat IS (HP_ADMIN_SEAT, HP_SOURCER_SEAT, HP_RECRUITER_PLUS_SEARCHER_SEAT)\n- `seatEntitlements` = what the seat CAN DO (CAN_ACCESS_RECRUITER_PLUS_FEATURES, CAN_POST_JOB, etc.)\n\nEntitlements are the canonical way to check permissions. When you need a permission check, use the actual entitlement \u2014 not a seat role as a proxy. The mapping between roles and entitlements is managed by the platform (hp-ep-mt/SeatEntitlementsService) and can change.\n\n**Key pattern:** If the `Seat` proto doesn't have the field you need, the right move is to add it to `hp-ep-api` (Seat.proto) as a first-class field. See hp-ep-api PR #916 which added `seatEntitlements` as `repeated HiringPlatformEntitlement` to Seat.proto.\n\n**Reusability principle:** When adding data to a model, prefer exposing it broadly (e.g., `seatEntitlements: [String!]` on `HireSeat` GraphQL type) rather than a single boolean for one use case. The SME added both `canAccessAperture` on the email type AND `seatEntitlements` on `HireSeat` for reuse.\n\n**When to apply:** Any time you're checking HP permissions from a data fetcher \u2014 look for the entitlement on `seatEntitlements`, don't try to reverse-engineer it from `seatRoles` or `contractType`.\n\n**Reference PRs:**\n- hp-ep-api #916: Added `seatEntitlements` to Seat.proto\n- ssr-data-service #7032: Consumed it in HireSeatDataFetcher + EmailHireProjectCollabInviteDataFetcher\n- hire-comms-ssr-frontend #3495: Used `canAccessAperture` to drive email terminology", "learnings/staging/eureka-002-2.md": "## Breakthrough\n\nThe agent can **discover a need, design a pattern, and create a reusable skill** in a single organic workflow \u2014 without being explicitly asked to build tooling. Skills emerge from real work, not from upfront planning.\n\n## The Old Way\n\nSkill creation was a deliberate, top-down activity:\n1. User identifies a recurring pattern\n2. User asks agent to create a skill\n3. Agent writes the skill file\n4. Skill gets used in future sessions\n\nThe assumption: humans identify the patterns, agents implement them. Skills are planned artifacts.\n\n## The New Way\n\nSkills emerge organically from the compound learning loop:\n\n```\nSession work (E2E testing)\n  \u2192 Hit a real problem (IP sync takes hours, can't wait in session)\n  \u2192 Agent solves it ad-hoc (durable cron job)\n  \u2192 User notices the pattern (/eureka)\n  \u2192 Agent recognizes it's generalizable\n  \u2192 Agent proposes the skill (\"/wait-for \u2014 would this be useful?\")\n  \u2192 User confirms\n  \u2192 Agent creates the skill immediately, informed by the real problem it just solved\n  \u2192 Skill is battle-tested from day one (not theoretical)\n```\n\nThe key insight: **the best skills come from solving real problems, not from imagining hypothetical ones.** The agent was already in the problem space, already had the context, already knew the edge cases. The skill it creates is grounded in reality.\n\n## Impact\n\n- **Skills are higher quality** \u2014 born from real usage, not specification\n- **Faster iteration** \u2014 discover \u2192 create \u2192 use in one session, not three\n- **Compound acceleration** \u2014 each session's work makes future sessions faster, and the agent actively identifies which parts to codify\n- **Reduces \"tool building\" overhead** \u2014 no separate planning sessions needed for tooling\n- **Scope: all agent workflows** \u2014 any recurring pattern discovered during work is a candidate\n\n### The chain that produced /wait-for:\n1. Created Greenhouse jobs for E2E testing\n2. IP didn't sync (Kafka lag) \u2014 had to wait\n3. Set up durable cron to poll (ad-hoc solution)\n4. Reali...", "learnings/staging/'know-043'.md": "## Portable Claude Knowledge Architecture\n\nWhen setting up Claude Code across multiple machines (laptop + VM), separate **durable knowledge** (~1MB) from **ephemeral state** (~500MB).\n\n**Durable (sync via git):** rules/, commands/, skills/, learnings/, memory/\n**Ephemeral (machine-local):** projects/conversations, file-history, plugins, image-cache, paste-cache\n\n**Key design decisions:**\n- `install.sh` symlinks knowledge dirs into `~/.claude/` \u2014 never copy (single source of truth)\n- Settings.json stays machine-specific (hooks may differ per machine) \u2014 `install.sh` only copies if none exists\n- Project memory path-key mismatch (`-Users-` vs `-home-`) solved via cross-symlink in install.sh\n- Auto-sync via SessionEnd (push) and UserPromptSubmit (pull) hooks\n- Hourly cron as backup sync\n- GitHub as the durable remote \u2014 survives both VM and laptop failures\n\n**How to apply:** When provisioning any new machine for Claude Code, clone the knowledge repo and run `install.sh`. Full environment in one command.", "learnings/staging/know-048-2.md": "When building a quality improvement system for an AI agent, use the Oracle eval pattern: structured failure taxonomy + LLM-as-judge + improvement simulation + closed loop.\n\n**Architecture:**\n- Judge evaluates sessions across 5 dimensions: agreement rate, behavioral awareness, compound learning, collaboration, principle adherence\n- 7 failure types: wrong_approach, tool_misuse, over_engineering, skill_deficiency, skill_gap, context_miss, user_ambiguity\n- Simulation: \"if we fix all X failures, agreement improves by Y%\" \u2192 prioritize fixes\n- Closed loop: fix \u2192 re-measure \u2192 accept/revert\n\n**Key numbers (baseline, 35 sessions):**\n- Agreement rate: 76.2% (94.5/124 correct first approach)\n- Principle adherence: 85.1% (349/410)\n- Foundation score: 0.84\n- Loop closure: 10% (worst metric)\n\n**Why:** Modeled after candidate-quality-oracle (PRs #265, #300). Their system drove industry_match agreement from 25% \u2192 70%. Ours identified wrong_approach as #1 friction (+9.7% if fixed) and verify_own_understanding as #1 principle violation (14x).\n\n**How to apply:** Run `/improve-agent` periodically. It reads session transcripts, judges them, classifies failures, simulates improvements, and proposes fixes to behavioral gates. Each iteration should target one failure type.", "learnings/staging/know-049.md": "# How to Compose a curli Command for an Unfamiliar Rest.li Service\n\n## Context\nWhen you need to call a Rest.li service you've never used before (no existing curli in REFERENCE.md), you need to discover the D2 service name, resource path, key format, and encoding. This process was refined while building the entity routing curli.\n\n## Guidance\n\n**When composing a curli for an unfamiliar service, follow this 6-step process:**\n\n### Step 1: Find the Resource Class\n- Jarvis codesearch: `c:ResourceName` or `code:resourceName filetype:java`\n- Look for `@RestLiCollection(name = \"resourceName\")` annotation \u2014 this gives the resource path\n- Check the class extends: `ComplexKeyResourceTemplate<K, EmptyRecord, V>` = ComplexKey, `CollectionResourceTemplate<K, V>` = simple key\n\n### Step 2: Find the D2 Service Name (NOT in Java code)\n- The D2 service name lives in **LPS config**, NOT in Java source\n- Search: `f:lps-d2-* reponame:<mp-name>` in Jarvis\n- The LPS file maps: cluster name \u2192 services \u2192 paths\n- Each `<entry key=\"serviceName\">` with `<entry key=\"path\" value=\"/resourcePath\"/>` is a D2 service\n- The curli URL is `d2://serviceName/...` (the path is already baked into the service definition)\n\n### Step 3: Determine Key Format\n- **Simple key** (`CollectionResourceTemplate<Long, V>`): `d2://service/123`\n- **ComplexKey** (`ComplexKeyResourceTemplate<K, EmptyRecord, V>`): needs Rest.li v2 protocol\n  - Add header: `-H 'X-RestLi-Protocol-Version: 2.0.0'`\n  - URL format: `d2://service/(field1:value1,field2:value2)`\n- **Compound key**: `d2://service/key1=val1&key2=val2`\n\n### Step 4: Find Enum/Model Values\n- Read the key/model PDL or Java class for enum values\n- Jarvis: `c:EntityRouteContext` or `f:EntityRouteContext.pdl`\n- Also check `RouteTable` or similar mapping classes for context \u2192 internal mapping\n\n### Step 5: URL Encoding\n- URN colons: `urn:li:contract:123` \u2192 `urn%3Ali%3Acontract%3A123`\n- ComplexKey parentheses: literal `(` and `)` in the URL\n- Ampersands in ComplexKeys: use `,` no...", "learnings/staging/eureka-003.md": "## Breakthrough\n\nChain `/wait-for` steps into a **fully automated PR \u2192 prod pipeline** \u2014 submit code, walk away, come back to \"deployed and verified\" or \"failed at step X with reason Y.\"\n\n## The Old Way\n\nThe PR \u2192 prod loop is a series of manual waits:\n1. Push code, wait for CI (tab-switch, check back in 10min)\n2. CI passes, wait for review (check Slack, ping reviewer)\n3. Review approved, merge, wait for deploy (check go-status every few minutes)\n4. Deployed, watch PEM/metrics for 30min (forget, come back tomorrow hoping nothing broke)\n\nEach wait is a context switch. Each context switch is lost momentum. The whole cycle takes hours of wall-clock time but only minutes of actual work \u2014 the rest is waiting and remembering to check.\n\n## The New Way\n\n```\n/ship PR #123\n  \u2192 /wait-for \"PR #123 CI passes\" --every 5m\n    \u2192 on success: notify \"CI passed, waiting for review\"\n    \u2192 /wait-for \"PR #123 approved\" --every 15m\n      \u2192 on success: merge, then\n      \u2192 /wait-for \"go-status shows new version on prod-ltx1\" --every 10m\n        \u2192 on success: \n        \u2192 /wait-for \"PEM availability >99% for 30min\" --every 5m\n          \u2192 on success: \"Ship complete. PR #123 live on prod. PEM stable.\"\n          \u2192 on failure: \"PEM dip after deploy \u2014 investigate?\"\n```\n\nEach step is a durable cron. Each self-cancels on success and kicks off the next. The whole chain persists across sessions. You submit the PR and the system does the rest.\n\n## Impact\n\n- **Eliminates the #1 developer time sink** \u2014 waiting for CI/CD with manual polling\n- **Zero context switches** \u2014 the chain handles all the waiting\n- **Catches regressions immediately** \u2014 PEM check is built into the pipeline, not an afterthought\n- **Full audit trail** \u2014 each step logs its result, creating a deployment worklog automatically\n- **Scope: every engineer on the team** \u2014 anyone who ships code benefits\n\n### The eureka chain that led here:\n```\neureka-001: durable crons enable cross-session async workflows\neureka-002: skills emerge from real work...", "learnings/staging/know-059.md": "## Context\n\nIn distributed systems where each participant maintains its own auth/identity registry, unit tests that pre-register all identities in a shared mock registry will always pass \u2014 but production fails because each process has its own view of who's trusted. The gap is **cross-process state divergence**: what one process knows that another doesn't.\n\nThis pattern appeared twice in agentbus v0.3.0:\n- A2A gateway created dynamic identity `a2a-gw-bizhou-vm` \u2192 registered in laptop registry \u2192 VM's Guardian rejected it (know-056)\n- All unit tests passed because mock registries contained both parties \u2192 E2E failed (know-058)\n\n## Guidance\n\nWhen testing distributed identity/auth:\n1. **Unit tests with shared mocks are necessary but insufficient** \u2014 they verify logic, not trust propagation\n2. **E2E tests must verify the registration/trust flow itself** \u2014 dynamic identities need explicit registration on all participants\n3. **The diagnostic question is always:** \"Does process B know about entity X that process A created?\" If the answer depends on shared state that only exists in-memory during tests, you have this bug.\n4. **Fix pattern:** Either pre-register identities on disk (agent cards, config files) or implement a trust-on-first-use protocol with an explicit approval step.\n\n## When to Apply\n\nWhen adding dynamic participants to any system with per-process auth (agent buses, microservice meshes, API gateways). When unit tests pass but E2E fails for auth/identity reasons. When reviewing test coverage for any feature that creates new identities at runtime.", "learnings/staging/bug-009.md": "# SSH Config Lockout: Adding Hostname Before Key Is Deployed\n\n## Symptoms\n`Permission denied (publickey,password,keyboard-interactive)` \u2014 can't SSH at all, not even with password.\n\n## Root Cause\nAdded `bizhou-ld2.linkedin.biz` to `~/.ssh/config.custom` Host line which had `PreferredAuthentications publickey` and `NumberOfPasswordPrompts 0`. The LinkedIn public key wasn't yet in the VM's `authorized_keys`, so publickey auth failed and password fallback was disabled.\n\n## Fix\n1. Revert config.custom to remove the full hostname\n2. SSH with password using the full hostname (falls back to managed config which allows password)\n3. Copy the public key to VM's authorized_keys\n4. Re-add hostname to config.custom\n\n## Prevention\nWhen setting up SSH key auth for a new host: always copy the key FIRST (via password auth), THEN add the host to publickey-only config.", "learnings/staging/eureka-007.md": "## Breakthrough\n\nA **context repo** (git repo with `.claude/CLAUDE.md` + skills + docs + test data + runbooks) turns one person's deep investigation into the entire team's starting point. Anyone who `git clone`s and opens with Claude Code instantly inherits weeks of accumulated knowledge \u2014 architecture mental models, debugging skills, verified commands, design doc references \u2014 without reading a single doc.\n\n## The Old Way\n\nKnowledge sharing was lossy and slow:\n- **Confluence pages**: Written once, stale in weeks, nobody reads the 30-page design doc\n- **Slack threads**: Context buried in scrollback, unsearchable after 90 days\n- **Onboarding docs**: \"Read these 15 pages\" \u2192 new engineer is productive in 2-3 weeks\n- **Tribal knowledge**: \"Ask Sarah, she knows how the writeback works\"\n- **Personal notes**: Each engineer accumulates their own debugging recipes, never shared\n\nWhen someone leaves or switches projects, their knowledge evaporates.\n\n## The New Way\n\nPackage everything i
