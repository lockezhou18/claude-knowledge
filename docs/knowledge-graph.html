rget": "learnings/staging/know-048-2.md", "strength": 5, "shared": ["architecture", "compound", "eval", "learning"]}, {"source": "memory/eval/eval-system-architecture.md", "target": "guides/compound-learning.md", "strength": 5, "shared": ["compound", "dream", "format", "knowledge"]}, {"source": "memory/global/agentbus-architecture.md", "target": "learnings/staging/know-064.md", "strength": 5, "shared": ["agentbus", "architecture", "listener", "messaging"]}, {"source": "memory/global/robustness-rules.md", "target": "rules/proactive-suggestions.md", "strength": 5, "shared": ["during", "every", "found", "pattern"]}, {"source": "memory/reference/espresso-metrics.md", "target": "learnings/staging/knowledge-004.md", "strength": 5, "shared": ["cluster", "database", "espresso", "hireaccesscontroldb"]}, {"source": "learnings/staging/know-020.md", "target": "learnings/staging/know-011-2.md", "strength": 5, "shared": ["because", "mapping", "mappings", "phase"]}, {"source": "learnings/staging/eureka-005-2.md", "target": "learnings/staging/eureka-007.md", "strength": 5, "shared": ["breakthrough", "eureka", "knowledge", "repo"]}, {"source": "learnings/staging/know-014-2.md", "target": "learnings/staging/know-012-2.md", "strength": 5, "shared": ["because", "connected-projects", "context", "follow"]}, {"source": "learnings/staging/know-014-2.md", "target": "learnings/staging/know-013-2.md", "strength": 5, "shared": ["because", "connected-projects", "context", "phase2"]}, {"source": "learnings/staging/know-014-2.md", "target": "learnings/staging/know-010-2.md", "strength": 5, "shared": ["because", "connected", "connected-projects", "context"]}, {"source": "learnings/staging/know-014-2.md", "target": "learnings/staging/know-011-2.md", "strength": 5, "shared": ["because", "connected", "connected-projects", "context"]}, {"source": "learnings/staging/know-030.md", "target": "learnings/staging/aha-003.md", "strength": 5, "shared": ["architecture", "meta", "skill", "skills"]}, {"source": "learnings/staging/know-030.md", "target": "learnings/staging/eureka-002-2.md", "strength": 5, "shared": ["agent", "compound-learning", "meta", "skill"]}, {"source": "learnings/staging/know-030.md", "target": "learnings/staging/eureka-009.md", "strength": 5, "shared": ["across", "compound", "compound-learning", "knowledge"]}], "contents": {"memory/insights/bug-002-application-race.md": "**When** new ATS applicants are stuck in HP sourcing stage (\"potential candidate\") instead of ATS stage, **check** if the HPC\u2192ApplicationStage mapping exists **because** the IntegrationApplication CREATE event can be processed before the IntegrationApplicationStage exists in IP.\n\n## Symptoms\n- Candidates show \"Save to pipeline\" instead of \"Change stage\" in Recruiter UI\n- ApplicationStageResolutionService logs \"No resolved stage for HPC, skipping sync\"\n- HPC\u2192ApplicationStage entity mapping is empty for the candidate\n\n## Root Cause\nApplicationProcessor.getAllStages() returns empty when the stage hasn't been synced to IP yet (race condition, ~4 seconds). connect(null) short-circuits \u2192 no mapping. When the stage event arrives later, processPhase2() can't find the mapping \u2192 skips sync.\n\n## Fix\nPR #526: ensureApplicationStageMappingExists() before resolveAndSyncCurrentState() in processPhase2(). Zero overhead when mapping exists, creates it on the recovery path.\n\n## Prevention\nWhen processing Kafka events that depend on other entities, always verify the dependency exists before proceeding. Don't assume event ordering guarantees entity availability.\n\n**Graduated from:** `~/.claude/learnings/staging/bug-002.md` (use_count=3, score=3)", "memory/insights/v2-identity-findFirst.md": "## When [situation]\nWorking with HireIdentity V2 lookups in hp-ats-integration-mt where a candidate has multiple V2 identities in the same identity group.\n\n## Do [action]\nNever use `findFirst()` on V2 identity streams. Instead, try ALL V2 identities with fallback \u2014 iterate through the group and attempt each one until one succeeds.\n\n## Because [reason]\n`findFirst()` is non-deterministic when multiple V2s exist in a group. It can pick a V2 that doesn't have the expected mapping, while another V2 in the same group does. This caused silent failures in stage sync and writeback flows (PR #524).\n\n**Graduated from:** insights/bug-track (bug-001), use_count=3, outcome_score=3", "memory/insights/engineering-principles.md": "## Principle 0: Faith of God \u2014 The Foundation\n\nEverything else is built on this. Before engineering principles, before tools, before process \u2014 faith.\n\n- **Humility**: \"I don't have all the answers.\" Don't pretend to know what you don't. Ask, investigate, admit uncertainty. The best engineers are the ones who know what they don't know.\n- **Integrity**: Do the right thing even when no one's watching. Write clean code when you could cut corners. Fix the root cause when you could ship a patch. Quality is a reflection of character.\n- **Stewardship**: These systems are entrusted to you. Leave them better than you found them. The next engineer inherits your decisions \u2014 make them a gift, not a burden.\n- **Purpose**: The work serves something larger than the code itself. Every system you build affects real people \u2014 customers, teammates, the company. Build with that weight in mind.\n- **Patience & Persistence**: Not every problem is solved in one sprint. The hard problems \u2014 the ones worth solving \u2014 take time, iteration, and faith that the answer will come if you keep looking.\n- **Gratitude**: Respect what came before. Appreciate the value of working systems and the lessons they embody. Many problems are not essentially new.\n\n**How to apply:** This isn't a rule to follow \u2014 it's a lens through which all other rules are interpreted. When in doubt about a shortcut, an estimate, a design decision \u2014 ask: \"Am I being humble, honest, and purposeful?\"\n\n## \"Nothing is ever trivial\" \u2014 Investigate before estimating effort\nYou can only estimate tasks when you know what the task is and how you're going to do it. If you don't have a solid handle on the code, business logic, or dependencies, your estimate will be off. When in doubt, look to the code.\n\n**Why:** Inaccurate \"shoot from the hip\" estimates cost everyone more time than well-considered ones. The connection between business logic and code is very tight \u2014 many systems have business logic hard-coded right in.\n**How to apply:** Before g...", "memory/insights/research-pipeline-pattern.md": "When exploring an unfamiliar domain with scattered data, follow this 5-step pipeline:\n\n1. **Start with a simple question** \u2014 don't over-scope. \"Where can we see AI usage?\" is better than \"give me everything about AI metrics.\"\n2. **Don't stop at the first answer** \u2014 the first result (a dashboard, a doc) is the entry point, not the answer. Keep pulling threads to discover what's behind it.\n3. **Map the full ecosystem** \u2014 identify ALL data sources, owners, and relationships. The value is in the connections between systems, not any single system.\n4. **Cross-validate against SoT** \u2014 before presenting data, verify units, accuracy, and freshness against the source of truth. This caught a cents-vs-dollars error that would have produced a 100x wrong report.\n5. **Combine dimensions no single dashboard combines** \u2014 the breakthrough insight comes from joining data across systems that weren't designed to talk to each other (adoption + cost + org structure + model breakdown + pricing tiers).\n\n**Why:** This pattern was validated with the strongest feedback signal (+2.0 x3) across 24 research_depth signals. User said \"even my director doesn't have such full picture.\" The data was always there \u2014 nobody had assembled it.\n\n**How to apply:** Any time the user asks an open-ended \"where/how/what\" question about a domain. Don't answer with the first link found \u2014 run the full pipeline. The recipe `/recipe ai-usage-report` is a concrete example of the output this pattern produces.", "memory/insights/bug-002.md": "**When** new ATS applicants are stuck in HP sourcing stage (\"potential candidate\") instead of ATS stage, **check** if the HPC\u2192ApplicationStage mapping exists **because** the IntegrationApplication CREATE event can be processed before the IntegrationApplicationStage exists in IP.\n\n## Symptoms\n- Candidates show \"Save to pipeline\" instead of \"Change stage\" in Recruiter UI\n- ApplicationStageResolutionService logs \"No resolved stage for HPC, skipping sync\"\n- HPC\u2192ApplicationStage entity mapping is empty for the candidate\n\n## Root Cause\nApplicationProcessor.getAllStages() returns empty when the stage hasn't been synced to IP yet (race condition, ~4 seconds). connect(null) short-circuits \u2192 no mapping. When the stage event arrives later, processPhase2() can't find the mapping \u2192 skips sync.\n\n## Fix\nPR #526: ensureApplicationStageMappingExists() before resolveAndSyncCurrentState() in processPhase2(). Zero overhead when mapping exists, creates it on the recovery path.", "memory/projects/general/feedback_iterm2_requirement.md": "Use iTerm2 as the terminal, not Apple Terminal.app. Terminal.app does not support OSC 52, which is required for clipboard copy/paste to work over SSH to the VM tmux sessions.\n\n**Why:** OSC 52 escape sequences are the mechanism that sends clipboard data from VM tmux back to the local machine. Terminal.app silently drops them.\n\n**How to apply:** When troubleshooting clipboard issues with the VM, first check the terminal emulator. If the user is in Terminal.app, suggest switching to iTerm2.", "memory/projects/general/feedback_auth_interaction.md": "Prefer `!` prefix for auth commands over launching interactive tmux sessions.\n\n**Why:** When tmux is launched for auth, the user loses the ability to interact with Claude \u2014 they're in a separate terminal context with no visibility or help. The handoff between \"Claude helping\" \u2192 \"user alone in tmux\" \u2192 \"back to Claude\" is clunky and breaks flow.\n\n**How to apply:**\n- For simple auth commands (kinit, token refresh, single-command logins): suggest `! <command>` so output stays in the conversation\n- Only fall back to tmux for truly interactive multi-step flows (e.g., 2FA prompts that need repeated input)\n- Always run auth pre-flight checks before workflows that need auth, rather than launching tmux preemptively\n- When tmux is unavoidable: give exact instructions, set checkpoints, and verify auth worked after user returns", "memory/projects/connected-projects/feedback_parallel_debugging.md": "When debugging issues that span multiple services (hp-ats-integration-mt, talent-partner-integrations-mt, mcm-mt), spawn parallel agents to search logs in each service simultaneously rather than investigating one at a time.\n\n**Why:** Sequential investigation wastes time \u2014 while waiting for one log search, the other services' logs could already be fetched. Wrong-theory debugging is amplified when you commit to one service's logs before seeing the full picture across services.\n\n**How to apply:** Use the Agent tool with multiple parallel invocations:\n```\nAgent 1: \"Search hp_ats_integration_mt_logs for ...\"\nAgent 2: \"Search mcm_mt_logs for ...\"\nAgent 3: \"Search talent_partner_integrations_mt_logs for ...\"\n```\nCombine findings before forming a hypothesis. This is especially valuable for treeId-based tracing where the same request flows through multiple services.", "memory/projects/connected-projects/pr584_e2e_testing.md": "# PR #584 E2E Testing Progress\n\n## PR Info\n- **PR**: https://github.com/linkedin-multiproduct/talent-partner-integrations-mt/pull/584\n- **Branch**: `bizhou/add-hiring-project-candidate-history-urn-support`\n- **Repo**: `/Users/bizhou/workspace/talent-partner-integrations-mt`\n- **Reviewer request**: `svohra_LinkedIn` asked for curli testing details\n\n## What the PR Does\nAdds `HiringProjectCandidateHistoryUrn` support to `ClientEntityUrn` in talent-partner-integrations-mt. New enum `INTEGRATION_APPLICATION_STAGE_HISTORY = 9` in `IntegrationEntityType.proto`. Key maxsize bumped 150\u2192300.\n\n## What's Already Done\n\n### Unit Tests: PASSING (100% coverage on changed lines)\n\n### Read-path E2E (on old rdev rustic-mars): DONE\n- Proto reflection: `hiringProjectCandidateHistoryUrn` field confirmed\n- `FindUrnMappingByClientEntityUrn`: returned `{}` \u2014 full E2E success\n- Production-sized URN finder: confirmed KEY_TOO_LONG at old maxsize, works at 300\n\n### Write-path E2E: NOT YET COMPLETED\n- Blocked by Espresso standalone schema issues (see below)\n\n### Local avsc file patches: DONE\n- v1-v5 avsc files patched with all 10 enum symbols for forward-compatibility\n- Verified: all 6 versions have identical enum symbol sets\n- **These patches are NOT committed** \u2014 they're local-only for Espresso standalone registration\n- Files at: `grpc-database/database/UnifiedIntegrationsDB/schemata/document/UnifiedIntegrationsDB/IntegrationEntityToClientEntityMap/{1-6}.avsc`\n\n## Key Technical Discoveries\n\n### Espresso Standalone Ports (rdev)\n- **11936** = Correct REST API port for schema registration (`curl -X PUT`)\n- **11965** = D2/Jetty port (returns 404 for schema ops \u2014 WRONG for registration)\n- **12924** = Router port\n- **12930** = MySQL port\n\n### Schema Registration via curl\nSchemas must be registered in order: DB \u2192 Document (all versions) \u2192 Table\n```bash\n# DB schema\ncurl -s -X PUT http://localhost:11936/schemata/db/UnifiedIntegrationsDB/1 --data-binary @schemata/db/UnifiedIntegrationsDB/1.json\n\n# Docum...", "memory/projects/connected-projects/ip_sync_cadence_throttle.md": "IP team (EDS) has throttled Greenhouse sync cadence due to QPS rate limit issues with Greenhouse:\n\n- **Job requisition stages**: pulled every **1 hour** (was 15 min)\n- **Application stages**: refreshed every **15 min** (webhooks disabled)\n- **Webhooks**: disabled temporarily to clear Kafka lag\n\n**Why:** Greenhouse rate limits being hit as more customers activate. IP negotiating higher limits with Greenhouse.\n\n**How to apply:**\n- During E2E testing, expect **up to 1 hour delay** for new Greenhouse jobs/stages to appear in IP\n- App stage changes take **~15 min** instead of instant (webhook disabled)\n- Testing may need to pause or use pre-existing synced data\n- Tracking ticket: HPLT-115585\n- **Target resolution: April 15, 2026** \u2014 cadence will be restored before bi-di sync charter ramp\n- Team asked for test account exception but not currently possible\n\n**Contacts:** svohra (IP), gchandak (IP config), rikar (Greenhouse rate limits)", "memory/projects/connected-projects/dev_process.md": "# Development Process Notes\n\n## PR Descriptions\n- Always include full grpcurli commands and raw output in E2E testing sections\n- Use `# Problem & Solution Overview` / `# Testing Done` (h1 headers) for talent-partner-integrations-mt PRs\n\n## Rdev Deployment\n- Run `mint undeploy` before `mint deploy` to avoid `boot-listeners.txt` classpath issues\n- Deploy Espresso standalone **before** the app when using local Espresso config\n- Use `rexec --assign-rdev <mp>/<rdev-name>` to point rexec at a specific rdev\n\n## Local Espresso Testing on Rdev\n- Point app at storage node directly: `espressoProtoClient.espressoClient.uriPrefix` \u2192 `http://localhost:11936` in `qei.src` (don't commit)\n- Register schemas via curl: DB \u2192 Document versions \u2192 Table, in order\n- Reference: [hp-collaboration-mt README](https://github.com/linkedin-multiproduct/hp-collaboration-mt/blob/master/README.md#how-to-deploy-against-the-local-espresso)\n\n## Avro Schema Forward-Compatibility\n- When adding new enum symbols, backfill ALL older avsc versions with the full symbol set before registering\n- `./gradlew build` regenerates avsc from proto, overwriting patches \u2014 re-patch after build, before sync\n", "memory/projects/connected-projects/insights_april_2026.md": "## Top Friction: Wrong Investigation Paths (28 instances)\n\nClaude frequently starts down the wrong technical approach. **Mitigation applied:**\n- CLAUDE.md now has \"Trust user domain knowledge\" rule\n- Service Routing Table + \"Use curli not Trino\" + \"Use observe-agent for logs\" already existed\n- **How to apply:** When user names a specific class/processor/ticket, start there. Don't second-guess.\n\n## What Works Best\n\nUser satisfaction highest when Claude:\n1. **Traces bugs end-to-end** across multi-service pipelines (13 debugging successes)\n2. **Makes multi-file changes** that compile and pass tests first try (8 successes)\n3. **Delivers fast accurate search** across codebases (5 successes)\n\n**Why:** User is an active supervisor with tight feedback loop \u2014 delegates broad goals, watches approach, corrects early. High tolerance for iteration, low tolerance for wrong direction.\n\n## Applied Improvements (2026-04-07)\n\n1. **CLAUDE.md additions:** Java compatibility (no Set.of), bias toward action, trust user domain knowledge, project-level saves\n2. **Headless scripts:** `~/.claude/scripts/daily-standup.sh`, `~/.claude/scripts/weekly-ai-report.sh`\n3. **Already existed:** investigate skill, pre-commit hooks, REST/observe-agent rules\n\n## Session Stats (2 weeks)\n- 32 sessions, 134h total, 373 messages, 6 commits\n- Tool usage: Bash(449) > Read(140) > Grep(66) > Edit(65) \u2014 investigation-heavy\n- 84% positive satisfaction signals", "memory/projects/connected-projects/espresso_schema_workflow.md": "# Espresso Schema Change Workflow for talent-partner-integrations-mt\n\n## The Key Pattern: Local Espresso Config Override\n\nFor E2E testing schema changes on rdev **before** they're in nuage, temporarily point the app at the local Espresso storage node:\n\nEdit `config/app/talent-partner-integrations-mt/groups/qei.src` (**don't commit**):\n```xml\n<property name=\"espressoProtoClient.espressoClient.uriPrefix\" value=\"http://localhost:11936\"/>\n```\n\nThis bypasses the D2/router path and connects directly to the storage node where manually registered schemas are available. Reference: [hp-collaboration-mt README](https://github.com/linkedin-multiproduct/hp-collaboration-mt/blob/master/README.md#how-to-deploy-against-the-local-espresso).\n\n## Deploy Order (Critical)\n1. Deploy Espresso standalone **first** (`mint deploy --product espresso-stand-alone`)\n2. Register schemas via curl to port 11936\n3. Deploy app **after** (`mint undeploy` then `mint deploy`) \u2014 app crashes if Espresso isn't running\n\n## Schema Notes\n- Forward-compatibility requires ALL older avsc versions to have the same enum symbols as the latest\n- The `reinit` Gradle task is blocked by `IntegrationEvaluation` view type mismatch \u2014 use manual curl\n- PR description format: use `# Problem & Solution Overview` / `# Testing Done` (h1, not h2)\n\n### PR Pattern (following PR #129)\n1. **PR 1 (Schema-only)**: Proto changes only (`IntegrationEntityType.proto`, key proto files)\n   - Gets merged first, triggers nuage schema registration\n   - Example: PR #586\n2. **PR 2 (API changes)**: Java code + tests, based on PR 1 branch\n   - Merged after schema is deployed to nuage\n   - E2E write-path testing can happen after PR 1 is in nuage\n   - Example: PR #587\n\n## Rdev Deployment Steps\n\n### 1. Set up rexec\n```bash\nrexec --assign-rdev talent-partner-integrations-mt/<rdev-name> echo \"hello\"\n```\n\n### 2. Build and deploy app\n```bash\nrexec 'cd ~/talent-partner-integrations-mt && ./gradlew build -x check'\nrexec 'cd ~/talent-partner-integrations-m...", "memory/projects/connected-projects/sandbox2_lix_config.md": "## Sandbox 2 LiX Experiments (created 2026-04-06)\n\nContract: `urn:li:contract:2043270072`\nData Provider: `urn:li:developerApplication:225950754`\n\n| TReX Test ID | TReX URL | Lix Key (likely) |\n|---|---|---|\n| `2081633890` | https://trex.corp.linkedin.com/trex/test/2081633890/iteration/5223932 | `talent.connected.project.enabled` |\n| `2081600942` | https://trex.corp.linkedin.com/trex/test/2081600942/iteration/5223896 | `talent.connected.project.phase2.enabled` |\n| `2081638821` | https://trex.corp.linkedin.com/trex/test/2081638821/iteration/5223872 | `talent-solutions-api.hire.entity.request.real.data.enabled` |", "memory/projects/connected-projects/inlogs.md": "# InLogs / Kusto Query Reference\n\n## hp-ats-integration-mt\n- **Cluster**: `lilogsusprod05`\n- **Database**: `hp-ats-integration-mt`\n- **Table**: `hp_ats_integration_mt_logs`\n\n### Common Query Patterns\n\n**Search by treeId:**\n```kql\nhp_ats_integration_mt_logs\n| where treeId has \"YOUR_TREE_ID\"\n```\n\n**Search by time range (last 1 hour):**\n```kql\nhp_ats_integration_mt_logs\n| where timestamp > ago(1h)\n| order by timestamp desc\n| take 100\n```\n\n**Search by error level:**\n```kql\nhp_ats_integration_mt_logs\n| where level == \"ERROR\"\n| where timestamp > ago(1h)\n| order by timestamp desc\n| take 50\n```\n\n**Search by message content:**\n```kql\nhp_ats_integration_mt_logs\n| where message has \"keyword\"\n| where timestamp > ago(1h)\n| order by timestamp desc\n| take 50\n```\n\n### Timestamp Conversion (Unix ms to PST)\n```bash\nTZ=\"America/Los_Angeles\" date -r $((TIMESTAMP_MS/1000)) \"+%Y-%m-%d %H:%M:%S %Z\"\n```\n\n### How to Execute\nUse the `execute_kusto_query` MCP tool:\n- `cluster_name`: \"lilogsusprod05\"\n- `database`: \"hp-ats-integration-mt\"\n- `query`: your KQL query\n\nOr use `target` parameter for auto-discovery:\n- `target`: \"hp-ats-integration-mt\"\n", "memory/projects/connected-projects/greenhouse_api.md": "# Greenhouse API Reference\n\n## Overview\nGreenhouse provides 3 APIs: **Harvest API** (admin), **Job Board API** (public), and **Webhooks** (events).\n\n## Credentials\nSee `greenhouse-api` skill (`SKILL.md`) for sandbox tokens and login credentials \u2014 single source of truth.\n\n## Harvest API (Main API)\n- **Base URL**: `https://harvest.greenhouse.io/v1/`\n- **Auth**: Basic Auth over HTTPS (API token as username, blank password)\n- **Rate Limits**: Per 10-second windows, `X-RateLimit-Limit` / `X-RateLimit-Remaining` headers\n- **Pagination**: `Link` header (RFC-5988), default 100/page, max 500. Params: `page`, `per_page`, `skip_count`\n\n### Endpoints by Category\n\n#### Applications (KEY for Connected Projects)\n- `GET /applications` \u2014 List all applications\n- `GET /applications/{id}` \u2014 Get application\n- `DELETE /applications/{id}` \u2014 Delete application\n- `POST /candidates/{id}/applications` \u2014 Add application\n- `PATCH /applications/{id}` \u2014 Update application\n- `POST /applications/{id}/advance` \u2014 Move to NEXT stage\n- `POST /applications/{id}/move` \u2014 Move to SPECIFIC stage (same job)\n- `POST /applications/{id}/transfer_to_job` \u2014 Move to different job\n- `PATCH /applications/{id}/convert_prospect` \u2014 Convert prospect to candidate\n- `POST /applications/{id}/hire` \u2014 Hire\n- `POST /applications/{id}/reject` \u2014 Reject\n- `PATCH /applications/{id}/reject` \u2014 Update rejection reason\n- `POST /applications/{id}/unreject` \u2014 Unreject\n- `POST /applications/{id}/attachments` \u2014 Add attachment\n\n#### Job Stages (KEY for Connected Projects)\n- `GET /job_stages` \u2014 List ALL job stages\n- `GET /jobs/{id}/stages` \u2014 Stages for specific job\n- `GET /job_stages/{id}` \u2014 Get single stage\n- **NOTE**: Greenhouse does NOT support creating new stages via API\n\n#### Candidates\n- `GET /candidates` \u2014 List candidates\n- `GET /candidates/{id}` \u2014 Get candidate\n- `POST /candidates` \u2014 Create candidate\n- `PATCH /candidates/{id}` \u2014 Edit candidate\n- `DELETE /candidates/{id}` \u2014 Delete candidate\n- `POST /candidates/{id}/notes` \u2014 Add note...", "memory/projects/connected-projects/feedback_check_knowledge_first.md": "When facing an unfamiliar operation (Kafka event production, Avro schema, infrastructure config), **search the knowledge files FIRST** before attempting trial-and-error.\n\n**Why:** On 2026-04-07, we spent ~1hr fighting Avro schema issues for IntegrationEntityReadyEvent. The user said \"check repo knowledge/memory\" and we immediately found `memberIdV2` (the missing field) and the correct cluster (`queuing` not `tracking`). The answer was in `kafka-event-formats.md` and `ei-testing-patterns.md` the entire time.\n\n**How to apply:**\n- Before ANY Kafka produce/consume: search learnings for the topic name\n- Before ANY Avro event construction: search for existing templates\n- Before ANY infrastructure operation: check if there's a knowledge file about it\n- When multiple knowledge files conflict: cross-validate against the code (e.g., check which cluster the consumer config actually uses)\n- This is Phase 1 Research Layer 1 in the engineering pipeline \u2014 \"Search past learnings FIRST\"", "memory/projects/connected-projects/oncall_knowledge.md": "# Oncall Knowledge\n\n## Deployment Commands\n\n### talent-agent-nearline\nDeploy from a prod shell host first:\n```bash\nssh ltx1-shell07.prod.linkedin.com\n```\n\nThen deploy:\n```bash\nsp job deploy -p talent-agent-nearline -a <app-name> --nomination-check-skipped -f <fabric> -i i001 -v <version> --skip-cross-fabric-deploy-check\n```\n\nExample:\n```bash\nsp job deploy -p talent-agent-nearline -a hiring-intent-screening-project-question-processor --nomination-check-skipped -f prod-ltx1 -i i001 -v 0.0.1013 --skip-cross-fabric-deploy-check\n```\n\nFabrics: `prod-lor1`, `prod-ltx1`, `prod-lva1`\n\n### mcm-samza (Samza/Flink jobs)\nCheck version:\n```bash\nsp job status deploy -p mcm-samza -a <app-name> -f <fabric> -i i001\n```\n\nRestart:\n```bash\nsp job restart -p mcm-samza -a <app-name> -f <fabric> -i i001\n```\n\nRedeploy (if restart not available):\n```bash\nsp job deploy -p mcm-samza -a <app-name> -f <fabric> -i i001 -v <version> --nomination-check-skipped --skip-cross-fabric-deploy-check\n```\n\nCommon app names:\n- `hiring-activity-ingestion-approval-approver-response`\n- `hiring-activity-hiringprojectcandidate`\n\n### D2 Update Commands\n\n#### hp-ats-integration-mt\n```bash\nlps d2 update -c HpAtsIntegrationMt -p hp-ats-integration-mt -f <fabric> --bypass-canary\n```\n\n#### mcm-mt\n```bash\n# REST\nlps d2 update -f <fabric> -c McmServices -p mcm-mt --bypass-canary\n\n# gRPC\nlps d2 update -f <fabric> -c McmServicesGrpc -p mcm-mt --bypass-canary\n```\n\n#### hp-mt\n```bash\n# REST\nlps d2 update -c HiringPlatformServices -p hp-mt -f <fabric> --bypass-canary --no_jetty_http2_check\n\n# gRPC\nlps d2 update -c HiringPlatformServicesGrpc -p hp-mt -f <fabric> --bypass-canary --no_jetty_http2_check\n```\n\n## EKG Override / Bypass\n\n### Override EKG per deployment (recommended)\n```bash\ncrt nominate -p <product> -v <version> -f <fabric> --promote-canary --policy-override-reason EKG_NON_BLOCKING_FAILURE\n```\n\n### Temporarily disable EKG rollback\n```bash\ncrt preferences set -p <product> --ekg-rollback-enabled false\n# Re-enable after...", "memory/projects/connected-projects/feedback_plugin_triggers.md": "Proactively invoke these plugin skills in the right context \u2014 don't wait for the user to ask.\n\n## Trigger Rules\n\n### kafka-flink (linkedin-framework)\n- **When**: Touching Kafka consumers, TrackerProcessor, topic configs, Samza/nearline processors in hp-ats-integration-mt\n- **How**: Invoke `kafka-flink` skill before implementing to check patterns\n- **Why**: hp-ats-integration-mt is heavily Kafka-based; framework guidance prevents infra mistakes\n\n### linkedin-frameworks (linkedin-framework)\n- **When**: Adding new Offspring factories, boot listeners, D2 client wiring, Rest.li resources, or DI patterns\n- **How**: Invoke `linkedin-frameworks` skill to check correct patterns\n- **Why**: Offspring/D2/Rest.li have LinkedIn-specific conventions that differ from standard Spring/gRPC patterns\n\n### library-specs (spec-generation / fix)\n- **When**: Adding or bumping dependencies in `product-spec.json`, or hitting version set conflicts during `mint build`\n- **How**: Invoke `library-specs:spec-generation` for new deps, `library-specs:fix` for version conflicts\n- **Why**: Specs document correct usage; version conflicts are common and have known resolution patterns\n\n### copy-rule-file / unignore-file (mp-rules)\n- **When**: Creating new MP modules, modifying `.gitignore`, or needing build rule customization\n- **How**: Invoke the relevant mp-rules skill\n- **Why**: MP rules have specific conventions; wrong rules cause hard-to-debug build failures\n\n### linkedin-plugin-creator:plugin-creation\n- **When**: User asks to create a new skill or plugin, or after `/integrate` identifies a gap worth filling\n- **How**: Invoke `linkedin-plugin-creator:plugin-creation` for full scaffold with ACL, crew ownership, taxonomy\n- **Why**: Ensures new plugins follow LinkedIn's plugin ecosystem conventions\n\n## How to Apply\n- Check these triggers during Phase 1 (Research) and Phase 4 (Execute) of the engineering pipeline\n- Invoke the skill BEFORE writing code, not after\n- Mention to the user: \"Checking [skill]...", "memory/projects/connected-projects/docs/connected-projects-phase-2-job-requisition-stage-sync-eng-design.md": "Connected Projects Phase 2\n\n- Job Requisition Stage Sync\n\n## Authors\n\n* Yufei Wang (yfwang@linkedin.com)\n\n# Reviewer\n\n| **Approval Role** | **Person (LDAP)** | **Review Status** |\n| --- | --- | --- |\n| LTS | Xiaoyang Gu | Not Started |\n| Hiring Solutions | Xie Lu | Not Started |\n| Hiring Platform | Si Chang | Not Started |\n| Hiring Platform | Xiaoguang Wang | Not Started |\n| Integration Platform | Aditya Hegde | In Progress |\n| Integration Platform | Sanjana Vohra | In Progress |\n| BuildOut Gateway | Gaurav Sisodiya | Not Started |\n\n# Problem Statement\n\nEnterprise customers increasingly seek unified Talent Acquisition (TA) platforms to streamline their hiring workflows, yet LinkedIn Recruiter risks being viewed solely as a sourcing tool. Today, over 80% of these customers rely on external Applicant Tracking Systems (ATS) as the system of record for job requisitions and applicant management. This disconnected setup creates inefficient workflows, fragmented data, and duplicate tasks between LinkedIn and ATS systems. To address these issues, [**Connected Projects**](https://docs.google.com/document/d/1vMl9WFSiUwM7Mm-8S3BqELgQXezSVR2KaD4vaFrJSMM/edit?tab=t.0) was launched as a key initiative to integrate ATS requisitions with LinkedIn Hiring Projects, enabling recruiters to manage sourcing, applicant evaluation, and pipeline stages in one platform. [**Connected Projects Phase 2: Bidirectional Sync**](https://docs.google.com/document/d/1vMl9WFSiUwM7Mm-8S3BqELgQXezSVR2KaD4vaFrJSMM/edit?tab=t.0#heading=h.vlpnn6ez9g6) of this initiative builds on top of foundational MVP and Phase 1 capabilities by focusing on real-time updates and bi-directional synchronization, ensuring ATS and LinkedIn data remain aligned with minimal manual intervention.\n\n# Product Requirements\n\n**Connected Projects Phase 2: Bidirectional Sync** delivers seamless pipeline and stage synchronization between LinkedIn Hiring Platform and ATS workflows by introducing the following capabilities:\n\n### Pipeline ...", "memory/projects/connected-projects/docs/ats-bi-directional-sync-principles.md": "ATS Bi-Directional Sync Principles\n\nAuthor : Sanjana Vohra\n\n| Reviewer | Status |\n| --- | --- |\n| Aditya Hegde | Approved  Left Comments (9/29) |\n| Yash Bhandari | ApprovedLeft some comments |\n| Gaurav Sisodiya | Not started |\n| Gaurav Chandak | Under review |\n| Ritvik Kar | Under review \u2013 aligned on principles 1,2,3. #4 feels more tablestakes vs principles but agreed. |\n| Tara Iyer | Under review  Responded to latest comments |\n| Vineet Goyal | Approved |\n| Piyush Masrani | Approved |\n| NIRAV GOHEL | Approved |\n| Yufei Wang | Approved |\n| Si Chang | In progress |\n\n## Introduction\n\nWith the Connected Projects charter moving LinkedIn Recruiter towards an all-in-one system for recruiters to manage sourcing, evaluation, & applicant management, bi-directional data syncs are at the forefront of the requirements to support seamless workflow between ATS & LinkedIn Recruiter. We should be able to provide near-realtime updates to keep the data at both ends in sync with limited manual intervention. The aspiration for realtime with <1sec for write confirmation & <10sec for read confirmation will be adjusted based on technical limitations as a best effort.\n\n### Current Status\n\nConnected Projects MVP & Fast Follow along with Enhanced Data Sync charters have been built with the following sync supports :\n\n1. Sync Data from ATS to Recruiter, allow creation of Connected Projects & show the ATS data as part of Connected Projects\n2. Build-Out Reads on data from partners, allowing merging & enhancement of ATS data from Build-In (EDS)\n3. Application Evaluation Write Back for Ats Applicants - via both web-hook & Build-Out API\n4. Existing 1-Click Export of Candidates via web-hook - no data sync-back confirmation on exported entity(s), and different partners may be handling it differently\n\nSummary : Reads are supported for ATS entities via Build-In & Build-Out. Writes are supported for one LI-owned entity (LiHA Application Evaluation) via Build-In & Build-Out. Write is supported only for 1...", "memory/projects/connected-projects/docs/ip-interface-app-stage-sync-.md": "IP Interface for Bi-Directional Sync\n\nAuthor: Sanjana Vohra\n\n| **Reviewer** | **Status** |\n| --- | --- |\n| Aditya Hegde | In progress  Left Comments (9/29) |\n| Yufei Wang | In progress |\n| Yash Bhandari | In progress |\n\n## Problem Statement\n\nIn order to support Bi-Directional Syncs of Integration Entities, Integration APIs should define a clear interface for clients (HP) to do the following :\n\n1. Online API : Request Upsert for an entity record. Partial updates, batch upserts not in scope for this phase.\n2. Online & Offline : Check the status of the upsert request\n3. Nearline : Async communication of updates in status of upsert request\n4. Online & Offline : Fetch all export requests for an entity\n\nNote : For sample APIs & request/response, we will be focusing on Application Stages for the scope of this document as part of Phase 2 requirements. The design will be extensible for other integration entities in the future.\n\nThis is a supporting document for the main design doc : [Application Stage Bi-Direction Sync](https://docs.google.com/document/d/1EX9Hg-os-nFKZCxRooqt_ear28Sf_bgpvQFRncuSZYw/edit?usp=sharing)\n\n## Design\n\n### Upsert\n\nWe have existing Integration APIs hosted for all integration entities in talent-partner-integration-mt, eg. [IntegrationApplicationStageApi](https://jarvis.corp.linkedin.com/codesearch/result/?name=IntegrationApplicationStageApi.proto&path=talent-partner-integrations-api%2Ftalent-partner-integrations-api%2Fsrc%2Fmain%2FserviceProto%2Fproto%2Fcom%2Flinkedin%2Ftalent%2Fpartner%2Fintegrations&reponame=linkedin-multiproduct%2Ftalent-partner-integrations-api). These support only getters & finders today.\n\nThe same APIs will be extended to support methods for upsert requests. The response will have a request ID for the write request which will be forwarded to the async workflow for writes. The request ID will be the unique identifier for the request throughout the pipeline from client(HP) to IP to gateway.\n\n#### Request : IntegrationApplicationSt...", "memory/projects/connected-projects-bug-bash/project_pm_alignment_states.md": "PM sync with Tara Iyer on 2026-02-18 established these Phase 2 candidate movement behaviors:\n\n1. **Inbound (ATS \u2192 LinkedIn)**: Charter release shows ONE history record if the target state is the same. Full movement records is P1, blocked on IP application stage table redesign.\n\n2. **Outbound (LinkedIn \u2192 ATS)**: If multiple requests target the same stage movement, once IP confirms success, ALL requests marked successful. Future redesign (with IP) to tie one request to one stage movement.\n\n3. **HP States**: Only 3 states \u2014 SUCCESS, TIMEOUT_FAILURE, GENERAL_FAILURE. CONFLICT state removed (intermediate, won't display in UI).\n\n**Why:** Simplifies charter scope. CONFLICT was an intermediate state that added UI complexity without user value. Deduping inbound history avoids confusing duplicate records.\n\n**How to apply:** Test cases should validate these 3 states only. Do not test for CONFLICT/MISMATCH in charter. Inbound sync tests should verify deduplication (one record per target state).", "memory/projects/agentbus/strategy-a2a-alignment.md": "## Decision (2026-04-11)\n\nAdd an A2A HTTP transport adapter. Keep NATS for internal speed, speak A2A over HTTP for external interop.\n\n**Why:** Only 3 systems do cross-machine agent-to-agent: Google A2A (v1.0, Linux Foundation), MS Agent Framework (gRPC+A2A), and AgentBus (NATS). Everything else (CrewAI, LangGraph, OpenAI SDK, Claude Teams, smolagents, Mastra) is single-machine only. A2A is becoming the standard \u2014 alignment beats competition.\n\n**How to apply:** Prioritize A2A HTTP transport adapter over Level 2 daemon or new features. Implement as a second transport in `agentbus/transports/` alongside NATS. Agents can speak both protocols \u2014 NATS internally (fast), A2A HTTP externally (standard).\n\n## AgentBus Unique Value (validated by QA testing, April 2026)\n\n- NATS real-time pub/sub (faster than HTTP polling)\n- Claude adapter with stateful session resume (nobody else has this)\n- Hook protocol \u2014 any script becomes an agent (unix pipe philosophy)\n- Guardian \u2014 message-level injection detection (no other framework does this)\n- Lightweight: pip install + NATS binary\n\n## Competitive Landscape (April 2026)\n\n| Cross-machine capable | Transport | Status |\n|-----------------------|-----------|--------|\n| Google A2A | HTTP/JSON-RPC | v1.0 (March 2026), Linux Foundation |\n| MS Agent Framework | gRPC + A2A | Production, successor to dead AutoGen |\n| AgentBus | NATS | Working, personal project |\n| BeeAI | A2A + HTTP | v0.1.79, Linux Foundation, worth watching |\n\nSingle-machine only (not competitors for distributed): CrewAI (48.6k stars), LangGraph, OpenAI Agents SDK (20.7k), smolagents (26.6k), Mastra (22.9k), Claude Agent Teams (experimental).\n\n## QA Results (April 2026)\n\n**v0.2.0 audit:** `~/workspace/qa/agentbus/findings.md` \u2014 25 findings, 11 fixed\n**v0.3.0 audit:** `~/workspace/qa/agentbus/findings-v030.md` \u2014 15 code bugs, 12 fixed, 24/24 E2E PASS\n- A2A gateway: verified end-to-end (HTTP \u2192 NATS \u2192 Claude \u2192 response with artifacts)\n- Task lifecycle: full state machine verified ...", "memory/projects/oncall/feedback_checkpoint_prompting.md": "For complex debugging/investigation tasks, operate in CHECKPOINT MODE by default:\n- After each major finding, stop and summarize what was found\n- Present 2-3 ranked hypotheses\n- Wait for user confirmation before proceeding to next step\n\n**Why:** 5 out of 8 oncall sessions had wrong-approach friction where Claude went too far down a wrong path before user could correct. Presenting hypotheses early lets the user steer the investigation.\n\n**How to apply:** Any time investigating a production issue, PEM dip, CSE ticket, or gRPC error. Especially important when root cause isn't obvious. Does NOT apply to simple data fixes or routine deployments where the action is clear.", "memory/projects/oncall/investigation_seat_typeahead_npe.md": "## CSE-22367: Unable to Add Member to Project (Typeahead NPE)\n\n**NOT the same as ENT-35609** (stale HS index). ENT-35609 was a cross-colo HS index inconsistency fixed by index rebuild on Feb 12.\n\n**Actual root cause:** NPE in `SeatsV2Client.findByAttributes()` at line 167 \u2014 a null element in the seatsV2 response causes `DirectArrayTemplate.add()` \u2192 `ArgumentUtil.notNull()` to throw.\n\n**Call chain:**\n```\nts-web GraphQL: hireGroupTypeaheadResultsByText\n  \u2192 ts-api HireGroupTypeaheadResultResource (finder: text)\n    \u2192 HireGroupTypeaheadResultServiceImpl.findByText()\n      \u2192 SeatServiceImpl.findBySearch()\n        \u2192 SeatServiceImpl.fetchSeatsFromSeatsV2TextQuery() \u2190 NEW PATH\n          \u2192 SeatsV2Client.findByAttributes() \u2190 NPE here\n```\n\n**Regression:** Error went from 0 to 7,035/day starting 2026-03-23. Caused by lix ramp of `talent-solutions-api.seat.search.direct.seatsv2.enabled` (PR #8492 by tdamera).\n\n**Lix:** `talent-solutions-api.seat.search.direct.seatsv2.enabled`\n**PR:** https://github.com/linkedin-multiproduct/talent-solutions-api/pull/8492\n**MP:** talent-solutions-api\n\n**Key learning:** Initial investigation went down wrong path (auth/contractUrn null). The actual stacktrace from observe agent with treeId was critical \u2014 it showed the NPE was in `SeatsV2Client.findByAttributes` stream processing, not in ViewerService. Always get the full stacktrace before theorizing.\n\n**Why:** Lix cleanups and migrations in ts-api are frequent. When investigating new errors, check error trends first to identify regressions vs chronic issues.\n\n**How to apply:** For typeahead-related CSEs, check if `seat.search.direct.seatsv2.enabled` lix is involved. Deramping the lix is the immediate mitigation.", "memory/projects/oncall/feedback_investigation_patterns.md": "## Always verify canary vs stable scope\nNever assume errors are canary-only without checking `go-status` to confirm which hosts have which version, then cross-referencing error log hostnames.\n**Why:** In the mcm-mt DOCUMENT_SCHEMA_MISSING investigation, initially concluded canary-only but errors were on stable pods too.\n**How to apply:** Before any scope conclusion, run `go-status -f <fabric> -a <app>` and grep error logs for hostnames.\n\n## PEM fabric attribution: check responseTraceHeaders__fabric\nPEM `DebuggableOopsPageEvent` `header__auditHeader__fabricUrn` is the client POP, NOT the serving fabric. Always check `responseTraceHeaders__fabric` for the actual backend.\n**Why:** In the Contract Chooser PEM investigation, 153 oops events attributed to prod-ltx1 were actually all served by prod-lva1.\n**How to apply:** When querying PEM Kusto, always include both fields in the summarize/project.\n\n## Simplest fix first \u2014 check master for existing patterns\nWhen proposing code fixes, always check if a similar pattern exists in master before building something new.\n**Why:** User pushed back when Claude over-engineered a pagination fix \u2014 a simpler contains-based solution was already in master.\n**How to apply:** Before implementing, search master for how similar problems are solved. Propose the simplest approach.\n\n## PEM low-traffic amplification is common\nSession count < 50 with only baseline errors (talentContractOptions 401, talentAuthentication 307/403) = low-traffic amplification. No action needed.\n**Why:** This is the most frequent Contract Chooser PEM alert pattern during off-hours. Saves investigation time.\n**How to apply:** Check session count first. If < 50 and no 500 spike, call it low-traffic amplification immediately.", "memory/projects/oncall/feedback_curli_first.md": "When investigating CSE tickets involving sourcing channels, hiring projects, or other MCM entities, go straight to curli REST API calls against mcm-mt instead of Trino queries.\n\n**Why:** Trino tables often have permission issues (e.g., sourcingchannelsv2 access denied) or stale snapshots. The REST APIs return live data and are faster to iterate on. The hiring-platform skill commands are useful references but shouldn't need explicit invocation \u2014 just use the curli patterns directly.\n\n**How to apply:**\n- For entity lookups (sourcingChannels, hiringProjects, hiringProjectCandidates), use `curli --dv-auth SELF -f prod-ltx1 \"d2://...\"` directly\n- Only fall back to Trino when you need aggregate queries across many records\n- Keep curli/grpcurli commands as single lines for easy copy-paste", "memory/projects/oncall/feedback_jira_reply_format.md": "When adding investigation comments to JIRA tickets, use this structure:\n\n**1. Title line** \u2014 State the outcome clearly\n- \"Root Cause Identified and Fixed\"\n- \"Investigated \u2014 Redirecting to [team]\"\n- \"Data Fix Applied \u2014 Please Re-trigger\"\n\n**2. Context** (1-2 sentences) \u2014 What was investigated and scope\n- \"Investigated the repeated MOVE_APPLICATION_DATA failures across all 5 transfers (Mar 16, Mar 23, Mar 24 retries).\"\n\n**3. Root Cause** \u2014 Clear explanation of WHY, not just WHAT\n- Name the specific service, method, and error\n- Explain the data/code issue in plain language\n- Mention if it's persistent vs transient\n\n**4. Error Chain** \u2014 Technical trace showing the full call path\n- Use arrow notation: `service A \u2192 service B \u2192 service C \u2192 FAILS: \"error message\"`\n- Include service names, method names, specific error strings\n\n**5. Fix Applied** \u2014 What was done, when, and how\n- Date of fix\n- Exact action taken (data fix, code fix, config change)\n- Specific values changed\n\n**6. Verification** \u2014 Proof the fix worked\n- Always include the full curli command and raw output in a {code} block\n- Show before/after if possible\n\n**7. Next Step** \u2014 Clear action item for the reader\n- Who needs to do what\n- \"Please re-trigger the transfers\"\n- \"Redirecting to [team] \u2014 cc @person\"\n\n**Why:** Structured RCA comments close tickets faster, reduce back-and-forth, and serve as documentation for future similar issues. The curli verification is critical \u2014 it proves the fix worked and gives others a command to verify themselves.\n\n**How to apply:** Every CSE ticket comment, oncall investigation update, and incident post-mortem note. Skip sections that don't apply (e.g., no \"Fix Applied\" if redirecting to another team).\n\n**IMPORTANT: Always draft the comment and show it to the user for approval BEFORE posting to JIRA. Never post directly.**\n\n**Anti-patterns to avoid:**\n- Don't just say \"investigating\" without findings\n- Don't skip the error chain \u2014 it's the most useful part for future oncall\n- Don't f...", "memory/projects/oncall/reference_hdfs_access.md": "## HDFS Access via Grid Gateway\n\n### Working Steps (verified 2026-03-24)\n```bash\n# 1. Remove stale host key if needed\nssh-keygen -R ltx1-holdemgw01.grid.linkedin.com\n\n# 2. SSH to grid gateway\nssh -K ltx1-holdemgw01.grid.linkedin.com\n\n# 3. Switch to proxy user\nksudo -e mcmhp\n```\n\n### Common Permission Issues\n- Files owned by `metrics:ump033349` (or other users) \u2192 `mcmhp` gets \"Permission denied\"\n- Fix: `hdfs dfs -chmod -R 777 /jobs/<path>` (must run as owner or use SentinelGuard)\n- `-skipTrash` triggers **SentinelGuard** approval \u2192 approve at https://nuage.prod.linkedin.com/workflowApprovalRequestViews#filter=role%3DREQUESTER then re-run same command\n\n### Gotchas\n- `ksudo` only works on grid gateway machines, NOT on laptop\n- `dali --gridproxy` needs interactive MFA \u2014 can't run non-interactively from Claude\n- Azkaban HDFS Browser is useful for browsing: `https://ltx1-holdemaz03.grid.linkedin.com:8443/hdfs/<path>` (set proxy user via \"Change User\" button)\n- Host key changes are common \u2014 always `ssh-keygen -R` first if SSH fails\n\n**Why:** HDFS access is needed for OA tickets (Pinot segment cleanup), DSR data deletion, and mcm-offline operations.\n\n**How to apply:** Use grid gateway SSH + ksudo for HDFS operations. For OA-812 type issues (Pinot segment mismatch), delete the stale output segment directories, not the input data.", "memory/projects/oncall/investigation_purchased_features.md": "## PurchasedHiringPlatformFeatures \u2014 Creation and Lookup\n\n### Creation Flow\n```\nFulfillment Orchestrator (license allocation change)\n  \u2192 hp-ep-mt: HireFulfillmentConfigurationServiceImpl.preFulfillmentChange()\n    \u2192 modifyHiringPlatformFeatures(contractId, productUrn, isNewAllocation, isFullRevoke)\n      \u2192 PurchasedHiringPlatformFeaturesClient.createOrUpdatePurchasedHiringPlatformFeatures()\n        \u2192 hire-access-control: PurchasedHiringPlatformFeaturesResource (PUT)\n          \u2192 Espresso DB: HireAccessControlDB\n```\n\n**When created:** On new license allocation (existingTotalAmount=0, proposedTotalAmount>0) for products in `ALLOWED_PRODUCTS_FOR_PURCHASED_HIRING_PLATFORM_FEATURES`\n**When deleted:** On full revoke (existingTotalAmount>0, proposedTotalAmount=0) \u2014 removes ATS_FEATURES\n\n### Read Flow (hire-access-control)\n`PurchasedHiringPlatformFeaturesServiceImpl.get()`:\n1. If `contract.onlineJobPosting == true` \u2192 returns `JOB_POSTING_FEATURES` directly (no DB hit)\n2. Otherwise \u2192 reads from Espresso DB\n3. If not found \u2192 throws 404\n\n### MINI (RLite/OJ) Contract Special Case\n- MINI contracts should have `onlineJobPosting=true`, which bypasses the DB entirely\n- If `onlineJobPosting=false` on a MINI contract, it falls through to DB \u2192 404 if no record exists\n- PORT-199994: Contract 13002001 is type MINI but `onlineJobPosting=false` \u2192 404\n\n### Impact of Missing Record\n- **mcm-jobs-integration-mt:** `PurchasedHiringPlatformFeatureHelper` gates all workflows \u2192 `_workFlows=[]` \u2192 CLAIM never triggers \u2192 WRAPPABLE_JOB_POSTING stuck\n- **talent-jobs-api / jobposting-relevance:** Can't fetch features \u2192 job posting/promotion fails with \"NO_RECORD_FOUND\"\n\n**Why:** This is a recurring pattern \u2014 missing features blocks multiple flows. Understanding the creation path helps determine if it's a provisioning gap vs accidental deletion.\n\n**How to apply:** When purchasedHiringPlatformFeatures returns 404, check: (1) contract type, (2) onlineJobPosting flag, (3) whether Fulfillment Orchestrator ev...", "memory/projects/oncall/worklog_cse_22364_jobs_report_403.md": "# Worklog: CSE-22364 \u2014 Unable to access Jobs report (403 FORBIDDEN)\n\n**Date:** 2026-03-24\n**Author:** bizhou\n**CSE Ticket:** [CSE-22364](https://linkedin.atlassian.net/browse/CSE-22364)\n**Fix PR:** [talent-reporting-api #2971](https://github.com/linkedin-multiproduct/talent-reporting-api/pull/2971)\n\n---\n\n## Summary\n\nNon-admin users hitting 403 FORBIDDEN when accessing the Jobs report. Root cause: a LIX ramp in mcm-mt started returning cancelled projects from `findByOwner`, which broke a set-match validation in talent-reporting-api.\n\n---\n\n## Root Cause Analysis\n\n### The Trigger: mcm-mt LIX Ramp\n\n- **LIX:** `mcm.hiring.project.finder.refactor.enabled` (constant: `LixUtil.MCM_HIRING_PROJECT_FINDER_REFACTOR`)\n- **JIRA:** [HPLT-16014](https://linkedin.atlassian.net/browse/HPLT-16014) \u2014 \"Refactor the hiring projects finders to use findByCriteria\"\n- **PR:** [mcm-mt #3667](https://github.com/linkedin-multiproduct/mcm-mt/pull/3667) \u2014 merged **2026-03-11** by `pjohn_LinkedIn`, approved by `rading_LinkedIn`\n- **Parent PR:** [mcm-mt #3617](https://github.com/linkedin-multiproduct/mcm-mt/pull/3617) \u2014 merged 2026-02-24 (Step 1+2 of multi-step refactor)\n\n### What Changed in mcm-mt\n\nIn [`HiringProjectsServiceImpl.java`](https://github.com/linkedin-multiproduct/mcm-mt/blob/master/impl/service/src/main/java/com/linkedin/hire/impl/HiringProjectsServiceImpl.java):\n\n**Line 978-981** \u2014 `findByOwner()` LIX gate:\n```java\nif (_lixUtil.isEnabled(LixUtil.MCM_HIRING_PROJECT_FINDER_REFACTOR, hiringContext)) {\n    return findProjectsUsingFindByCriteria(hiringContext, hiringProjectState, start, count, config, owner, viewer);\n}\n```\n\n**Line 1052-1078** \u2014 `findProjectsUsingFindByCriteria()` bug:\n```java\nif (hiringProjectState != null) {\n    query.setHiringProjectStates(new HiringProjectStateArray(...));\n}\n// When hiringProjectState == null \u2192 NO state filter \u2192 returns ALL projects including CANCELLED\n```\n\n**Old path** (`findProjectsUsingGaleneSearch`, line 995-1047): Used Galene/SEAS search which **i...", "memory/projects/oncall/investigation_seat_transfer_move_app_data.md": "When seat transfers fail at MOVE_APPLICATION_DATA step, the root cause is often in hire-identity-service, not mcm-mt.\n\n**Error chain:**\n```\nEP orchestrator (enterpriseProfileMoveJobs) \u2192 MOVE_APPLICATION_DATA FAILED\n  \u2192 mcm-mt SeatTransferNearlineEntityActionEventHandler \u2192 McmException: Unable to fetch all entities\n    \u2192 hire-identity-service HireIdentityV2CopyServiceImpl.copyReference() \u2192 \"HireIdentityV2 cannot miss reference\"\n      \u2192 Espresso HireIdentity record has null referenceEntityUrn (legacy V1 record from 2018)\n```\n\n**Investigation workflow:**\n1. Check EP's enterpriseProfileMoveJobs for the error (errorsV2 \u2192 MOVE_APPLICATION_DATA FAILED)\n2. Search mcm-mt logs for SeatTransferNearlineEntityActionEventHandler errors with the source contract\n3. Search hire-identity-service logs for \"Failed to copy reference\" or \"cannot miss reference\" \u2014 this reveals the blocking hireIdentity ID\n4. Verify the hireIdentity via: `curli -f prod-lor1 --dv-auth SELF -H 'X-RestLi-Protocol-Version:2.0.0' -H 'Accept:application/json' \"d2://hireIdentitiesV2/{id}?contract=urn%3Ali%3Acontract%3A{contractId}\"`\n5. If referenceEntityUrn is null \u2192 data fix needed\n\n**Data fix (direct Espresso write):**\n- SSH to prod shell (ltx1-shell07.prod.linkedin.com)\n- `id-tool grestin -f prod-lor1 sign` (needs Yubikey)\n- D2 service: `EDB-HireIdentity`, path: `/HireIdentity/HireIdentity/{id}`\n- Espresso schema version: 6\n- Set referenceEntityUrn to `urn:li:member:{memberId}` and hiringContextUrn to `urn:li:contract:{contractId}`\n\n**Why:** Legacy V1 hireIdentity records (pre-2018) were created before referenceEntityUrn was mandatory. The copyReference() method hard-fails on these. Retries never succeed \u2014 persistent data issue.\n\n**How to apply:** Any CSE ticket about failed seat transfers with MOVE_APPLICATION_DATA error. Check hire-identity-service logs first for the specific hireIdentity ID.", "memory/projects/oncall/reference_espresso_direct_write.md": "**When to use:** When the service's REST API can't handle the update (e.g., partial update NPEs on null fields), you can write directly to Espresso.\n\n**D2 service naming convention:** `EDB-{DatabaseName}`\n- Example: `EDB-HireIdentity` for the HireIdentity database\n\n**REST API format:** `https://{router-host}:11937/{DatabaseName}/{TableName}/{key}`\n- Example: `https://router-mt-ld-3.prod-lor1.pqd.prod.linkedin.com:11937/HireIdentity/HireIdentity/254318478`\n\n**Finding the router host:** Use curli verbose output \u2014 check `x-espresso-cluster` header to identify the cluster (e.g., `ESPRESSO_MT-LD-3` \u2192 `router-mt-ld-3`)\n\n**Steps:**\n1. SSH to prod shell: `ssh ltx1-shell07.prod.linkedin.com`\n2. Get certs: `id-tool grestin -f {fabric} sign` (needs Yubikey tap)\n3. READ: `curli -X GET 'https://{router}:11937/{db}/{table}/{key}' -k --key ./identity.key --cert ./identity.cert -H 'Accept:application/json'`\n4. WRITE: `curli -X PUT 'https://{router}:11937/{db}/{table}/{key}' -k --key ./identity.key --cert ./identity.cert -H 'Content-Type:application/json' -H 'X-Espresso-Schema-Version:{version}' -d '{json}'`\n5. Verify with another GET\n\n**Gotchas:**\n- Must run from prod shell host, not laptop (ACL)\n- grestin needs interactive Yubikey auth \u2014 can't fully automate\n- Always READ before WRITE to confirm current state\n- Include X-Espresso-Schema-Version header on writes\n- Confluence wiki for router DNS: go/espresso-router-d2-names (page ID 525205209)", "memory/projects/oncall/reference_llm_serving_channel.md": "When talent-agent-service or any HP service hits GenAI/LLM errors (gRPC INTERNAL, \"External provider internal server error\", Azure OpenAI 500/404), escalate to **#ask_llm-serving** on Slack. They own gai-proxy and Azure resource provisioning.", "memory/projects/oncall/reference_pem_kusto.md": "## PEM Kusto Database Access\n\n**Cluster:** `inlogsprodplatform.westus2.kusto.windows.net`\n**Database:** `Pem`\n**Auth:** `az login --tenant \"658728e7-1632-412a-9815-fe53f53ec58b\" --scope \"https://inlogsprodplatform.westus2.kusto.windows.net/.default\"`\n**Token expires every 12 hours** \u2014 re-auth when you see AADSTS70043 errors.\n\n### Key Tables\n\n| Table | Purpose |\n|-------|---------|\n| `DebuggableOopsPageEvent` | Client-side oops pages \u2014 the actual user-visible failures |\n| `FeatureDegradeEvent` | Feature-level degradation \u2014 error counts by endpoint, status code, fabric |\n| `ProductAvailabilityPartialSessionScoreEvent` | Session-level availability scores |\n| `ServerSidePageLoadEvent` | Server-side page load metrics |\n\n### Key Fields \u2014 DebuggableOopsPageEvent\n- `pageKey` \u2014 e.g., `d_talent_contract_chooser`\n- `responseErrorType` \u2014 `SERVER_ERROR`, `NETWORK_ERROR`, `UNCLASSIFIED`\n- `header__auditHeader__fabricUrn` \u2014 **client POP** (NOT serving fabric!)\n- `responseTraceHeaders__fabric` \u2014 **actual serving fabric**\n- `downstreamCallTreeId` \u2014 treeId for trace analysis\n- `memberId` \u2014 affected member\n\n### Key Fields \u2014 FeatureDegradeEvent\n- `downstreamApiEndpointPath` \u2014 e.g., `talent/api/talentContractOptions`\n- `downstreamApiResponseCode` \u2014 HTTP status code\n- `responseErrorType` \u2014 `SERVER_ERROR`, `CLIENT_ERROR`, `UNCLASSIFIED`\n- `fabric` \u2014 serving fabric\n- `downstreamApiTreeId` \u2014 treeId for trace analysis\n- `memberId` \u2014 affected member\n\n### Python Snippet\n```python\nfrom azure.kusto.data import KustoClient, KustoConnectionStringBuilder\nfrom azure.identity import AzureCliCredential\n\ncluster = \"https://inlogsprodplatform.westus2.kusto.windows.net\"\ncredential = AzureCliCredential()\ntoken = credential.get_token(f\"{cluster}/.default\")\nkcsb = KustoConnectionStringBuilder.with_aad_application_token_authentication(cluster, token.token)\nclient = KustoClient(kcsb)\nresponse = client.execute(\"Pem\", query)\n```\n\n**Why:** The standard `kql_fetch_logs` MCP tool uses inLogs API which doesn't have...", "memory/projects/oncall/feedback_frontload_context.md": "When starting an oncall investigation, always front-load context in this order:\n1. Fetch JIRA ticket details first (if ticket exists)\n2. Identify service, fabric, time window, symptoms\n3. Check recent deployments for the affected service\n4. THEN search logs\n\n**Why:** Multiple oncall sessions involve the same stack (Java/gRPC/Trino/HDFS/JIRA/Rootly). Setting context upfront saves repeated orientation time and reduces wrong-approach friction.\n\n**How to apply:** Every oncall investigation session. Use the structured prompt: ticket ID + service + fabric + preferred investigation order.", "memory/projects/oncall/investigation_wrappable_job_posting.md": "## CSE-22355 / CSE-22266: Edit Job Button Greyed Out\n\n**Root cause chain:**\n1. mcm-mt `HiringProjectViewerEntitlementsFacadeImpl.getViewerEntitlementForHiringProject()` \u2014 if project type is `WRAPPABLE_JOB_POSTING`, returns only `CAN_VIEW_HIRING_PROJECT` (no edit)\n2. ts-web `job-action-entitlements.js` `canEditJob()` checks `jobPosting.jobActions.includes('EDIT')` \u2014 without `CAN_EDIT_HIRING_PROJECT`, EDIT action missing \u2192 button greyed out\n\n**Write flow (type conversion):**\n- `mcm-jobs-integration-mt` creates project as `WRAPPABLE_JOB_POSTING` for enterprise wrappable jobs\n- `JobClaimStatusValidator` checks if job is no longer wrappable \u2192 adds `WorkFlow.CLAIM`\n- `HiringProjectClaimProcessor` does `setType(HiringProjectType.RECRUITER)` via partial update to mcm-mt\n- But `PurchasedHiringPlatformFeatureHelper` gates ALL workflows \u2014 if contract missing features, `_workFlows=[]` and CLAIM never triggers\n\n**Key finding for contract 282130:**\n- `purchasedHiringPlatformFeatures` returns 404 \u2192 all workflows skipped \u2192 CLAIM never runs \u2192 project stays WRAPPABLE_JOB_POSTING permanently\n- Other contracts (228994176, 2006173180) self-resolved because they have features and CLAIM eventually ran\n\n**Verification commands:**\n```bash\ncurli --dv-auth self -f prod-ltx1 \"d2://hiringProjects?ids=List((hiringContext:urn%3Ali%3Acontract%3A<contractId>,id:<projectId>))\" -H Accept:application/json -H X-RestLi-Protocol-Version:2.0.0\ncurli --dv-auth self -f prod-ltx1 \"d2://purchasedHiringPlatformFeatures?ids=List(urn%3Ali%3Acontract%3A<contractId>)\" -H Accept:application/json -H X-RestLi-Protocol-Version:2.0.0\n```\n\n**Why:** This pattern recurs \u2014 CSE-22266 was the same issue in Feb 2026. Escalate to EJ oncall for mcm-jobs-integration-mt flow issues.\n\n**How to apply:** When seeing \"Edit Job greyed out\" CSEs, first check project type via curli. If WRAPPABLE_JOB_POSTING, check purchasedHiringPlatformFeatures for the contract.", "memory/projects/memory-migration/research-claude-native-memory.md": "Auto Dream is non-functional as of v2.1.89+. The `/dream` command returns \"Unknown skill\" (#38461, #42237). Feature-flagged behind KAIROS/KAIROS_DREAM. No background consolidation is running despite UI showing \"last ran Xd ago.\"\n\nNative memory is plain markdown \u2014 no structured YAML frontmatter support beyond name/description. The 200-line MEMORY.md cap truncates newest entries first (#40210), meaning the most relevant memories are lost.\n\n**Phase 0 answer:** Dream will NOT preserve custom frontmatter. Proceed with Option B \u2014 disable Dream, own maintenance ourselves.\n\n**Critical bugs:** truncation loses newest (#40210), rules ignored (#45322), inline bloat (#41671), worktree divergence (#44130), no re-load after /compact (#44166).\n\nFull research: `docs/research-claude-native-memory.md` in this repo.", "memory/projects/memory-migration/research-agent-dreaming-landscape.md": "Surveyed 25+ agent memory/dreaming systems. Key findings:\n\n**OpenClaw** has 3-phase biological sleep model (Light/REM/Deep) with 6-signal scoring and promotion thresholds (minRecallCount 3 + minScore 0.8) \u2014 convergent with our dual-threshold graduation.\n\n**Pluton** (Hermes Agent plugin) has 6 analytical perspectives for knowledge extraction and organic wiki with wikilinks \u2014 richer than our 2-track categorization.\n\n**ByteRover** (arXiv:2604.01599) is closest overall architecture \u2014 file-based markdown, maturity tiers, importance scoring, recency decay.\n\n**No published system combines all 5 of our mechanisms:** scoring, graduation, pruning, staleness detection, and session-end retrospectives.\n\n**High-value additions identified:**\n1. Richer extraction perspectives (from Pluton) \u2014 low effort\n2. Wikilinks between insights (from Pluton/GAAMA) \u2014 medium effort\n3. Ebbinghaus decay curves (from SuperLocalMemory) \u2014 low effort\n4. Two-phase consolidation NREM+REM (from TraceMem) \u2014 medium effort\n\nFull research: `docs/research-agent-dreaming-landscape.md` in this repo.", "memory/projects/memory-migration/migration-decision.md": "**Decision:** Option B \u2014 use native memory/ as storage layer with `autoDreamEnabled: false`. Our engines handle all intelligence.\n\n**Why:** Auto Dream is broken (KAIROS-flagged, /dream doesn't work), memory is plain markdown with no metadata awareness, 200-line truncation loses newest entries first. We can't depend on it.\n\n**How to apply:**\n1. Set `autoDreamEnabled: false` in settings \u2014 prevents Dream from interfering\n2. Keep Auto Memory on \u2014 let Claude write observations, our hooks post-process\n3. We own MEMORY.md \u2014 scout hook writes curated index\n4. Subdirectories work fine \u2014 Claude can Read any path, Dream's flat-structure limit irrelevant when Dream is off\n5. Custom frontmatter is safe \u2014 nobody strips metadata with Dream disabled\n6. Graduation pipeline works \u2014 staging > score > promote to memory/insights/ with full frontmatter\n\n**Risk:** Auto Memory may fight our MEMORY.md writes (Claude appends during sessions). Mitigation: PostToolUse hook on Write to detect memory path writes and reconcile.", "memory/feedback/workflow-rules.md": "# Workflow Rules\n\n## Two-Phase Explore-Then-Implement Pattern\n\nFor complex tasks that require understanding unfamiliar code (new features, cross-file refactors, business logic changes):\n\n1. **Phase 1 \u2014 Explore**: Spawn an Explore sub-agent to research the codebase. Return a concise summary of key classes, methods, patterns, and enums involved. Do NOT start implementing.\n2. **Review**: Present the summary to the user for confirmation and course-correction before writing any code.\n3. **Phase 2 \u2014 Implement**: Only after user confirms the exploration summary, begin implementation with a clear plan.\n\n**Why**: User prefers targeted action over open-ended searching. Avoid spending 20+ tool calls exploring without producing code. Keep the main conversation context clean by offloading exploration to sub-agents.\n\n**Exception**: Skip phase 1 for simple/targeted tasks where the scope is already clear (single-file edits, known file paths, small bug fixes).\n\n## Config File Editing Rule\n\nWhen editing config files (tmux.conf, shell configs, settings.json, allowlists, etc.):\n\n1. **Read the existing file first** \u2014 always understand what's already there.\n2. **Make targeted additions/edits** \u2014 use the Edit tool to change only what's needed. Never replace the entire file.\n3. **Preserve existing settings** \u2014 don't overwrite or reorganize the user's existing config.\n4. **Confirm before overwriting** \u2014 if a full rewrite is truly necessary, ask first.\n\n**Why**: User has been burned by Claude replacing entire configs (tmux, allowlists), requiring rollbacks and wasted time.\n\n## Build & Test Rule\n\nWhen making code changes in Java projects:\n\n1. **Always run tests** before considering a task complete.\n2. **Run from the correct directory** \u2014 use `mint build` or the appropriate build command from the correct module directory, not the repo root.\n3. **If tests fail, fix them** \u2014 don't leave the task in a broken state.\n\n**Why**: Multiple sessions had friction from running builds in the wrong director...", "memory/feedback/feedback_proactive_commits.md": "After completing a logical unit of work (e.g., fixing a bug, adding a feature, updating tests), proactively suggest committing instead of waiting for the user to ask.\n\n**Why:** User's commit rate is low relative to work done \u2014 logical checkpoints often pass without being captured, leading to large mixed commits later.\n\n**How to apply:** After finishing a code change that passes build/tests, say something like \"This is a good checkpoint to commit. Want me to commit these changes?\" Don't force it \u2014 just suggest.", "memory/feedback/feedback-frontload-context.md": "When investigating or debugging, front-load the specific service, file, processor, or API tool in the prompt rather than exploring broadly first.\n\n**Why:** Across 32 sessions, 28 instances of wrong-approach friction came from Claude exploring the wrong component before the user redirected. Examples: investigating ExportStatusEventProcessor instead of ApplicationStageProcessor, using Trino instead of curli, checking contract-type instead of seat-level entitlement. Each wrong path cost 3-5 rounds of correction.\n\n**How to apply:**\n- If the user specifies a file/service/tool \u2192 go there immediately, don't explore alternatives first\n- If the user doesn't specify \u2192 ask \"I think this involves [ComponentA]. Should I start there?\" before investigating. The cost of asking is 10 seconds; the cost of a wrong path is 20+ minutes.\n- When starting any investigation, prefer the prompt pattern: \"Investigate [issue] starting at [specific file/service]. Use [specific tool]. Do NOT explore [known wrong path].\"\n- For data lookups: default to curli/REST, not Trino/SQL\n- For logs: default to observe-agent, not grep/manual Kusto\n- For code fixes: target the minimal correct layer (shared service > processor)", "memory/feedback/feedback_plugin_triggers.md": "Proactively invoke these plugin skills in the right context \u2014 don't wait for the user to ask.\n\n### kafka-flink (linkedin-framework)\n- **When**: Touching Kafka consumers, TrackerProcessor, topic configs, Samza/nearline processors\n- **How**: Invoke `kafka-flink` skill before implementing to check patterns\n- **Why**: Many MPs are Kafka-based; framework guidance prevents infra mistakes\n\n### linkedin-frameworks (linkedin-framework)\n- **When**: Adding new Offspring factories, boot listeners, D2 client wiring, Rest.li resources, or DI patterns\n- **How**: Invoke `linkedin-frameworks` skill to check correct patterns\n- **Why**: Offspring/D2/Rest.li have LinkedIn-specific conventions that differ from standard Spring/gRPC\n\n### library-specs (spec-generation / fix)\n- **When**: Adding or bumping dependencies in `product-spec.json`, or hitting version set conflicts during `mint build`\n- **How**: `library-specs:spec-generation` for new deps, `library-specs:fix` for version conflicts\n- **Why**: Specs document correct usage; version conflicts have known resolution patterns\n\n### copy-rule-file / unignore-file (mp-rules)\n- **When**: Creating new MP modules, modifying `.gitignore`, or needing build rule customization\n- **How**: Invoke the relevant mp-rules skill\n- **Why**: MP rules have specific conventions; wrong rules cause hard-to-debug build failures\n\n### linkedin-plugin-creator:plugin-creation\n- **When**: User asks to create a new skill or plugin, or after `/integrate` identifies a gap\n- **How**: Invoke for full scaffold with ACL, crew ownership, taxonomy\n- **Why**: Ensures new plugins follow LinkedIn's plugin ecosystem conventions\n\n**How to apply:** Check these triggers during Phase 1 (Research) and Phase 4 (Execute). Invoke BEFORE writing code. If skill patterns conflict with existing code, follow existing code (consistency > correctness for conventions).", "memory/project/plan-memory-native-migration.md": "## Problem\n\nWe're maintaining two parallel knowledge systems:\n- **Claude Native** (memory/MEMORY.md + 13 files, Auto Dream consolidates) \u2014 simple, maintained by Anthropic\n- **Our Custom** (rules/MEMORY.md 26KB + learnings/ 63 insights + evals/ + hooks/) \u2014 complex, WE maintain\n\nThis happened because Claude didn't have good memory when we started. Now it does. We're fighting a maintenance battle Anthropic is already solving.\n\n**Why:** Our job shifts from STORING knowledge to GENERATING and EVALUATING it. Let Claude's native system handle storage and maintenance.\n\n```\nOLD: We store + maintain + retrieve + evaluate\nNEW: We generate + evaluate \u2192 Claude stores + maintains \u2192 we retrieve\n```\n\n## Target Architecture\n\n```\n\u250c\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2510\n\u2502              CLAUDE MEMORY (Single Knowledge Store)        \u2502\n\u2502                                                          \u2502\n\u2502  memory/MEMORY.md \u2014 index (Auto Dream keeps < 200 lines) \u2502\n\u2502                                                          \u2502\n\u2502  memory/                                                  \u2502\n\u2502  \u251c\u2500\u2500 user/                                               \u2502\n\u2502  \u2502   \u251c\u2500\u2500 role.md              (SDE, HP backend team)     \u2502\n\u2502  \u2502   \u2514\u2500\u2500 preferences.md       (terse, no emoji, etc.)    \u2502\n\u2502  \u251c\u2500\u2500 feedback/                                           \u2502\n\u2502  \u2502   \u251c\u2500\u2500 approach-rules.md    (hypothesis-first, etc.)   \u2502\n\u2502  \u2502   \u251c\u2500\u2500 tool-rules.md        (curli-first, observe-agent)\u2502\n\u2502  \u2502   \u251c\u2500\u2500 principle-scores.md  (eval-driven, 85.1%)       \u2502\n\u2502  \u2502   \u2514\u2500\u2500 frontload-context.md (28 instances)             \u2502\n\u2502  \u251c\u2500\u2500 project/                                            \u2502\n\u2502  \u2502   \u251c\u2500\u2500 connected-projects.md (phase 2, active PRs)     \u2502\n\u2502  \u2502   \u251c\u2500\u2500 dev-tooling.md       (VM parity, skills status)  \u2502\n\u2502  \u2502   \u2514\u2500\u2500 active-work.md       (current initiatives)       \u2502\n\u2502  \u251c\u2500\u2500 reference/                                          \u2502\n\u2502  \u2502   \u251c\u2500\u2500 espresso-metrics.md  (MD-2 cluster)             \u2502\n\u2502  \u2502   \u251c\u2500\u2500 test-environments.md (Greenhouse sandbox)...", "memory/eval/compat-status.md": "| Feature | Status | Adoption | Issues | Notes |\n|---------|--------|----------|--------|-------|\n| Auto Dream /dream command works | not_available | architecture_change | #38461, #42015 | Cannot confirm /dream works without interactive session. Che |\n| PreMemoryWrite/PostMemoryWrite hooks available | not_available | auto_replace | #44820 | Checked settings.json for memory hook event references |\n| Native memory access tracking metadata | not_available | auto_augment | #40806 | No access metadata found in memory files |\n| MEMORY.md truncation preserves newest entries | not_available | auto_augment | #40210 | Cannot confirm fix without controlled test. Bug #40210 statu |\n| Dream indexes subdirectory files | available | architecture_change | #40614 | Checked MEMORY.md for subdirectory references (may be our ow |\n| Team/org memory sharing available | not_available | architecture_change | #38536 | Checked settings.json for team memory references |", "memory/eval/eval-behavioral-gates.md": "## Approach Selection (12 wrong_approach failures, +9.7% if fixed)\n\n- Ask which component FIRST. Present 2-3 hypotheses. Wait for confirmation.\n- \"Compare with our system\" / \"I feel like X\" \u2192 lead with mapping to our context, not standalone description.\n- \"Check\" / \"monitor\" / \"verify\" \u2192 read-only. Do NOT initiate actions.\n- 3-strike rule: same tool, same error, 3x \u2192 switch strategy or ask.\n- When redirected, HARD STOP. Pivot immediately.\n\n## Tool Selection (11 tool_misuse failures, +8.9% if fixed)\n\n- curli/grpcurli: LOCAL first. VM only if local auth fails.\n- Logs: observe-agent FIRST. Not Slack, not KQL, not local grep.\n- PDF: Read tool (built-in). Web pages: Playwright for rich, WebFetch for simple.\n- MCP tools: get_tool_info BEFORE calling unfamiliar tools.\n- Most direct tool: Built-in > MCP > external. Local > remote.\n\n## Principle Adherence (61 violations, 85.1% adherence)\n\n- **Verify before asserting** (14 violations): Cross-check mental models. \"Is this really X?\"\n- **Never guess values** (13 violations): Specific values require specific sources. No source = \"I'd need to verify.\"\n- **Assume complex** (9 violations): Check file count, callers, tests before estimating scope.\n- **Cite file:line** (7 violations): Every code behavior claim needs a source.\n\n## Compound Learning (10% loop closure)\n\n- Every 3+ task session \u2192 generate >= 1 insight.\n- Log insight outcomes in real-time, not just at SessionEnd.\n- Proactively suggest /compound after: 5+ tasks, user redirection, bug fix, or 2+ hours.\n\n## Over-Engineering (10 failures)\n\n- When user gives clear direction \u2192 execute, don't re-question.\n- Match ceremony to scope. Bug fix = fix. Feature = feature. Not more.", "memory/eval/phase0-frontmatter-test.md": "This is a test memory file for Phase 0 of the memory-native migration.\n\n**Purpose:** Verify that Auto Dream preserves custom frontmatter fields that our compound learning system depends on.\n\n**Fields to check after next Auto Dream cycle:**\n- `outcome_score: 0` \u2014 must survive as-is\n- `use_count: 3` \u2014 must survive as-is\n- `tags: [\"phase0\", \"test\", \"frontmatter\", \"migration\"]` \u2014 must survive as array\n- `test_created: \"2026-04-11\"` \u2014 must survive as string\n- `custom_nested` object \u2014 must survive with children\n\n**How to verify:** Compare this file's frontmatter before and after Auto Dream runs. If any custom field is stripped, modified, or moved, the migration plan must adjust (insights stay in staging, only summaries graduate to memory).\n\n**Original checksum fields (for diff):**\n```\noutcome_score=0 use_count=3 tags=4items test_created=2026-04-11 custom_nested=2keys\n```", "memory/eval/eval-principle-scores.md": "## Principle Eval Baseline (2026-04-08, 32 sessions)\n\n**Overall: 85.1% adherence** (349/410 followed), Foundation P0: 0.84\n\n### Foundation Breakdown\n| Principle | Score | Note |\n|-----------|-------|------|\n| Integrity | 0.90 | No quality shortcuts |\n| Gratitude | 0.90 | Reads code before changing |\n| Stewardship | 0.88 | Leaves code better |\n| Purpose | 0.87 | Connects to user's goal |\n| Humility | 0.85 | Asks, but sometimes overconfident |\n| Patience | 0.82 | Lowest \u2014 rushes, retries without rethinking |\n\n### Top Violations\n1. verify_own_understanding (14x) \u2014 asserts without cross-checking\n2. never_guess_values (13x) \u2014 fabricates config/URN/URL values\n3. nothing_ever_trivial (9x) \u2014 underestimates compilation/refactoring scope\n4. cite_code_references (7x) \u2014 claims without file:line\n\n### Strengths\n- root_causes_not_symptoms \u2014 consistently strong\n- data_driven \u2014 uses real data, trace IDs\n- try_tools \u2014 attempts tools before giving up\n\n**How to apply:** Before asserting any specific value, file path, or code behavior \u2014 verify it. If you haven't read it from the code or API, say \"I'd need to check.\"", "memory/eval/skill-audit-2026-04-11.md": "## Audit Date: 2026-04-11\n\n### Replace with Native Tools (4)\n- **wait-for** \u2192 CronCreate (durable) + condition check. Same pattern, native scheduling.\n- **loop** \u2192 CronCreate with recurring=true. Direct equivalent.\n- **checkpoint** \u2192 Just sync.sh push + read last-session-summary.txt. Too thin for a skill.\n- **standup** \u2192 Read commit-log + pr-log + active-work.md inline. Simplify to one-liner.\n\n### Simplify with Native Tools (6)\n- **ship** \u2192 Replace chained /wait-for with CronCreate + Monitor. Simpler.\n- **watch-deps** \u2192 CronCreate (daily) + diff script + Monitor.\n- **session-handoff** \u2192 Redundant with memory system (last-session-summary.txt + active-work.md).\n- **recipe vm-login** \u2192 One command: `ssh -t vm 'tmux attach'`.\n- **recipe vm-setup** \u2192 Duplicate of vm-bootstrap.sh.\n- **recipe auth-preflight** \u2192 Already in scout hook.\n\n### Keep Custom (32)\nCore: compound, dream, research, investigate, implement, explore, scope, find, verify, think\nCapture: learn, aha, eureka, worklog (auto-run)\nMeta: improve-agent, integrate, kickoff, recipe, share, export-session, scout\nLinkedIn: oncall, triage-alert, hp-pipeline-pem, hp-contract-chooser-pem, hiring-platform,\n  search-inlogs, deploy-check, validate-qprod, pr-fix, lix, oncall-daily-digest, oncall-trunk-health\nTools: delegate, markitdown, playwright-cli\n\n### Decision\n- worklog: KEEP + auto-run (user decision)\n- All others per audit above", "memory/eval/eval-system-architecture.md": "## Three-Layer Architecture\n\n### Layer 1: Auto Memory + Auto Dream (Anthropic Native)\n**What lives here:** Summaries, preferences, graduated knowledge, eval findings.\n**Format:** Markdown files with YAML frontmatter in memory/.\n**Who maintains:** Auto Dream consolidates automatically (24hrs + 5 sessions).\n**What should migrate here:**\n- Graduated insights (promoted from compound learning)\n- Eval findings (beh
